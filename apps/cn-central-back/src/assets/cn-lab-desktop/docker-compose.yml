version: "3"
services:

  glab:
    image: registry.gitlab.com/constellab/public/docker-registry/glab-cpu:${GLAB_TAG}
    environment:
      - LAB_ID=${LAB_ID}
      - LAB_NAME=${LAB_NAME}
      - LAB_MODE=prod
      - LAB_ENVIRONMENT=DESKTOP
      - LAB_PROD_API_URL=http://localhost:3100
      - LAB_DEV_API_URL=http://codelab:3000
      - CENTRAL_API_KEY=${CENTRAL_API_KEY}
      - CENTRAL_API_URL=${CENTRAL_API_URL}
      - FRONT_URL=http://localhost:80
      - FRONT_VERSION=${FRONT_VERSION}
      - CONDA_VERSION=latest
      - GPU=
      - VIRTUAL_HOST=
      - BIOTA_BIODATA_DIR=/data/gws_biota/biodata/
      - SECRET_KEY=${SECRET_KEY}
      # COMMUNITY
      - COMMUNITY_API_URL=${COMMUNITY_API_URL}
      - COMMUNITY_FRONT_URL=${COMMUNITY_FRONT_URL}
      - COMMUNITY_API_KEY=
      # GWS_CORE database
      - GWS_CORE_DB_HOST=gws_core_prod_db
      - GWS_CORE_DB_USER=gws_core
      - GWS_CORE_DB_PASSWORD=${GWS_CORE_PROD_DB_PASSWORD}
      - GWS_CORE_DB_NAME=gws_core
      - GWS_CORE_DB_PORT=3306
      # GWS_BIOTA database
      - GWS_BIOTA_DB_HOST=gws_biota_db
      - GWS_BIOTA_DB_USER=gws_biota
      - GWS_BIOTA_DB_PASSWORD=gencovery
      - GWS_BIOTA_DB_NAME=gws_biota
      - GWS_BIOTA_DB_PORT=3306
    depends_on:
      - gws_core_prod_db
    volumes:
      - lab-desktop-${LAB_ID}-lab:/lab
      - lab-desktop-${LAB_ID}-logs:/logs
      - lab-desktop-${LAB_ID}-data:/data
      - lab-desktop-${LAB_ID}-settings:/conf/settings
      - ./config.json:/conf/config.json:ro
    networks:
      - lab-desktop-network-${LAB_ID}
    restart: on-failure:5
    container_name: glab
    ports:
      - 3100:3000

  # Codelab
  codelab:
    image: registry.gitlab.com/constellab/public/docker-registry/codelab-cpu:${GLAB_TAG}
    environment:
      - LAB_ID=${LAB_ID}
      - LAB_NAME=${LAB_NAME}
      - LAB_MODE=dev
      - LAB_ENVIRONMENT=DESKTOP
      - LAB_PROD_API_URL=http://glab:3000
      - LAB_DEV_API_URL=http://localhost:3101
      - FRONT_URL=http://localhost:80
      - FRONT_VERSION=${FRONT_VERSION}
      - CONDA_VERSION=latest
      - GPU=
      - VIRTUAL_HOST=
      - BIOTA_BIODATA_DIR=/data/gws_biota/biodata/
      - SECRET_KEY=${SECRET_KEY}
      # COMMUNITY
      - COMMUNITY_API_URL=${COMMUNITY_API_URL}
      - COMMUNITY_FRONT_URL=${COMMUNITY_FRONT_URL}
      - COMMUNITY_API_KEY=
      # GWS_CORE database
      - GWS_CORE_DB_HOST=gws_core_dev_db
      - GWS_CORE_DB_USER=gws_core
      - GWS_CORE_DB_PASSWORD=${GWS_CORE_DEV_DB_PASSWORD}
      - GWS_CORE_DB_NAME=gws_core
      - GWS_CORE_DB_PORT=3306
      # GWS_BIOTA database
      - GWS_BIOTA_DB_HOST=gws_biota_db
      - GWS_BIOTA_DB_USER=gws_biota
      - GWS_BIOTA_DB_PASSWORD=gencovery
      - GWS_BIOTA_DB_NAME=gws_biota
      - GWS_BIOTA_DB_PORT=3306
    depends_on:
      - gws_core_dev_db
    volumes:
      - lab-desktop-${LAB_ID}-dev-lab:/lab
      - lab-desktop-${LAB_ID}-dev-logs:/logs
      - lab-desktop-${LAB_ID}-dev-data:/data
      - lab-desktop-${LAB_ID}-dev-settings:/conf/settings
      - ./config.json:/conf/config.json:ro
    networks:
      - lab-desktop-network-${LAB_ID}
    container_name: codelab
    ports:
      - 8081:8080
      - 3101:3000


  # Front
  front:
    image: registry.gitlab.com/constellab/public/docker-registry/lab-front:${FRONT_VERSION}
    environment:
      - API_URL=http://localhost:3100
      - LAB_PROD_API_URL=http://localhost:3100
      - LAB_DEV_API_URL=http://localhost:3101
      - CODELAB_URL=http://localhost:8081
      - VIRTUAL_HOST=
      - CENTRAL_FRONT_URL=${CENTRAL_FRONT_URL}
      - CENTRAL_API_URL=${CENTRAL_API_URL}
      - COMMUNITY_FRONT_URL=${COMMUNITY_FRONT_URL}
      - COMMUNITY_API_URL=${COMMUNITY_API_URL}
      - CAPTCHA_SITE_KEY= # set to empty to disable captcha
    networks:
      - lab-desktop-network-${LAB_ID}
    container_name: front
    ports:
      - 80:81

  # GWS Core Production DB
  gws_core_prod_db:
    image: mariadb:10.7.4
    command: --max_allowed_packet=256M
    environment:
      - MYSQL_ROOT_PASSWORD=${GWS_CORE_PROD_DB_PASSWORD}
      - MYSQL_USER=gws_core
      - MYSQL_PASSWORD=${GWS_CORE_PROD_DB_PASSWORD}
      - MYSQL_DATABASE=gws_core
    volumes:
      - lab-desktop-${LAB_ID}-gws-core-prod-db:/var/lib/mysql
    networks:
      - lab-desktop-network-${LAB_ID}
    container_name: gws_core_prod_db
    ports:
      - 3406:3306

  # GWS Core Development DB
  gws_core_dev_db:
    image: mariadb:10.7.4
    command: --max_allowed_packet=256M
    environment:
      - MYSQL_ROOT_PASSWORD=${GWS_CORE_DEV_DB_PASSWORD}
      - MYSQL_USER=gws_core
      - MYSQL_PASSWORD=${GWS_CORE_DEV_DB_PASSWORD}
      - MYSQL_DATABASE=gws_core
    volumes:
      - lab-desktop-${LAB_ID}-gws-core-dev-db:/var/lib/mysql
    networks:
      - lab-desktop-network-${LAB_ID}
    container_name: gws_core_dev_db
    ports:
      - 3407:3306

  # GWS Test db
  test_gws_dev_db:
    image: mariadb:10.7.4
    command: --max_allowed_packet=256M
    environment:
      - MYSQL_ROOT_PASSWORD=gencovery
      - MYSQL_USER=test_gws
      - MYSQL_PASSWORD=gencovery
      - MYSQL_DATABASE=test_gws
    volumes:
      - lab-desktop-${LAB_ID}-test-gws-dev-db:/var/lib/mysql
    networks:
      - lab-desktop-network-${LAB_ID}
    container_name: test_gws_dev_db
    ports:
      - 3408:3306

  #START_BIOTA_DB The start and end comments are used by the script to replace the content of the file
  # GWS Biota Production DB
  gws_biota_db:
    image: mariadb:10.7.4
    command: --max_allowed_packet=256M
    environment:
      - MYSQL_ROOT_PASSWORD=gencovery
      - MYSQL_USER=gws_biota
      - MYSQL_PASSWORD=gencovery
      - MYSQL_DATABASE=gws_biota
    volumes:
      - ./mariadb:/var/lib/mysql
    networks:
      - lab-desktop-network-${LAB_ID}
    container_name: gws_biota_db
    ports:
      - 3409:3306
  #END_BIOTA_DB


volumes:
  lab-desktop-${LAB_ID}-lab:
  lab-desktop-${LAB_ID}-logs:
  lab-desktop-${LAB_ID}-data:
  lab-desktop-${LAB_ID}-settings:
  lab-desktop-${LAB_ID}-dev-lab:
  lab-desktop-${LAB_ID}-dev-logs:
  lab-desktop-${LAB_ID}-dev-data:
  lab-desktop-${LAB_ID}-dev-settings:
  lab-desktop-${LAB_ID}-gws-core-prod-db:
  lab-desktop-${LAB_ID}-gws-core-dev-db:
  lab-desktop-${LAB_ID}-test-gws-dev-db:


networks:
  lab-desktop-network-${LAB_ID}:
    external: false

<fl-card>

  <fl-card-header>
    <h2>{{'smart_db.management' | translate}}</h2>
  </fl-card-header>
  <fl-card-body>
    <div fxLayout="row wrap" fxLayoutAlign="start center" fxLayoutGap="1em">
      <a mat-stroked-button [href]="downloadUrl" download class="g-button-small">
        <mat-icon>cloud_download</mat-icon>
        {{'smart_db.download' | translate}}
      </a>


      <button mat-stroked-button type="button" (click)="openUploadDialog()" class="g-button-small">
        <mat-icon>cloud_upload</mat-icon>
        {{'smart_db.upload_data' | translate}}
      </button>
    </div>
  </fl-card-body>

</fl-card>

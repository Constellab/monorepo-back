<div class="g-page">

  <fl-async-section [arrayObs]="smartDbs$" emptyText="no_smart_db">

    <fl-section-header class="g-page-title">
      <fl-text-icon iconPosition="start">
        <mat-icon class="g-icon-big g-icon-background g-primary-background" flIcon="smart_db"></mat-icon>
        <h1>{{'my_smart_db' | translate}}</h1>
      </fl-text-icon>

      <fl-section-actions *caIsAdmin>
        <button mat-stroked-button type="button"
                (click)="openCreateSmartDbDialog()">
          <mat-icon>add</mat-icon>
          {{'smart_db.create' | translate}}
        </button>
      </fl-section-actions>
    </fl-section-header>

    <ng-container *flSectionBody="let smartDbs">
      <div class="g-grid-5-rows">
        <a *ngFor="let smartDb of smartDbs" [routerLink]="smartDb | caDetailRoute">
          <ca-smart-db-card [smartDb]="smartDb"></ca-smart-db-card>
        </a>
      </div>

      <fl-infinite-load-more-result [datasource]="smartDbs$"></fl-infinite-load-more-result>
    </ng-container>

  </fl-async-section>

</div>

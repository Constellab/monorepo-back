<div class="g-page-fixed" fxLayout="column">

  <fl-async-section [object]="smartDb$">

    <ng-container *flSectionBody="let smartDb">

      <!--  Header with the search -->
      <div>

        <div fxLayout="row" fxLayoutAlign="space-between center">
          <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="1em">
            <h1>{{'smart_db.smart_db' | translate}} : {{smartDb.name}}</h1>
            <fl-status-chip [status]="smartDb.type" mode="iconText"></fl-status-chip>
          </div>

          <div>
            <a mat-stroked-button class="g-button-small" [routerLink]="adminRoute" *caIsAdmin>
              <mat-icon>admin_panel_settings</mat-icon>
              {{'smart_db.admin' | translate}}
            </a>
          </div>
        </div>

        <form (ngSubmit)="submit()"
              fxLayout="row wrap" fxLayoutAlign="start center" fxLayoutGap="1em">

          <!--    Search      -->
          <mat-form-field fxFlex="auto" class="g-form-field-no-hint">
            <mat-label>{{'smart_db.search_field' | translate}}</mat-label>
            <input matInput [formControl]="formControl" [flAutofocus]="0"
                   placeholder="{{'smart_db.search_field' | translate}}">
          </mat-form-field>

          <div class="button">
            <button mat-flat-button color="primary" type="submit">
              <mat-icon>search</mat-icon>
              {{'smart_db.search' | translate}}
            </button>
          </div>
        </form>

      </div>


      <!-- Result  -->
      <div fxFlex="auto" class="g-grow-max-height g-scrollable-element" fxLayout="row" fxLayoutGap="1em">

        <fl-infinite-scroll [datasource]="datasource" fxFlex="60%">
          <!--   Number of results   -->
          <p class="g-text-small g-text-light">
            <ng-container *ngIf="datasource.page?.totalElements > 0">
              {{'smart_db.count_result' | translate:{count: datasource.page?.totalElements} }}
            </ng-container>
          </p>


          <div *ngFor="let doc of datasource.connect() | async">
            <ca-smart-db-search-doc-result [doc]="doc" class="result"></ca-smart-db-search-doc-result>
          </div>
        </fl-infinite-scroll>

        <div fxFlex="40%">
          <ca-smart-db-doc-card [smartDbId]="smartDbId" [doc]="selectedDoc$ | async"
                                [showDetailPageLink]="true"></ca-smart-db-doc-card>
        </div>

      </div>
    </ng-container>
  </fl-async-section>
</div>

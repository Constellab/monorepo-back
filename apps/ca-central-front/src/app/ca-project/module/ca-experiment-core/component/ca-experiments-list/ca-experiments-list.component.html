<fl-card>
  <fl-card-header>
    <fl-text-icon>
      <mat-icon flIcon="experiment"></mat-icon>
      <h2>{{'experiments' | translate}}</h2>
    </fl-text-icon>
  </fl-card-header>

  <fl-card-body>
    <fl-async-section [object]="experiments$" emptyText="no_experiment">
      <ng-container *flSectionBody="let experiments">
        <ca-experiment-table [datasource]="experiments" [columns]="columns"
                             [rowSelectable]="rowSelectable"
                             (experimentSelected)="selectExperiment($event)"></ca-experiment-table>
      </ng-container>
    </fl-async-section>

  </fl-card-body>

</fl-card>

<tr *ngIf="isInterface">
  <td class="node-port">
    <h4>{{intOut.name}}</h4>
  </td>
  <td class="icon-box">
    <mat-icon class="g-icon-big icon">trending_flat</mat-icon>
  </td>
  <td class="node-port">
    <h4>{{intOut.to.node}}</h4>
    <p class="g-text-small g-text-light">{{intOut.to.port}}</p>
  </td>
</tr>

<tr *ngIf="!isInterface">
  <td class="node-port">
    <h4>{{intOut.from.node}}</h4>
    <p class="g-text-small g-text-light">{{intOut.from.port}}</p>
  </td>
  <td class="icon-box">
    <mat-icon class="g-icon-big icon">trending_flat</mat-icon>
  </td>
  <td class="node-port">
    <h4>{{intOut.name}}</h4>
  </td>
</tr>

<div class="g-page">

  <fl-async-section [arrayObs]="projectsDatasource" emptyText="no_project">

    <fl-section-header class="g-page-title">
      <fl-text-icon iconPosition="start">
        <mat-icon class="g-icon-big g-icon-background g-primary-background">folder</mat-icon>
        <h1>{{'my_projects' | translate}}</h1>
      </fl-text-icon>

      <fl-section-actions>
        <button mat-flat-button type="button" color="accent"
                (click)="openCreateProjectDialog()" class="g-button-small">
          <mat-icon>add</mat-icon>
        </button>

      </fl-section-actions>
    </fl-section-header>

    <ng-container *flSectionBody="let projects">
      <div class="g-grid-5-rows">
        <a *ngFor="let project of projects" [routerLink]="project | caDetailRoute">
          <ca-project-card [project]="project"></ca-project-card>
        </a>
      </div>

      <fl-infinite-load-more-result [datasource]="projectsDatasource"></fl-infinite-load-more-result>
    </ng-container>

  </fl-async-section>

</div>

<div fxLayout="column" class="g-full-height">
  <h1>{{report.title}}</h1>

  <fl-article-container fxFlex="auto">

    <fl-article-left-side>

      <!--  Validated info  -->
      <ca-validated-object-info class="separator" [object]="report"
                                *ngIf="report.isValidated"></ca-validated-object-info>

      <!-- Sync info -->
      <ca-sync-object-info class="separator" [object]="report"></ca-sync-object-info>


      <!--  Created by & Last modified bt  -->
      <p class="g-text-small g-text-light">
        <fl-creation-info [user]="report.createdBy"
                          [date]="report.createdAt"></fl-creation-info>
      </p>
      <p class="g-text-small g-text-light">
        <fl-last-modification-info [user]="report.lastModifiedBy"
                                   [date]="report.lastModifiedAt"></fl-last-modification-info>
    </fl-article-left-side>

    <fl-article>
      <ca-report-content [reportId]="report.id"></ca-report-content>
    </fl-article>

    <fl-article-right-side>
      <button mat-stroked-button type="button" (click)="printReport()"
              class="g-button-small print-button">
        {{'print_report' | translate}}
        <mat-icon>print</mat-icon>
      </button>
      <ca-experiments-list [experiments]="experiments" mode="small"></ca-experiments-list>
    </fl-article-right-side>
  </fl-article-container>
</div>

<button mat-icon-button [matMenuTriggerFor]="menu">
  <mat-icon>more_vert</mat-icon>
</button>
<mat-menu #menu="matMenu" xPosition="before">
  <ng-container *ngIf="showViewLinks">
    <a mat-menu-item type="button" *ngIf="document.isConstellabDocument; else normalDoc"
       [routerLink]="document | caDetailRoute">
      <mat-icon>visibility</mat-icon>
      <span>{{'view_document' | translate}}</span>
    </a>

    <ng-template #normalDoc>
      <a mat-menu-item type="button" [href]="getDocumentPreviewUrl()" target="_blank">
        <mat-icon>visibility</mat-icon>
        <span>{{'preview_document' | translate}}</span>
      </a>

      <a mat-menu-item type="button" [href]="getDocumentDownloadUrl()" download>
        <mat-icon>download_document</mat-icon>
        <span>{{'download_document' | translate}}</span>
      </a>
    </ng-template>
  </ng-container>

  <button mat-menu-item type="button" (click)="renameDocument()">
    <mat-icon>edit</mat-icon>
    <span>{{'rename_document' | translate}}</span>
  </button>

  <button mat-menu-item type="button"
          class="g-warn-text" (click)="deleteDocument()">
    <mat-icon color="warn">clear</mat-icon>
    <span>{{'delete_document' | translate}}</span>
  </button>
</mat-menu>

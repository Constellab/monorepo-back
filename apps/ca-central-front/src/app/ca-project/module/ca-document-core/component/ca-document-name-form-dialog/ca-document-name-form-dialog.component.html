<fl-dialog-header>
  {{title | translate}}
</fl-dialog-header>

<mat-dialog-content>

  <form (ngSubmit)="submit()" id="doc-name-form" [formGroup]="formGp">

    <!--  Name  -->
    <mat-form-field class="g-form-input">
      <mat-label>{{'name' | translate}}</mat-label>
      <input matInput formControlName="name" required [flInputMaxLength]="255"
             [placeholder]="'name' | translate">
      <mat-error *ngIf="formGp.get('name').hasError('required')">
        {{'name' | flErrorRequired}}
      </mat-error>
    </mat-form-field>


  </form>
</mat-dialog-content>

<div mat-dialog-actions class="g-centered">
  <button mat-raised-button color="primary" type="submit" form="doc-name-form">
    {{'save' | translate}}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>

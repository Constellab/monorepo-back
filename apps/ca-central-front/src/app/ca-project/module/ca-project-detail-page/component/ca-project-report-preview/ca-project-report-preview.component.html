<div class="container">
  <div fxLayout="row" fxLayoutAlign="space-between" class="header"
       *ngIf="report$ | async as report">

    <fl-text-icon>
      <mat-icon flIcon="report"></mat-icon>
      <h2>{{report.title}}</h2>
    </fl-text-icon>

    <div>
      <a mat-stroked-button class="g-button-small"
         [routerLink]="report | caDetailRoute">
        {{'open_details' | translate}}
      </a>
    </div>
  </div>

  <ca-report-content [reportId]="reportId$ | async" class="report-content"></ca-report-content>
</div>

<fl-dialog-header>
  {{'configure_project_storage' | translate}}
</fl-dialog-header>

<mat-dialog-content>

  <p class="help-text">
    {{'configure_project_storage_help' | translate}}
  </p>
  <form (ngSubmit)="submit()" id="cloud-provider-form" [formGroup]="formGp">


    <!--  Region  -->
    <mat-form-field class="g-form-input">
      <mat-label>{{'cloud_provider_region' | translate}}</mat-label>
      <mat-select formControlName="region" required [placeholder]="'cloud_provider_region' | translate">
        <ca-select-cloud-provider-region-options mode="s3"></ca-select-cloud-provider-region-options>
      </mat-select>
      <mat-error *ngIf="formGp.get('region').hasError('required')">
        {{'cloud_provider_region' | flErrorRequired}}
      </mat-error>
    </mat-form-field>

  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button color="primary" type="submit" form="cloud-provider-form"
          class="g-centered-forced">
    {{'save' | translate}}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>

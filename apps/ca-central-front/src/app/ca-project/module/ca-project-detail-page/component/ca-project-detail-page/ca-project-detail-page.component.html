<div class="g-page">

  <ca-project-breadcrumb objectType="project" [objectId$]="projectId$"></ca-project-breadcrumb>

  <fl-section [isLoading]="isLoading" [object]="project">

    <ng-template flSectionBody>

      <ca-project-detail [project]="project"
                         (projectUpdated)="onProjectUpdate($event)">
      </ca-project-detail>

      <div class="list" fxLayout="row" fxLayoutAlign="start stretch" fxLayoutGap="2em">
        <ca-experiments-list [experiments$]="experiment$" fxFlex="auto"></ca-experiments-list>

        <ca-reports-list [reports$]="reports$" fxFlex="auto"></ca-reports-list>
      </div>

      <ca-project-children class="g-section" [projectId$]="projectId$"
                           *ngIf="project.hasChildren()"></ca-project-children>

    </ng-template>
  </fl-section>
</div>

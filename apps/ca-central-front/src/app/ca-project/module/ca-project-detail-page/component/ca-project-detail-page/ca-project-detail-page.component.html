<div fxLayout="row" fxLayoutAlign="start stretch" fxLayoutGap="1em" class="main-container">

  <div fxFlex="60%" fxLayout="column" class="g-scrollable-element left-section">

    <ca-project-object-breadcrumb></ca-project-object-breadcrumb>

    <ca-project-detail></ca-project-detail>

    <ng-container *ngIf="showObjects$ | async">
      <ca-reports-list [reports]="reports" class="g-section" [rowSelectable]="true"
                       (reportSelected)="selectReport($event)"></ca-reports-list>

      <ca-experiments-list [experiments]="experiments" class="g-section"
                           [rowSelectable]="true"
                           (experimentSelected)="selectExperiment($event)"></ca-experiments-list>
    </ng-container>

    <ca-project-children class="g-section" *ngIf="showChildren$ | async"></ca-project-children>
  </div>

  <div fxFlex="40%" class="right-section">
    <ca-project-detail-right-panel></ca-project-detail-right-panel>
  </div>

</div>

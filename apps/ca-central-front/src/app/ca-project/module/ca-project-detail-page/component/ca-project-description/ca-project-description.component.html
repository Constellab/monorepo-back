<div fxLayout="row" fxLayoutAlign="space-between" class="header">

  <fl-text-icon *ngIf="project$ | async let project">
    <mat-icon flIcon="project"></mat-icon>
    <h2>{{project.title | translate}}</h2>
  </fl-text-icon>

  <button mat-icon-button type="button" (click)="toggleEdit()"
          *ngIf="canEdit$ | async">
    <mat-icon>{{edit ? 'visibility' : 'edit'}}</mat-icon>
  </button>
</div>

<fl-text-editor [config]="textEditorConfig"
                [formControl]="formControl" mode="JSON"
                [placeholder]="'project_description_placeholder' | translate"></fl-text-editor>

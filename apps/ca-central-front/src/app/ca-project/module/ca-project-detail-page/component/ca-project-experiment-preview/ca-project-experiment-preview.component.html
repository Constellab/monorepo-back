<fl-async-section [object]="experiment$" class="section">

  <ng-container *flSectionBody="let experiment">
    <div fxLayout="row" fxLayoutAlign="space-between" class="header">

      <fl-text-icon>
        <mat-icon flIcon="experiment"></mat-icon>
        <h2>{{experiment.title}}</h2>
      </fl-text-icon>

      <div>
        <a mat-stroked-button class="g-button-small"
           [routerLink]="experiment | caDetailRoute">
          {{'open_details' | translate}}
        </a>
      </div>
    </div>

    <ca-experiment-card-detail [experiment]="experiment"></ca-experiment-card-detail>

    <ca-lab-instance-card [labInstance]="experiment.labInstance"></ca-lab-instance-card>
  </ng-container>
</fl-async-section>

<div class="grid-container">
  <a *ngFor="let project of children$ | async" [routerLink]="project | caDetailRoute"
     queryParamsHandling="preserve">
    <ca-project-card [project]="project"></ca-project-card>
  </a>

  <fl-card class="add-card" (click)="openChildCreation()">
    <fl-card-header>
      <div class="g-text-big">{{'add_new_sub_project' | translate}}</div>
    </fl-card-header>
    <fl-card-body>
      <div class="add-text">+</div>
    </fl-card-body>
  </fl-card>
</div>

<mat-drawer-container class="g-full">

  <mat-drawer mode="side" [opened]="treeOpened" class="drawer">
    <ca-project-object-tree [projectObject$]="projectObjectRef$"></ca-project-object-tree>
  </mat-drawer>


  <mat-drawer-content>
    <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="1em">
      <button mat-icon-button type="button" (click)="toggleTree()">
        <mat-icon>account_tree</mat-icon>
      </button>
      <ca-project-breadcrumb [projectObject$]="projectObjectRef$"></ca-project-breadcrumb>
    </div>
    <div class="content">
      <router-outlet></router-outlet>
    </div>

  </mat-drawer-content>

</mat-drawer-container>

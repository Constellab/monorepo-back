<div *ngIf="object?.validatedAt && object.validatedBy"
     fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="0.5em">
  <mat-icon flIcon="validated"></mat-icon>
  <div>{{'validation_info' | translate}} :</div>
  <ca-user-with-date [user]="object.validatedBy" [date]="object.validatedAt"></ca-user-with-date>
</div>

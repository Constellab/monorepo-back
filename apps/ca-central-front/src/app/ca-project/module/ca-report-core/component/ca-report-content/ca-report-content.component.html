<fl-async-section [object]="content$" class="g-full-height">
  <ng-container *flSectionBody="let content">
    <fl-text-editor [ngModel]="content" mode="JSON" [disabled]="true"
                    class="g-full-height" flPrint
                    [config]="textEditorConfig"></fl-text-editor>
  </ng-container>
</fl-async-section>

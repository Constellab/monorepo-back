<mat-sidenav-container class="container g-dashboard-background" autosize>

  <mat-sidenav [fixedInViewport]="true"
               [mode]="sidenavMode"
               [opened]="true"
               [disableClose]="true"
               position="start"
               class="sidenav g-print-hide">

    <fl-expansion-menu [(expanded)]="menuExpanded" class="expansion-menu">


      <div fxLayout="column" class="column-container g-scrollable-element">

        <div class="align-container logo-div" [ngClass]="{'align-container-center': menuExpanded}"
             (click)="openMySpacesPortal()" >
          <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="15px"
               [ngClass]="{'logo-expanded': menuExpanded}">
            <div [matBadge]="otherSpaceNotificationsNumber$ | async" matBadgeColor="warn"
                 class="logo-container">
              <img [src]="spaceLogo$ | async" alt="Space logo"
                   class="logo" flBackupImage="assets/logo/logo.png"/>
            </div>
            <span *ngIf="menuExpanded" class="g-text-light space-name">{{spaceName$ | async}}</span>
          </div>
        </div>

        <div class="divider"></div>


        <!-- List of main menu links   -->
        <div fxFlex="auto" fxLayout="column" fxLayoutAlign="start center">
          <div class="buttons">
            <div *ngFor="let link of accessibleLinks">
              <a mat-button [routerLink]="link.route" flExpansionMenuButton
                 class="nav-button" routerLinkActive="selected-menu"
                 [matTooltip]="link.label | translate" matTooltipPosition="after">
                <mat-icon [flIcon]="link.icon"></mat-icon>
                <span>{{link.label | translate}}</span>
              </a>
            </div>
          </div>
        </div>

        <div class="divider"></div>


        <!--  Additional buttons  -->
        <div class="align-container" [ngClass]="{'align-container-center': menuExpanded}">

          <!--    Grow/Reduce menu button      -->
          <button mat-button class="reduce-button"
                  flExpansionMenuButton flExpansionMenuButtonToggle>
            <mat-icon>{{menuExpanded ? 'chevron_left' : 'chevron_right' }}</mat-icon>
            <span>{{'reduce_menu' | translate}}</span>
          </button>

          <div [matBadge]="numberOfNotifications$ | async" matBadgeColor="warn" [matBadgeHidden]="false">
            <button mat-button type="button" (click)="openNotificationDiv()"
                    flExpansionMenuButton class="notif-button"
            >
              <mat-icon>notifications</mat-icon>
              <span>
              {{'notifications' | translate}}
            </span>
            </button>
          </div>

          <ca-authenticated-user-inline [showName]="menuExpanded"></ca-authenticated-user-inline>
        </div>
      </div>

    </fl-expansion-menu>

  </mat-sidenav>

  <mat-sidenav-content [ngClass]="{'no-margin' : sidenavMode === 'over'}"
                       class="content">
    <router-outlet></router-outlet>
  </mat-sidenav-content>

</mat-sidenav-container>

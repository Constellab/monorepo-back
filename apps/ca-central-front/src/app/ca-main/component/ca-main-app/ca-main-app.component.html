<mat-sidenav-container class="container g-dashboard-background"
                       [ngClass]="{'container-mobile': sidenavMode === 'over'}">

  <mat-sidenav [fixedInViewport]="true"
               [mode]="sidenavMode"
               [opened]="true"
               [disableClose]="true"
               position="start"
               class="sidenav g-print-hide">

    <div fxLayout="column" class="column-container">

      <img [src]="logo$ | async" alt="Space logo"
           class="logo" (click)="openMySpacesPortal()"
           flBackupImage="assets/logo/logo.png"/>
      <!-- List of main menu links   -->
      <div fxFlex="auto" class="menu" fxLayout="column" fxLayoutAlign="start center">
        <div class="buttons">
          <div *ngFor="let link of accessibleLinks">
            <a mat-icon-button [routerLink]="link.route"
               class="nav-button" routerLinkActive="selected-menu"
               [matTooltip]="link.label | translate" matTooltipPosition="after">
              <mat-icon [flIcon]="link.icon"></mat-icon>
            </a>
          </div>
        </div>
      </div>

      <!--  Authenticated user info  -->

      <div class="user-container"
           fxLayout="column" fxLayoutAlign="start center">

        <button mat-icon-button type="button" class="notif-button" (click)="openNotificationDiv()">
          <mat-icon>notifications</mat-icon>
        </button>
        <ca-authenticated-user-inline [showName]="false"></ca-authenticated-user-inline>
      </div>
    </div>

  </mat-sidenav>

  <mat-sidenav-content [ngClass]="{'no-margin' : sidenavMode === 'over'}"
                       class="content">
    <router-outlet></router-outlet>
  </mat-sidenav-content>

</mat-sidenav-container>

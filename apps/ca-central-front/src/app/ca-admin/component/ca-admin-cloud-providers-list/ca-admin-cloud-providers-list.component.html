<fl-card>

  <fl-card-header>
    <fl-text-icon>
      <mat-icon class="g-icon-big">cloud</mat-icon>
      <h2>{{'cloud_provider_list' | translate}}</h2>
    </fl-text-icon>

    <fl-card-actions>
      <button mat-icon-button type="button" (click)="openCreateDialog()"
              [matTooltip]="'create_cloud_provider' | translate">
        <mat-icon>add</mat-icon>
      </button>
    </fl-card-actions>
  </fl-card-header>

  <fl-card-body>
    <fl-infinite-scroll [datasource]="cloudProviders" class="g-infinite-table">
      <ca-cloud-provider-table [datasource]="cloudProviders" [columns]="displayedColumns">
      </ca-cloud-provider-table>
    </fl-infinite-scroll>
  </fl-card-body>


</fl-card>

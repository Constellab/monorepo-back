<div class="g-page-fixed">

  <div class="g-page-title nav-bar"
       fxLayout="row" fxLayoutAlign="row center" fxLayoutGap="1em">
    <fl-text-icon>
      <mat-icon class="g-icon-big">admin_panel_settings</mat-icon>
      <h1>{{'admin_dashboard' | translate}}</h1>
    </fl-text-icon>

    <a mat-button [routerLink]="adminRoute" routerLinkActive="menu-active"
       [routerLinkActiveOptions]="{exact: true}">
      <mat-icon>dashboard</mat-icon>
      {{'admin_dashboard_page' | translate}}
    </a>

    <a mat-button [routerLink]="adminSpacesRoute" routerLinkActive="menu-active">
      <mat-icon>space</mat-icon>
      {{'space_list' | translate}}
    </a>

    <a mat-button [routerLink]="adminServersRoute" routerLinkActive="menu-active">
      <mat-icon>dns</mat-icon>
      {{'admin_servers_page' | translate}}
    </a>
  </div>

  <router-outlet></router-outlet>

</div>

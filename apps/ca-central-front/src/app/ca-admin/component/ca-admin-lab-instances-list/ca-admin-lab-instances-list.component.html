<fl-async-section [arrayObs]="labInstances" emptyText="no_lab_instance">

  <fl-section-header class="g-page-title">
    <fl-text-icon>
      <mat-icon class="g-icon-big" svgIcon="lab"></mat-icon>
      <h2>{{'lab_instances' | translate}}</h2>
    </fl-text-icon>

    <fl-section-actions>
      <button mat-flat-button type="button" color="accent"
              class="g-button-small" (click)="openCreateLabInstanceForm()"
              [matTooltip]="'create_lab_instance' | translate">
        <mat-icon>add</mat-icon>
      </button>
    </fl-section-actions>
  </fl-section-header>

  <ng-container *flSectionBody="let servers">
    <fl-card>
      <fl-card-body class="limit-height">
        <ca-lab-instance-table [datasource]="labInstances" [columns]="displayedColumns"></ca-lab-instance-table>
      </fl-card-body>
    </fl-card>
  </ng-container>


</fl-async-section>

<fl-card>

  <fl-card-header>
    <fl-text-icon>
      <mat-icon class="g-icon-big" flIcon="lab"></mat-icon>
      <h2>{{'lab_instances' | translate}}</h2>
    </fl-text-icon>

    <fl-card-actions>
      <button mat-icon-button type="button"
              (click)="openCreateLabInstanceForm()"
              [matTooltip]="'create_lab_instance' | translate">
        <mat-icon>add</mat-icon>
      </button>
    </fl-card-actions>
  </fl-card-header>

  <fl-card-body>
    <fl-infinite-scroll [datasource]="labInstances" class="g-infinite-table"
                        textNoResult="no_lab_instance">
      <ca-lab-instance-table [datasource]="labInstances" [columns]="displayedColumns"
                             [disableLink]="true"></ca-lab-instance-table>
    </fl-infinite-scroll>
  </fl-card-body>


</fl-card>

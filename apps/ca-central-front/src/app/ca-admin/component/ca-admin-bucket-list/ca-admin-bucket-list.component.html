<fl-card>

  <fl-card-header>
    <fl-text-icon>
      <mat-icon class="g-icon-big">folder</mat-icon>
      <h2>{{'bucket_list' | translate}}</h2>
    </fl-text-icon>

    <fl-card-actions>
      <button mat-icon-button type="button" (click)="openCreateDialog()"
              [matTooltip]="'create_bucket' | translate">
        <mat-icon>add</mat-icon>
      </button>
    </fl-card-actions>
  </fl-card-header>

  <fl-card-body>
    <fl-infinite-scroll [datasource]="buckets" class="g-infinite-table">
      <ca-bucket-table [datasource]="buckets" [columns]="displayedColumns">
      </ca-bucket-table>
    </fl-infinite-scroll>
  </fl-card-body>


</fl-card>

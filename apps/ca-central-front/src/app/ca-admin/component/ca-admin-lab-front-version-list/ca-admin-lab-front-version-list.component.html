<fl-async-section [arrayObs]="frontVersions" emptyText="no_lab_front_version">

  <fl-section-header class="g-page-title">
    <fl-text-icon>
      <mat-icon class="g-icon-big">computer</mat-icon>
      <h2>{{'lab_front_version_list' | translate}}</h2>
    </fl-text-icon>

    <fl-section-actions>
      <button mat-flat-button type="button" color="accent"
              class="g-button-small" [matTooltip]="'create_lab_front_version' | translate"
              (click)="createVersion()">
        <mat-icon>add</mat-icon>
      </button>
    </fl-section-actions>
  </fl-section-header>

  <ng-container *flSectionBody="let servers">
    <fl-card>
      <fl-card-body class="limit-height" (flInfiniteScroll)="loadMoreResults()"
                    [flInfiniteDisabled]="frontVersions.isLoading || frontVersions.page?.last">
        <ca-lab-front-version-table [datasource]="frontVersions" [columns]="displayedColumns">
        </ca-lab-front-version-table>
      </fl-card-body>
    </fl-card>
  </ng-container>


</fl-async-section>

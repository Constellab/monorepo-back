<fl-card>

  <fl-card-header>
    <fl-text-icon>
      <mat-icon class="g-icon-big" flIcon="space"></mat-icon>
      <h2>{{'space_list' | translate}}</h2>
    </fl-text-icon>

    <fl-card-actions>
      <button mat-icon-button type="button"
              [matTooltip]="'create_space' | translate"
              (click)="createSpace()">
        <mat-icon>add</mat-icon>
      </button>
    </fl-card-actions>
  </fl-card-header>


  <fl-card-body>
    <fl-infinite-scroll [datasource]="spaces" class="g-infinite-table">
      <ca-space-table [datasource]="spaces" [columns]="columns">
      </ca-space-table>
    </fl-infinite-scroll>
  </fl-card-body>


</fl-card>

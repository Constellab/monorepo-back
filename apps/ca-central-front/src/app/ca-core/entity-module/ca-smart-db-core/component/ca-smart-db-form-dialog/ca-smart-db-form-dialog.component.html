<fl-dialog-header>
  {{title | translate}}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="smart-db-form" [formGroup]="formGp">

    <!--  Name  -->
    <mat-form-field class="g-form-input">
      <mat-label>{{'name' | translate}}</mat-label>
      <input matInput formControlName="name" required flInputMaxLength="255"
             [placeholder]="'name' | translate">
      <mat-error *ngIf="formGp.get('name').hasError('required')">
        {{'name' | flErrorRequired}}
      </mat-error>
    </mat-form-field>

    <!--  visibility  -->
    <div class="g-form-input">
      <mat-label>{{'smart_db.type' | translate}}</mat-label>
      <mat-radio-group formControlName="type">
        <mat-radio-button [value]="'PRIVATE'" class="radio-button">
          {{'smart_db.type_private' | translate}}</mat-radio-button>
        <mat-radio-button [value]="'PUBLIC'" class="radio-button">
          {{'smart_db.type_public' | translate}}</mat-radio-button>
      </mat-radio-group>
    </div>

    <!--  Group  -->
    <mat-form-field class="g-form-input">
      <mat-label>{{'group' | translate}}</mat-label>
      <mat-select [placeholder]="'group' | translate" formControlName="group">
        <ca-group-select-options></ca-group-select-options>
      </mat-select>
      <mat-error *ngIf="formGp.get('group').hasError('required')">
        {{'group' | flErrorRequired}}
      </mat-error>
    </mat-form-field>

  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-raised-button color="primary" type="submit" form="smart-db-form"
          class="g-centered-forced">
    {{'save' | translate}}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>

<ng-container *ngIf="isLoading; else notLoading">
  <mat-option disabled>
    {{'loading' | translate}}
  </mat-option>
</ng-container>

<ng-template #notLoading>
  <ng-container *ngIf="labs?.length > 0 ; else empty">
    <mat-option *ngFor="let lab of labs" [value]="lab">
      {{lab.label}}
    </mat-option>
  </ng-container>


  <ng-template #empty>
    <mat-option disabled>
      {{'no_labs' | translate}}
    </mat-option>
  </ng-template>
</ng-template>

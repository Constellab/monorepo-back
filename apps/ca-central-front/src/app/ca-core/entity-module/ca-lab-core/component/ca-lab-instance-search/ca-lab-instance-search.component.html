<fl-card class="g-full-height">
  <fl-card-header>
    <!--  Center header  -->
    <fl-search-header>
      <fl-text-icon>
        <mat-icon flIcon="lab"></mat-icon>
        <h2>{{'lab_instances' | translate}}</h2>
      </fl-text-icon>

      <fl-search-header-actions fxLayout="row" fxLayoutAlign="start center">
        <button mat-icon-button type="button" *caIsAdmin
                (click)="openCreateLabInstanceForm()"
                [matTooltip]="'create_lab_instance' | translate">
          <mat-icon>add</mat-icon>
        </button>
      </fl-search-header-actions>
    </fl-search-header>

  </fl-card-header>

  <fl-card-body class="g-full-height">
    <fl-search>

      <!-- Advanced section in the right in a drawer -->
      <fl-search-advanced-form>
        <ca-lab-instance-search-form></ca-lab-instance-search-form>
      </fl-search-advanced-form>


      <fl-search-result>
        <ca-lab-instance-table [datasource]="datasource" [columns]="columns"></ca-lab-instance-table>
      </fl-search-result>

    </fl-search>
  </fl-card-body>
</fl-card>

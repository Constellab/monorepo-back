<ng-container *ngIf="labInstances?.length > 0; else noInstances">
  <mat-option *ngFor="let lab of labInstances" [value]="lab">
    {{lab.name}}
  </mat-option>
</ng-container>

<ng-template #noInstances>
  <mat-option disabled>
    <mat-icon>block</mat-icon>
    {{'no_running_labs' | translate}}
  </mat-option>
</ng-template>

<div fxLayout="row" fxLayoutAlign="start center"
     fxLayoutGap="0.4em" (mouseover)="openUserInfoPortal()"
     caMouseHoverUserPortal [data]="user" [flMouseEnterDelay]="750">
  <fl-user-profile-picture [user]="user"
                           class="person-picture" size="small"></fl-user-profile-picture>

  <div class="g-text-small user-name" *ngIf="showName">
    {{user.fullname}}
  </div>

</div>

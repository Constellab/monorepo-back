<fl-card class="card" matRipple>
  <fl-card-header>
    <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="1em">
      <ca-project-icon [project]="project"></ca-project-icon>
      <h2>{{project.code}}</h2>
    </div>
  </fl-card-header>


  <fl-card-body class="body">
    <div>
      <p>{{project.title}}</p>
    </div>

    <div fxLayout="row" fxLayoutAlign="start center" class="project-leader">
      <span class="g-text-light project-leader-title">{{'project_leader' | translate}} : &nbsp;</span>
      <fl-user-inline [user]="project.leader" class="project-leader-user"
                      [showName]="false"></fl-user-inline>
    </div>

    <fl-date-range [startingDate]="project.startingDate" [endingDate]="project.endingDate"
                   class="g-text-light dates">
    </fl-date-range>

  </fl-card-body>

  <fl-card-footer *ngIf="!hideGoToProjectButton">
    <div fxLayout="row" fxLayoutAlign="end" class="g-text-light g-text-small g-full">
      <fl-text-icon iconPosition="end" gap="0">
        <mat-icon>chevron_right</mat-icon>
        {{'go_to_project' | translate}}
      </fl-text-icon>
    </div>
  </fl-card-footer>
</fl-card>

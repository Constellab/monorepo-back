<fl-card class="card">
  <fl-card-header>
    <p class="g-text-big">{{project.code}}</p>
    <fl-card-actions>
      <fl-status-chip [status]="project.currentStatus.status"
                       mode="iconOnly"
                       class="g-text-normal">
      </fl-status-chip>
    </fl-card-actions>
  </fl-card-header>


  <fl-card-body class="body">
    <div>
      <p>{{project.title}}</p>
    </div>

    <fl-text-icon class="dates">
      <mat-icon>date_range</mat-icon>
      <fl-date-range [startingDate]="project.startingDate" [endingDate]="project.endingDate"
                      class="g-text-light g-text-small">
      </fl-date-range>
    </fl-text-icon>

  </fl-card-body>
</fl-card>

<mat-table fxFlex="100" mat-table [dataSource]="datasource">


  <!-- Created -->
  <ng-container matColumnDef="created">
    <mat-header-cell *matHeaderCellDef>
      <p>{{'creation_info' | translate}}</p>
    </mat-header-cell>
    <mat-cell *matCellDef="let organisation">
      <fl-last-modification-info [lastModifiedBy]="organisation.lastModifiedBy?.fullname"
                                 [lastModifiedAt]="organisation.lastModifiedAt">
      </fl-last-modification-info>
    </mat-cell>
  </ng-container>

  <!-- Last modified -->
  <ng-container matColumnDef="lastModified">
    <mat-header-cell *matHeaderCellDef>
      <p>{{'last_modification_info' | translate}}</p>
    </mat-header-cell>
    <mat-cell *matCellDef="let organisation">
      <fl-last-modification-info [lastModifiedBy]="organisation.lastModifiedBy?.fullname"
                                 [lastModifiedAt]="organisation.lastModifiedAt">
      </fl-last-modification-info>
    </mat-cell>
  </ng-container>

  <!-- Dynamic columns -->
  <ng-container *ngFor="let column of dynamicColumns" [matColumnDef]="column.accessor">
    <mat-header-cell *matHeaderCellDef>
      {{column.columnName | translate}}
    </mat-header-cell>
    <mat-cell *matCellDef="let item">
      <div>
        <span>{{item[column.accessor]}}</span>
      </div>
    </mat-cell>
  </ng-container>


  <mat-header-row *matHeaderRowDef="_columns; sticky: true"></mat-header-row>
  <mat-row *matRowDef="let row; columns: _columns;" class="g-table-row-selectable"
           [routerLink]="row | caDetailRoute"></mat-row>
</mat-table>

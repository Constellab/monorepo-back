<fl-card class="card">
  <fl-card-header>
    <h2>{{group.label}}</h2>
    <fl-card-actions>
      <fl-chip>
        <mat-icon [flIcon]="group.type | caGroupTypeIcon"></mat-icon>
      </fl-chip>
    </fl-card-actions>
  </fl-card-header>


  <fl-card-body class="body">
    <fl-creation-info [createdAt]="group.createdAt" [createdBy]="group.createdBy.fullname"
    class="g-text-light g-text-small">
    </fl-creation-info>
  </fl-card-body>
</fl-card>

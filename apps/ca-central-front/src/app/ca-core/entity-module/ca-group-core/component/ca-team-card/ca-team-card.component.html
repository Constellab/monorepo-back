<fl-card class="card" matRipple>
  <fl-card-header>

    <fl-text-icon>
      <mat-icon class="g-icon-background g-primary-background"
                flIcon="group"></mat-icon>
      <h2>{{team.label}}</h2>
    </fl-text-icon>
  </fl-card-header>


  <fl-card-body class="body">
    <fl-creation-info [date]="team.createdAt" [user]="team.createdBy"
                      class="g-text-light g-text-small">
    </fl-creation-info>
  </fl-card-body>
</fl-card>

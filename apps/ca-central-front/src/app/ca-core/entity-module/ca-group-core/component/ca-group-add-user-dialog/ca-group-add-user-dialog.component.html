<fl-dialog-header>
  {{title | translate}}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="add-user-to-orga-form">

    <!--  User  -->
    <mat-form-field class="g-form-input">
      <mat-label>{{'user' | translate}}</mat-label>
      <mat-select [formControl]="formControl" [placeholder]="'user' | translate"
                  required>
        <ca-select-user-options></ca-select-user-options>
      </mat-select>
      <mat-error *ngIf="formControl.hasError('required')">
        {{'user' | flErrorRequired}}
      </mat-error>
    </mat-form-field>

  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button color="primary" type="submit" form="add-user-to-orga-form"
          class="g-centered-forced">
    {{'save' | translate}}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>

<fl-dialog-header>
  {{'share' | translate}}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="group-share-form">

    <!--  Group  -->
    <mat-form-field class="g-form-input">
      <mat-label>{{'group' | translate}}</mat-label>
      <mat-select [formControl]="formControl" [placeholder]="'group' | translate"
                  required>
        <ca-group-select-options></ca-group-select-options>

        <mat-select-trigger *ngIf="formControl.value">
          <ca-group-inline [group]="formControl.value" [disableLink]="true"></ca-group-inline>
        </mat-select-trigger>
      </mat-select>
      <mat-error *ngIf="formControl.hasError('required')">
        {{'group' | flErrorRequired}}
      </mat-error>
    </mat-form-field>

  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button color="primary" type="submit" form="group-share-form"
          class="g-centered-forced">
    {{'save' | translate}}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>

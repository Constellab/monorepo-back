<a *ngIf="group.type !== 'SINGLE_USER' && !disableLink; else singleUser" [routerLink]="group | caDetailRoute"
   class="text-link">
  <fl-text-icon>
    <mat-icon [flIcon]="group.type | caGroupTypeIcon"></mat-icon>
    <span>{{group.label}}</span>
  </fl-text-icon>
</a>

<!-- No link for single user group -->
<ng-template #singleUser>
  <fl-text-icon>
    <mat-icon [flIcon]="group.type | caGroupTypeIcon"></mat-icon>
    <span>{{group.label}}</span>
  </fl-text-icon>
</ng-template>

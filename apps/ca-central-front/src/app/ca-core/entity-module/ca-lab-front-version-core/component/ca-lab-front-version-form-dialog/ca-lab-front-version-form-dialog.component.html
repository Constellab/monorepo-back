<fl-dialog-header>
  {{title | translate}}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="lab-front-version-form" [formGroup]="formGp">

    <!--  Version  -->
    <mat-form-field class="g-form-input">
      <mat-label>{{'version' | translate}}</mat-label>
      <input matInput formControlName="version" required flInputMaxLength="50"
             placeholder="{{'version' | translate}}">
      <mat-error *ngIf="formGp.get('version').hasError('required')">
        {{'version' | flErrorRequired}}
      </mat-error>
    </mat-form-field>

    <!--  GWS Core brick version  -->
    <mat-form-field class="g-form-input">
      <mat-label>{{'gws_core_brick_version' | translate}}</mat-label>
      <mat-select formControlName="gwsCoreBrickVersion" required
                  placeholder="{{'gws_core_brick_version' | translate}}">
        <ca-brick-version-select-options [brickName]="gwsCoreBrick"></ca-brick-version-select-options>
      </mat-select>
      <mat-error *ngIf="formGp.get('gwsCoreBrickVersion').hasError('required')">
        {{'gws_core_brick_version' | flErrorRequired}}
      </mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button color="primary" type="submit" form="lab-front-version-form"
          class="g-centered-forced">
    {{'save' | translate}}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>

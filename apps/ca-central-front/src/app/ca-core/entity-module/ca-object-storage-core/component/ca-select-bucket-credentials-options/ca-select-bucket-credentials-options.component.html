<fl-infinite-scroll [datasource]="datasource">
  <mat-option *flForById="let credentials of credentials$ | async" [value]="credentials">
    {{credentials.cloudProvider.name}}
    <ng-container *ngIf="credentials.organization">- {{credentials.organization.label}}</ng-container>
    - {{credentials.name}}
  </mat-option>
</fl-infinite-scroll>

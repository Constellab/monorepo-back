<fl-dialog-header>
  {{title | translate}}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="space-form" [formGroup]="formGp">

    <!--  Label  -->
    <mat-form-field class="g-form-input">
      <mat-label>{{'name' | translate}}</mat-label>
      <input matInput formControlName="name" required flInputMaxLength="100"
             [placeholder]="'name' | translate">
      <mat-error *ngIf="formGp.get('name').hasError('required')">
        {{'name' | flErrorRequired}}
      </mat-error>
    </mat-form-field>

    <!--  Domain  -->
    <mat-form-field class="g-form-input">
      <mat-label>{{'space_domain' | translate}}</mat-label>
      <input matInput formControlName="domain" required flInputMaxLength="50"
             [placeholder]="'space_domain' | translate">
      <mat-error *ngIf="formGp.get('domain').hasError('required')">
        {{'space_domain' | flErrorRequired}}
      </mat-error>
      <mat-error *ngIf="formGp.get('domain').hasError('pattern')">
        {{'invalid_domain_name' | translate}}
      </mat-error>
    </mat-form-field>

    <!--  Nb of licences  -->
    <mat-form-field class="g-form-input">
      <mat-label>{{'nb_of_licenses' | translate}}</mat-label>
      <input matInput formControlName="nbLicenses" required type="number"
             [placeholder]="'nb_of_licenses' | translate" min="0">
      <mat-error *ngIf="formGp.get('nbLicenses').hasError('required')">
        {{'nb_of_licenses' | flErrorRequired}}
      </mat-error>
    </mat-form-field>

  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button color="primary" type="submit" form="space-form"
          class="g-centered-forced">
    {{'save' | translate}}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>

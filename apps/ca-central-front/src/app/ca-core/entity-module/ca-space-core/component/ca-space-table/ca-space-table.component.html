<mat-table fxFlex="100" mat-table [dataSource]="datasource">

  <!-- name -->
  <ng-container matColumnDef="name">
    <mat-header-cell *matHeaderCellDef>
      {{'name' | translate}}
    </mat-header-cell>
    <mat-cell *matCellDef="let space">
      <ca-space-inline [space]="space"></ca-space-inline>
    </mat-cell>
  </ng-container>

  <!-- Created -->
  <ng-container matColumnDef="created">
    <mat-header-cell *matHeaderCellDef>
      {{'creation_info' | translate}}
    </mat-header-cell>
    <mat-cell *matCellDef="let space">
      <ca-user-with-date [user]="space.createdBy" [date]="space.createdAt"></ca-user-with-date>
    </mat-cell>
  </ng-container>

  <!-- Last modified -->
  <ng-container matColumnDef="lastModified">
    <mat-header-cell *matHeaderCellDef>
      {{'last_modification_info' | translate}}
    </mat-header-cell>
    <mat-cell *matCellDef="let space">
      <ca-user-with-date [user]="space.lastModifiedBy" [date]="space.lastModifiedAt"></ca-user-with-date>

    </mat-cell>
  </ng-container>

  <!-- Detail url  -->
  <ng-container matColumnDef="detail">
    <mat-header-cell *matHeaderCellDef>
      {{'detail' | translate}}
    </mat-header-cell>
    <mat-cell *matCellDef="let space">
      <a mat-stroked-button class="g-button-small" [caExternalSpaceLink]="currentSpaceRoute"
         [caExternalSpaceDomain]="space.domain">
        <mat-icon>visibility</mat-icon>
        <span>{{'detail' | translate}}</span>
      </a>
    </mat-cell>
  </ng-container>


  <!-- Dynamic columns -->
  <ng-container *ngFor="let column of dynamicColumns" [matColumnDef]="column.accessor">
    <mat-header-cell *matHeaderCellDef>
      {{column.columnName | translate}}
    </mat-header-cell>
    <mat-cell *matCellDef="let item">
      <div>
        <span>{{item[column.accessor]}}</span>
      </div>
    </mat-cell>
  </ng-container>


  <mat-header-row *matHeaderRowDef="_columns; sticky: true"></mat-header-row>
  <mat-row *matRowDef="let row; columns: _columns;"></mat-row>
</mat-table>

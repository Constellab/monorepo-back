<div fxLayout="column" class="form" [formGroup]="formGp">

  <div fxLayout="row wrap" fxLayoutAlign="space-between center"
       class="g-full g-form-field-compact">

    <!--  name  -->
    <mat-form-field class="g-search-field-full">
      <mat-label>{{'name' | translate }}</mat-label>
      <input matInput formControlName="name" [placeholder]="'name' | translate" autocomplete="off">
    </mat-form-field>

    <!--  Domain  -->
    <mat-form-field class="g-search-field-full">
      <mat-label>{{'space_domain' | translate }}</mat-label>
      <input matInput formControlName="domain" [placeholder]="'space_domain' | translate" autocomplete="off">
    </mat-form-field>

    <!--  TYPE  -->
    <mat-form-field class="g-search-field">
      <mat-label>{{'type' | translate }}</mat-label>
      <mat-select formControlName="type" [placeholder]="'type' | translate">
        <mat-option *ngFor="let spaceType of spaceTypes" [value]="spaceType">
          {{spaceType}}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!--Created by-->
    <fl-form-field class="g-search-field">
      <fl-select-user formControlName="createdBy" [placeholder]="'created_by' | translate"
                      mode="all"></fl-select-user>
    </fl-form-field>


    <!--  Creation date  -->
    <div class="g-form-field-no-hint g-full">
      <p class="g-text-small date">{{'creation_date' | translate}}</p>
      <fl-search-date-interval formGroupName="createdAt">
      </fl-search-date-interval>
    </div>

  </div>

</div>

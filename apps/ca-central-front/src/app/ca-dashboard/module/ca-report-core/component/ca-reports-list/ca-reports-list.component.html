<fl-card>
  <fl-card-header>
    <fl-text-icon>
      <mat-icon flIcon="report"></mat-icon>
      <h2>{{'reports' | translate}}</h2>
    </fl-text-icon>
  </fl-card-header>

  <fl-card-body>
    <fl-async-section [object]="reports$" emptyText="no_report">
      <ng-container *flSectionBody="let reports">
        <mat-nav-list>
          <ng-container *ngFor="let report of reports">
            <a mat-list-item class="g-full g-full-height" [routerLink]="getReportLink(report)">
              <mat-icon mat-list-icon flIcon="validated" [matTooltip]="'report_validated' | translate"
                        class="validated-icon" *ngIf="report.isValidated"></mat-icon>
              {{ report.title }}
            </a>
            <mat-divider></mat-divider>
          </ng-container>
        </mat-nav-list>
      </ng-container>
    </fl-async-section>

  </fl-card-body>

</fl-card>

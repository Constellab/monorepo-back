<fl-section [isLoading]="isLoading" [object]="experiment">

  <ng-template flSectionBody>
    <div fxLayout="row" fxLayoutAlign="space-between center" class="header">
      <fl-text-icon>
        <mat-icon class="g-icon-big" svgIcon="experiment"></mat-icon>
        <h1>{{experiment.title}}</h1>
      </fl-text-icon>

      <div fxLayout="row" fxLayoutAlign="start center">
        <button mat-icon-button type="button" (click)="openStatusHistory()"
                [matTooltip]="'status_history' | translate">
          <mat-icon>history</mat-icon>
        </button>
        <fl-status-chip [status]="experiment.currentStatus.status"
                        class="g-text-big">
        </fl-status-chip>
      </div>
    </div>


    <div fxLayout="row" fxLayoutAlign="start stretch" fxLayout.lt-md="column" fxLayoutGap="2em">
      <ca-experiment-card-detail [experiment]="experiment" (update)="onExperimentUpdate($event)"
                                  class="flex">
      </ca-experiment-card-detail>

      <!--  Lab instance   -->
      <div class="flex">
        <ca-lab-instance-card [labInstance]="experiment.labInstance"
                               (labInstanceUpdated)="onLabInstanceUpdate($event)"
                               mode="big"></ca-lab-instance-card>
      </div>
    </div>


    <!--  Report  -->
    <fl-card class="g-section">
      <fl-card-header>
        <fl-text-icon>
          <mat-icon class="g-icon-big">assignment</mat-icon>
          <p>{{'reports' | translate}}</p>
        </fl-text-icon>
      </fl-card-header>

      <fl-card-body>
        <ca-reports-list [experimentId]="experiment.id"></ca-reports-list>
      </fl-card-body>
    </fl-card>

  </ng-template>
</fl-section>

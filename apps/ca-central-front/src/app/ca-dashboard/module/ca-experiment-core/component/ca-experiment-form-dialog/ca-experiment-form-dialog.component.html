<fl-dialog-header>
  {{title | translate}}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="project-form" [formGroup]="formGp">

    <!--  Label  -->
    <div class="g-form-input" fxLayout="row wrap" fxLayoutAlign="space-between">
      <mat-form-field fxFlex="49%" appearance="outline">
        <mat-label>{{'label' | translate}}</mat-label>
        <input matInput formControlName="label" required flInputMaxLength="50"
               placeholder="{{'label' | translate}}">
        <mat-error *ngIf="formGp.get('label').hasError('required')">
          {{'label' | flErrorRequired}}
        </mat-error>
      </mat-form-field>
    </div>

    <!--    Description      -->
    <fl-form-field class="g-form-input">
      <mat-label>{{'description' | translate}}</mat-label>
      <fl-text-editor formControlName="description" class="text-editor">
      </fl-text-editor>
      <mat-error *ngIf="formGp.get('description').hasError('required')">
        {{'description' | flErrorRequired}}
      </mat-error>
    </fl-form-field>

  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-raised-button color="primary" type="submit" form="project-form"
          class="g-centered-forced">
    {{'save' | translate}}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>

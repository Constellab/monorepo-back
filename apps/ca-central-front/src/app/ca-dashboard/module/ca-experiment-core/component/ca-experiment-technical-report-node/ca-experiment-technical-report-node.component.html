<div class="node">
  <div class="node-main">
    <div class="node-l">
      <h4>{{node.human_name}}
        <button type="button" (click)="openTechDocDialog()" mat-stroked-button
                class="button-more-info g-button-small g-text-light">
          <fl-text-icon [iconPosition]="'end'">
            {{'documentation' | translate}}
            <mat-icon>info</mat-icon>
          </fl-text-icon>
        </button>
      </h4>
      <fl-key-value>
        <fl-key>{{'instance' | translate}}</fl-key>
        {{node.instance_name}}
      </fl-key-value>
      <fl-key-value *ngIf="node.process_typing_name">
        <fl-key>{{'brick' | translate}}</fl-key>
        {{typingName.brickName}} v{{node.brick_version}}
      </fl-key-value>
      <fl-key-value>
        <fl-key>{{'type' | translate}}</fl-key>
        {{node.process_typing_name}}
      </fl-key-value>
      <fl-key-value *ngIf="node.short_description">
        <fl-key>{{'description' | translate}}</fl-key>
        {{node.short_description}}
      </fl-key-value>
    </div>
    <div class="node-r">
      <fl-key-value *ngIf="node.config && node.config.data | flIsNotEmpty">
        <fl-key>{{'configuration_data' | translate}}</fl-key>
        <div class="node-conf">
          <fl-pretty-json [object]="node.config.data" [dense]="true"></fl-pretty-json>
        </div>
      </fl-key-value>
    </div>
  </div>

  <div class="child-div" *ngIf="node.graph">
    <ca-experiment-technical-report-graph [graph]="node.graph"
                                          [protocolName]="node.human_name"></ca-experiment-technical-report-graph>
  </div>
</div>

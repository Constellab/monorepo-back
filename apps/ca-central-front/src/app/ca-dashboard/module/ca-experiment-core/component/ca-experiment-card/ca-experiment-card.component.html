<fl-card class="g-full">

  <fl-card-header>
    <div>{{experiment.title}}</div>

    <fl-card-actions>
      <fl-status-chip [status]="experiment.status" mode="iconOnly">
      </fl-status-chip>
    </fl-card-actions>

  </fl-card-header>

  <fl-card-body>

    <ca-experiment-info [experiment]="experiment"></ca-experiment-info>
  </fl-card-body>

  <fl-card-footer>
    <a *ngIf="openInLabLink" [routerLink]="openInLabLink" [queryParams]="linkQueryParams"
       mat-button class="g-button-small go-to-button">
      {{'open_experiment_in_lab' | translate}}
      <mat-icon>arrow_forward_ios</mat-icon>
    </a>
  </fl-card-footer>
</fl-card>

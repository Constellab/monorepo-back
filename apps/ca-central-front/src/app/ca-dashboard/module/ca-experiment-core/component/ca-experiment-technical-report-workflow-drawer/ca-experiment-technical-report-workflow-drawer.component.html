<div fxLayout="column" class="g-full-height drawer"
     *ngIf="nodeSelected$ | async as nodeSelected">


  <div fxLayout="row" fxLayoutAlign="space-between center">
    <div class="g-text-big title">
      {{nodeSelected.getTitle$() | async}}
    </div>

    <button mat-icon-button type="button" flDrawerClose tabindex="-1"
            [matTooltip]="'close' | translate">
      <mat-icon>clear</mat-icon>
    </button>
  </div>


  <div fxFlex="auto">

    <div class="g-text-light">
      <p>{{'node_process_name' | translate}} : {{nodeSelected.currentObject.instanceName}}</p>


      <!--          <button mat-stroked-button type="button" class="g-button-small doc-button"-->
      <!--                  (click)="openTypingDoc(process.processTypingName)">-->
      <!--            {{'biox.process_type_doc' | translate}}-->
      <!--            <mat-icon>info</mat-icon>-->
      <!--          </button>-->
    </div>

  </div>

</div>

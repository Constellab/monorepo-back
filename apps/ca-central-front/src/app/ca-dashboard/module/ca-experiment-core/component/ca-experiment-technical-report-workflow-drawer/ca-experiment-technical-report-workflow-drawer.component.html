<div fxLayout="column" class="g-full-height drawer"
     *ngIf="nodeSelected$ | async as nodeSelected">


  <div fxLayout="row" fxLayoutAlign="space-between center">
    <div class="g-text-big title">
      {{nodeSelected.getTitle$() | async}}
    </div>

    <button mat-icon-button type="button" flDrawerClose tabindex="-1"
            [matTooltip]="'close' | translate">
      <mat-icon>clear</mat-icon>
    </button>
  </div>


  <div fxFlex="auto">

    <div *ngIf="nodeSelected.getObject$() | async as object">
      <fl-key-value class="kv">
        <fl-key>{{'node_process_name' | translate}}</fl-key>
        {{nodeSelected.currentObject.instanceName}}
      </fl-key-value>

      <fl-key-value *ngIf="object.config" class="kv">
        <fl-key>
            {{'config' | translate}}
        </fl-key>
        <fl-pretty-json [object]="object.config" [dense]="true"></fl-pretty-json>
        <button mat-stroked-button type="button"
                (click)="openConfigInfo(object.config)" class="g-button-small">
          <mat-icon>info</mat-icon>
          <span>{{'detail' | translate}}</span>
        </button>
      </fl-key-value>


      <!--          <button mat-stroked-button type="button" class="g-button-small doc-button"-->
      <!--                  (click)="openTypingDoc(process.processTypingName)">-->
      <!--            {{'biox.process_type_doc' | translate}}-->
      <!--            <mat-icon>info</mat-icon>-->
      <!--          </button>-->
    </div>

  </div>

</div>

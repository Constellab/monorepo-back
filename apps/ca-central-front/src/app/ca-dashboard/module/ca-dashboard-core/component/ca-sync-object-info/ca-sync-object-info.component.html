<div *ngIf="object" fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="0.5em">
  <ng-container *ngIf="showText">
    <mat-icon>sync</mat-icon>
    <div>{{'last_sync' | translate}} :</div>
  </ng-container>
  <ca-user-inline [user]="object.lastSyncBy" [showName]="false"></ca-user-inline>
  <fl-from-now [date]="object.lastSyncAt"></fl-from-now>
</div>

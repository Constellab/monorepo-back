<div class="activity-body">
  <div class="activity-icon">
    <mat-icon [flIcon]="activityLogo" class="icon g-icon-huge"></mat-icon>
  </div>
  <div class="activity-info" fxLayout="column">
    <div class="activity-number">{{activityNumber}}</div>
    <div class="activity-text">{{activityText | translate}}</div>
  </div>
</div>

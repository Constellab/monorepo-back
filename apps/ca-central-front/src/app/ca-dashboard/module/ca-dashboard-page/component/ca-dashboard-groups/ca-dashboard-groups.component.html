<fl-async-section [arrayObs]="groupDatasource" emptyText="no_team">

  <fl-section-header class="g-headline">
    <a [routerLink]="myGroupsRoute" class="text-link">
      <fl-text-icon iconPosition="start">
        <mat-icon class="g-icon-big" flIcon="group"></mat-icon>
        <h2>{{'my_teams' | translate}}</h2>
      </fl-text-icon>
    </a>
  </fl-section-header>

  <ng-container *flSectionBody="let groups">
    <ca-groups-list [groups]="groups"></ca-groups-list>
  </ng-container>

</fl-async-section>

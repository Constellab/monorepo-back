<fl-async-section [arrayObs]="smartDb$" emptyText="no_smart_db">

  <fl-section-header class="g-headline">
    <a [routerLink]="mySmartDbsRoute" class="text-link">
      <fl-text-icon iconPosition="start">
        <mat-icon class="g-icon-big" flIcon="smart_db"></mat-icon>
        <h2>{{'my_smart_db' | translate}}</h2>
      </fl-text-icon>
    </a>
  </fl-section-header>

  <ng-container *flSectionBody="let smartDbs">
    <ca-smart-db-list [smartDbs]="smartDbs"></ca-smart-db-list>
  </ng-container>

</fl-async-section>

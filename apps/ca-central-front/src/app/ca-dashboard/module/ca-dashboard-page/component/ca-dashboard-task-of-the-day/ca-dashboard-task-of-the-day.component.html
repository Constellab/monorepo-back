<div>
  <fl-section-header class="g-headline">
    <div>
      <fl-text-icon iconPosition="start">
        <mat-icon class="g-icon-big" flIcon="process"></mat-icon>
        <h2>{{'task_of_the_day' | translate}}</h2>
      </fl-text-icon>
    </div>
  </fl-section-header>
  <fl-card class="card" *ngIf="task">
    <fl-card-header class="totd-card">
      {{task.humanName}}
    </fl-card-header>
    <fl-card-body class="totd-card">
      <p class="short-description">{{task.shortDescription}}</p>

      <a [href]="taskHubUrl" target="_blank" mat-stroked-button color="primary" class="button-more-info">{{'more_info_on_the_hub' | translate}}<mat-icon>arrow_forward_ios</mat-icon></a>
    </fl-card-body>
  </fl-card>
</div>

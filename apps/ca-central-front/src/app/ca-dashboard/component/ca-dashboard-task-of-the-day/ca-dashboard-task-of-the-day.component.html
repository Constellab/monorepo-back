<fl-card>
  <fl-card-header class="g-headline">
    <h2>{{'task_of_the_day' | translate}}</h2>
  </fl-card-header>

  <fl-card-body *ngIf="task">
    <p class="g-text-big">{{task.humanName}}</p>
    <p class="short-description">{{task.shortDescription}}</p>

    <a [href]="taskHubUrl" target="_blank" mat-stroked-button color="primary"
       class="button-more-info">{{'more_info_on_the_hub' | translate}}
      <mat-icon>arrow_forward_ios</mat-icon>
    </a>
  </fl-card-body>
</fl-card>

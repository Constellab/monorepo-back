<fl-card>
  <fl-card-header>
    <h2>{{'my_activity' | translate}}</h2>
  </fl-card-header>

    <fl-card-body *ngIf="stats">
      <div class="activities-div">
        <div class="activity">
          <ca-dashboard-activity-card [activityNumber]="stats.onGoingProjectNumber"
                                      [activityText]="'ongoing_projects'"></ca-dashboard-activity-card>
        </div>
        <div class="activity">
          <ca-dashboard-activity-card [activityNumber]="stats.teamsNumber"
                                      [activityText]="'teams'"></ca-dashboard-activity-card>
        </div>
        <div class="activity">
          <ca-dashboard-activity-card [activityNumber]="stats.runningLabNumber"
                                      [activityText]="'running_labs'"></ca-dashboard-activity-card>
        </div>
        <div class="activity">
          <ca-dashboard-activity-card [activityNumber]="stats.validatedExperimentNumber"
                                      [activityText]="'experiments'"></ca-dashboard-activity-card>
        </div>
        <div class="activity">
          <ca-dashboard-activity-card [activityNumber]="stats.validatedReportNumber"
                                      [activityText]="'reports'"></ca-dashboard-activity-card>
        </div>
      </div>
    </fl-card-body>
</fl-card>

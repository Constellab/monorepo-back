<div fxLayout="column" fxLayout.gt-sm="row">

  <div class="dashboard-left" fxFill fxFlex="nogrow">
    <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="1em"
         class="g-page-title">

      <div fxLayout="row" fxLayoutAlign="start end">
        <h1 *ngIf="currentSpace$ | async as currentSpace">
          {{'welcome_message' | translate:{name: currentSpace.name} }}
        </h1>
        <div class="date g-text-small g-text-light"
             fxHide.lt-md>
          {{currentDate | date:'EEEE MMMM d, y'}}
        </div>

      </div>
      <div fxFlex="auto">
        <ca-user-list-inline [userDatasource]="spaceUsers" [disabled]="true"></ca-user-list-inline>
      </div>
    </div>


    <!-- My project list -->
    <div class="section">
      <ca-dashboard-projects></ca-dashboard-projects>
    </div>

    <!-- Lab Instances -->
    <div class="section">
      <ca-dashboard-lab-instances></ca-dashboard-lab-instances>
    </div>

    <!-- My Teams -->
    <div class="section">
      <ca-dashboard-teams></ca-dashboard-teams>
    </div>

    <!-- SmartDb -->
    <div class="section">
      <ca-dashboard-smart-dbs></ca-dashboard-smart-dbs>
    </div>
  </div>


  <div class="dashboard-right" fxFlex>

    <div class="g-full" fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="1em">

      <a class="link-button" href="mailto:clientsuccess@gencovery.com" matRipple>
        <fl-text-icon class="support">
          <mat-icon>help</mat-icon>
          <div>{{'support' | translate}}</div>
        </fl-text-icon>
      </a>

      <a [href]="hubLink" target="_blank" class="link-button" matRipple>
        <img [src]="communityLogo" alt="Community logo"
             class="community-logo"/>
      </a>
    </div>

    <!-- My Activity  -->
    <div class="r-section">
      <ca-dashboard-my-activity></ca-dashboard-my-activity>
    </div>

    <!-- Last experiences -->
    <div class="r-section">
      <ca-dashboard-last-experiments></ca-dashboard-last-experiments>
    </div>

    <!-- Task of the day -->
    <div class="r-section">
      <ca-dashboard-task-of-the-day></ca-dashboard-task-of-the-day>
    </div>


  </div>

</div>

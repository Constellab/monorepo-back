<fl-dialog-header>
  {{'lab_user_create' | translate}}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="lab-user-form" [formGroup]="formGp">

    <!--  User  -->
    <fl-form-field class="g-form-input">
      <fl-select-user formControlName="user" [placeholder]="'user' | translate"
                      mode="allForAdmin"></fl-select-user>
      <mat-error *ngIf="formGp.get('user').hasError('required')">
        {{'user' | flErrorRequired}}
      </mat-error>
    </fl-form-field>


    <!--    Role      -->
    <mat-form-field class="g-form-input">
      <mat-label>{{'lab_user_role' | translate}}</mat-label>
      <mat-select [placeholder]="'lab_user_role' | translate" formControlName="role">
        <mat-option [value]="'USER'">{{'lab_user_role_USER' | translate}}</mat-option>
        <mat-option [value]="'OWNER'">{{'lab_user_role_OWNER' | translate}}</mat-option>
      </mat-select>
      <mat-error *ngIf="formGp.get('role').hasError('required')">
        {{'lab_user_role' | flErrorRequired}}
      </mat-error>
    </mat-form-field>

  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button color="primary" type="submit" form="lab-user-form"
          class="g-centered-forced">
    {{'save' | translate}}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>

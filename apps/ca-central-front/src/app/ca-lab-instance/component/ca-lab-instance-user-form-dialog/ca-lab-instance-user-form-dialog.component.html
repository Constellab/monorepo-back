<fl-dialog-header>
  {{'lab_user_create' | translate}}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="lab-user-form" [formGroup]="formGp">

    <!--  User  -->
    <mat-form-field class="g-form-input">
      <mat-label>{{'user' | translate}}</mat-label>
      <mat-select placeholder="{{'user' | translate}}" formControlName="user">
        <ca-select-user-options mode="organization"></ca-select-user-options>
      </mat-select>
      <mat-error *ngIf="formGp.get('user').hasError('required')">
        {{'user' | flErrorRequired}}
      </mat-error>
    </mat-form-field>


      <!--    Group      -->
    <mat-form-field class="g-form-input">
      <mat-label>{{'lab_user_group' | translate}}</mat-label>
      <mat-select placeholder="{{'lab_user_group' | translate}}" formControlName="group">
        <mat-option [value]="'USER'">User</mat-option>
        <mat-option [value]="'ADMIN'">Admin</mat-option>
      </mat-select>
      <mat-error *ngIf="formGp.get('group').hasError('required')">
        {{'lab_user_group' | flErrorRequired}}
      </mat-error>
    </mat-form-field>

  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button color="primary" type="submit" form="lab-user-form"
          class="g-centered-forced">
    {{'save' | translate}}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>

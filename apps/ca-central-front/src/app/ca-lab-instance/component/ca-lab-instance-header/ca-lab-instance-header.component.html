<div fxLayout="row" fxLayoutAlign="space-between center" *ngIf="labInstance$ | async as labInstance">
  <fl-text-icon>
    <mat-icon class="g-icon-big" flIcon="lab"></mat-icon>
    <h1>{{labInstance.name}}</h1>
  </fl-text-icon>

  <div fxLayout="row" fxLayoutAlign="start center">
    <button mat-icon-button type="button" (click)="openLabNameUpdate(labInstance)"
            [matTooltip]="'update_lab_name' | translate" class="g-button-action">
      <mat-icon>edit</mat-icon>
    </button>

    <button mat-icon-button type="button" (click)="openStatusHistoryDialog(labInstance)"
            [matTooltip]="'status_history' | translate" class="g-button-action">
      <mat-icon>history</mat-icon>
    </button>

    <fl-status-chip [status]="labInstance.currentStatus.status"
                    class="g-text-big">
    </fl-status-chip>
  </div>
</div>

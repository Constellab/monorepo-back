<mat-table fxFlex="100" mat-table [dataSource]="datasource">

  <!-- User -->
  <ng-container matColumnDef="user">
    <mat-header-cell *matHeaderCellDef>
      <span>{{'user' | translate}}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let labUser">
      <ca-user-inline [user]="labUser.user"></ca-user-inline>
    </mat-cell>
  </ng-container>

  <!-- Role -->
  <ng-container matColumnDef="role">
    <mat-header-cell *matHeaderCellDef>
      <span>{{'lab_user_role' | translate}}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let labUser">
      <span>{{('lab_user_role_' + labUser.role) | translate}}</span>
    </mat-cell>
  </ng-container>

  <!-- createdBy -->
  <ng-container matColumnDef="createdBy">
    <mat-header-cell *matHeaderCellDef>
      <span>{{'lab_added_by' | translate}}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let labUser">
      <ca-user-inline [user]="labUser.createdBy"></ca-user-inline>
    </mat-cell>
  </ng-container>

  <!-- createdAt -->
  <ng-container matColumnDef="createdAt">
    <mat-header-cell *matHeaderCellDef>
      <span>{{'lab_user_added_at' | translate}}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let labUser">
      <span>{{labUser.createdAt | flDate}}</span>
    </mat-cell>
  </ng-container>

  <!-- Action -->
  <ng-container matColumnDef="actions">
    <mat-header-cell *matHeaderCellDef class="g-table-icon-button-cell">
    </mat-header-cell>
    <mat-cell *matCellDef="let labInstance" class="g-table-icon-button-cell">

      <!--   Mat menu containing action buttons   -->
      <button mat-icon-button [matMenuTriggerFor]="menu">
        <mat-icon>more_vert</mat-icon>
      </button>
      <mat-menu #menu="matMenu" xPosition="before">
        <button mat-menu-item type="button" (click)="openUpdateUserRoleDialog(labInstance)">
          <mat-icon>edit</mat-icon>
          <span>{{'update_lab_user_role' | translate}}</span>
        </button>

        <button mat-menu-item type="button" (click)="openDeleteUserDialog(labInstance)">
          <mat-icon color="warn">delete</mat-icon>
          <span class="g-warn-text">{{'delete_lab_user' | translate}}</span>
        </button>
      </mat-menu>


    </mat-cell>
  </ng-container>


  <!-- Dynamic columns -->
  <ng-container *ngFor="let column of dynamicColumns" [matColumnDef]="column.accessor">
    <mat-header-cell *matHeaderCellDef>
      {{column.columnName | translate}}
    </mat-header-cell>
    <mat-cell *matCellDef="let user">
      <div>
        <span>{{user[column.accessor]}}</span>
      </div>
    </mat-cell>
  </ng-container>


  <mat-header-row *matHeaderRowDef="_columns; sticky: true"></mat-header-row>
  <mat-row *matRowDef="let row; columns: _columns;"></mat-row>
</mat-table>

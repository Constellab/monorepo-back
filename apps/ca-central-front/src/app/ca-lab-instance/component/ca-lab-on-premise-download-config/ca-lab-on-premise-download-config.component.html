<fl-dialog-header>
  {{'download_on_premise_config' | translate}}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="lab-on-premise-form" [formGroup]="formGp">

    <!--  Glab image tag  -->
    <mat-form-field class="g-form-input">
      <mat-label>{{'glab_image_tag' | translate}}</mat-label>
      <input matInput formControlName="glabTag" [placeholder]="'glab_image_tag' | translate">

      <mat-error *ngIf="formGp.get('glabTag').hasError('required')">
        {{'name' | flErrorRequired}}
      </mat-error>
      <mat-hint>{{'glab_image_tag_recommended' | translate}}: 'latest', 'beta'</mat-hint>
    </mat-form-field>

  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button color="primary" type="submit" form="lab-on-premise-form"
          class="g-centered-forced">
    {{'save' | translate}}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>

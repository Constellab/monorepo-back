<fl-dialog-header>
  {{'pull_biota' | translate}}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="pull-biota-form" [formGroup]="formGp"
        class="form">

    <!--  Force update  -->
    <div>
      <mat-checkbox formControlName="forceUpdate"
                    class="g-mat-checkbox-wrap-text g-mat-checkbox-include-bottom">
        {{'lab_force_pull_biota' | translate}}
      </mat-checkbox>
    </div>


  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button color="primary" type="submit" form="pull-biota-form"
          class="g-centered-forced">
    {{'pull_biota' | translate}}
  </button>
</div>

<fl-card>

  <fl-card-header>
    <fl-text-icon>
      <mat-icon>info</mat-icon>
      <h2>{{'lab_global_info' | translate}}</h2>
    </fl-text-icon>

    <fl-card-actions>
      <button mat-stroked-button type="button" (click)="forceStatusRefresh()"
              class="g-button-small">
        <mat-icon>refresh</mat-icon>
        {{'refresh_status' | translate}}
      </button>

    </fl-card-actions>
  </fl-card-header>

  <fl-card-body>


    <ng-container *ngIf="status$ | async as status">

      <fl-text-ok-nok [value]="status.hasServerInstanceId"
                      [okText]="'lab_server_instance_configured' | translate"
                      [nokText]="'lab_server_instance_not_configured' | translate">
      </fl-text-ok-nok>

      <fl-text-ok-nok [value]="status.hasServerVolumeId"
                      [okText]="'lab_server_volume_configured' | translate"
                      [nokText]="'lab_server_volume_not_configured' | translate">
      </fl-text-ok-nok>

      <fl-text-ok-nok [value]="status.labManagerIsRunning"
                      [okText]="'lab_manager_running' | translate"
                      [nokText]="'lab_manager_not_running' | translate">
      </fl-text-ok-nok>

      <fl-text-ok-nok [value]="status.labIsRunning"
                      [okText]="'lab_is_running' | translate"
                      [nokText]="'lab_is_not_running' | translate">
      </fl-text-ok-nok>

      <ca-lab-login-button [labInstanceId]="labInstanceId" [isRunning]="status.labIsRunning"
                           class="login-button"></ca-lab-login-button>
    </ng-container>


  </fl-card-body>
</fl-card>

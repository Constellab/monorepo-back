<fl-card class="g-full-height">
  <fl-card-header>
    <h2>{{'server_info' | translate}}</h2>
  </fl-card-header>

  <fl-card-body>
    <ca-server-info-detail [serverInfo]="labInstance.serverInfo">

      <fl-key-value>
        <fl-key>{{'lab_volume_type' | translate}}</fl-key>
        {{'lab_volume_type_' + labInstance.volumeType | translate}}
      </fl-key-value>

      <fl-key-value>
        <fl-key>{{'lab_volume_size' | translate}}</fl-key>
        {{labInstance.volumeSize}}
      </fl-key-value>
    </ca-server-info-detail>
  </fl-card-body>

</fl-card>

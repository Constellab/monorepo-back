<div [ngSwitch]="status$ | async">

  <ng-container *ngSwitchCase="'SERVER_NOT_CREATED'">
    {{'lab_status_server_not_created' | translate}}

    <button mat-stroked-button class="status-action-button"
            type="button" (click)="initServer()">
      {{'lab_init_server' | translate}}
    </button>
  </ng-container>

  <ng-container *ngSwitchCase="'LAB_MANAGER_NOT_AVAILABLE'">
    {{'lab_status_server_lab_manager_not_available' | translate}}

    <button mat-stroked-button class="status-action-button"
            type="button" (click)="configureServer()">
      {{'lab_configure_server' | translate}}
    </button>
  </ng-container>

  <ng-container *ngSwitchCase="'LAB_NOT_AVAILABLE'">
    {{'lab_status_server_lab_not_available' | translate}}

    <button mat-stroked-button class="status-action-button"
            type="button" (click)="moveToLabManager()">
      {{'lab_manager' | translate}}
    </button>
  </ng-container>

  <ng-container *ngSwitchCase="'LAB_RUNNING'">
    {{'lab_status_lab_running' | translate}}

    <ca-lab-login-button [labInstanceId]="labInstanceId" [isRunning]="true"
                         class="status-action-button"></ca-lab-login-button>
  </ng-container>
</div>

<fl-card>

  <fl-card-header>
    <h2>{{'lab_manager' | translate}}</h2>

    <fl-card-actions class="action-buttons">

      <button mat-stroked-button type="button" class="g-button-small" (click)="openStatusDialog()">
        <mat-icon>info</mat-icon>
        <span>{{'lab_check_status' | translate}}</span>
      </button>

      <button mat-stroked-button type="button" class="g-button-small button" (click)="refresh()">
        <mat-icon>refresh</mat-icon>
        <span>{{'lab_manager_refresh' | translate}}</span>
      </button>
    </fl-card-actions>
  </fl-card-header>

  <fl-card-body>

    <!--  Global status  -->
    <fl-async-section [object]="labStatus$" [showErrorText]="true">
      <ng-container *flSectionBody="let labStatus">
        <ca-lab-instance-manager-status [labStatus]="labStatus"></ca-lab-instance-manager-status>
      </ng-container>
    </fl-async-section>

    <!--  Action button  -->
    <div class="action-buttons g-section">
      <button mat-stroked-button type="button" color="primary"
              class="g-button-small" (click)="initAll()">Init all
      </button>
      <button mat-stroked-button type="button" color="primary"
              class="g-button-small" (click)="upContainers()">Up containers
      </button>
      <button mat-stroked-button type="button" color="primary"
              class="g-button-small" (click)="restartContainers()">Restart containers
      </button>
      <button mat-stroked-button type="button" color="primary"
              class="g-button-small" (click)="pullContainers()">Pull containers
      </button>
      <button mat-stroked-button type="button" color="primary"
              class="g-button-small" (click)="pullBiotaDb()">Pull biota
      </button>
      <button mat-stroked-button type="button" color="primary"
              class="g-button-small" (click)="registryLogin()">Registry login
      </button>
      <button mat-stroked-button type="button" color="warn"
              class="g-button-small" (click)="downContainers()">Down containers
      </button>
      <button mat-stroked-button type="button" color="warn"
              class="g-button-small" (click)="stopCurrentTask()">Stop current task
      </button>
      <button mat-stroked-button type="button" color="warn"
              class="g-button-small" (click)="systemPrune()">System prune
      </button>
    </div>

    <ca-lab-instance-config [labInstanceId]="labInstanceId"
                            class="g-section content"></ca-lab-instance-config>

    <mat-divider></mat-divider>
    <!--  List of containers  -->
    <fl-async-section [object]="containers$" [showErrorText]="true" class="g-section">
      <fl-section-header>
        <h2>{{'lab_containers' | translate}}</h2>
      </fl-section-header>
      <ng-container *flSectionBody="let containers">
        <ca-lab-docker-containers-list [labInstanceId]="labInstanceId"
                                       [containers]="containers"></ca-lab-docker-containers-list>
      </ng-container>
    </fl-async-section>

  </fl-card-body>

</fl-card>

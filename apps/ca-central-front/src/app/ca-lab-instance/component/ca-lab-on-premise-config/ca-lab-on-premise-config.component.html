<fl-card>
  <fl-card-body>
    <fl-async-section [object]="labConfig$">

      <ng-container *flSectionBody="let config">
        <ca-lab-instance-config-form [labInstanceId]="labInstanceId" [labConfig]="config"
                                     [showAdvanced]="false" labType="ON_PREMISE"></ca-lab-instance-config-form>
      </ng-container>
    </fl-async-section>
  </fl-card-body>
</fl-card>

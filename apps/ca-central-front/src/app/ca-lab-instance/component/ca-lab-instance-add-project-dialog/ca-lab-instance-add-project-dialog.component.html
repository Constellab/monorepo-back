<fl-dialog-header>
  {{'lab_add_project' | translate}}
</fl-dialog-header>

<mat-dialog-content>

  <form (ngSubmit)="submit()" id="lab-add-project-form">
    <p class="g-text-light help-text">{{'lab_add_project_help' | translate}}</p>
    <ca-select-project [formControl]="formControl"></ca-select-project>
  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button color="primary" type="submit" form="lab-add-project-form"
          class="g-centered-forced">
    {{'save' | translate}}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>

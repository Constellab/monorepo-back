<div class="g-page" fxLayout="column">

  <fl-async-section [object]="labInstance$" fxFlex="grow">
    <ng-container *flSectionBody="let labInstance">
      <div fxLayout="column" fxFlex="grow">

        <ca-lab-instance-header></ca-lab-instance-header>

        <div fxLayout="row" fxLayoutAlign="space-between stretch" class="g-section">
          <ca-lab-instance-detail fxFlex="49%"></ca-lab-instance-detail>

          <ca-server-info-card [serverInfo]="labInstance.serverInfo" fxFlex="49%"></ca-server-info-card>

        </div>
        <ca-lab-instance-users-list class="g-section" [labInstanceId]="labInstance.id"></ca-lab-instance-users-list>

        <ca-lab-instance-projects-list class="g-section"
                                       [labInstanceId]="labInstance.id"></ca-lab-instance-projects-list>

        <!--   Owner section      -->
        <ng-container *ngIf="isOwner$ | async">
          <ca-lab-instance-manager [labInstance]="labInstance"
                                   class="g-section"></ca-lab-instance-manager>

          <ca-lab-instance-manage-backup class="g-section"
                                         [labInstanceId]="labInstance.id"></ca-lab-instance-manage-backup>
        </ng-container>
      </div>
    </ng-container>
  </fl-async-section>
</div>

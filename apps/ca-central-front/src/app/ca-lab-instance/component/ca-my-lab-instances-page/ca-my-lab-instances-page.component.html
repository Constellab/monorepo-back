<div class="g-page">

  <fl-async-section [arrayObs]="labInstancesDatasource" emptyText="no_lab_instance">

    <fl-section-header class="g-page-title">
      <fl-text-icon iconPosition="start">
        <mat-icon class="g-icon-big g-icon-background g-primary-background"
                  flIcon="lab"></mat-icon>
        <h1>{{'my_labs' | translate}}</h1>
      </fl-text-icon>

      <fl-section-actions>
        <button mat-flat-button type="button" color="accent"
                disabled class="g-button-small">
          <mat-icon>add</mat-icon>
        </button>

      </fl-section-actions>
    </fl-section-header>

    <ng-container *flSectionBody="let labInstances">
      <div class="g-grid-5-rows">
        <a *ngFor="let labInstance of labInstances" [routerLink]="labInstance | caDetailRoute">
          <ca-lab-instance-card [labInstance]="labInstance"></ca-lab-instance-card>
        </a>
      </div>

      <fl-infinite-load-more-result [datasource]="labInstancesDatasource"></fl-infinite-load-more-result>
    </ng-container>

  </fl-async-section>

</div>

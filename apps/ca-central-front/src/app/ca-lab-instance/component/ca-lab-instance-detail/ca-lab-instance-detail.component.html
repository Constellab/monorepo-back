<fl-card class="g-full-height" *ngIf="labInstance$ | async as labInstance">

  <fl-card-body>

    <!--   Lab url   -->
    <fl-text-icon>
      <mat-icon>link</mat-icon>
      <fl-key-value>
        <fl-key>{{'url' | translate}}</fl-key>
        <a [href]="labInstance.frontUrl" target="_blank" class="g-text-link"
           [matTooltip]="'open_lab_in_new_tab' | translate">
          {{labInstance.frontUrl}}
        </a>
      </fl-key-value>
    </fl-text-icon>


    <fl-text-icon>
      <mat-icon>location_on</mat-icon>
      <fl-key-value class="key-val-inline">
        <fl-key class="key">{{'region' | translate}}</fl-key>
        <ca-city [city]="labInstance.region.city" class="city"></ca-city>
      </fl-key-value>
    </fl-text-icon>

    <fl-text-icon>
      <mat-icon>attach_money</mat-icon>
      <fl-key-value class="key-val-inline">
        <fl-key class="key">{{'lab_billing_mode' | translate}}</fl-key>
        {{'lab_billing_mode_' + labInstance.billingMode | translate}}
      </fl-key-value>
    </fl-text-icon>

  </fl-card-body>

  <fl-card-footer layoutGap="0.5em">
    <ca-lab-login-button [labInstanceId]="labInstance.id" [isRunning]="labInstance.isRunning()"></ca-lab-login-button>

    <ca-lab-instance-start-stop *ngIf="isOwner$ | async"></ca-lab-instance-start-stop>

    <button mat-stroked-button type="button" (click)="openCodelabInfo(labInstance)"
            class="g-button-small">
      <mat-icon flIcon="code"></mat-icon>
      {{'codelab_info' | translate}}
    </button>

    <button mat-stroked-button type="button" (click)="openLabConfig(labInstance)"
            class="g-button-small">
      <mat-icon>info</mat-icon>
      {{'brick_versions' | translate}}
    </button>


  </fl-card-footer>
</fl-card>

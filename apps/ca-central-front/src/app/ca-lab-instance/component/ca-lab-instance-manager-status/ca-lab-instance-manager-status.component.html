<!-- Container status-->
<div fxLayout="row wrap" fxLayoutAlign="start center" fxLayoutGap="1em"
     class="status">
  <span>{{'lab_manager_status' | translate}} : </span>
  <fl-status-chip [status]="labStatus.containersStatus.status"></fl-status-chip>
  <span *ngIf="labStatus.containersStatus.info">{{labStatus.containersStatus.info}}</span>
</div>

<!-- Lab task -->
<div *ngIf="labStatus.currentTask != null; else noTask"
     fxLayout="row wrap" fxLayoutAlign="start center" fxLayoutGap="1em">
  <span>{{'lab_manager_task' | translate}} : </span>
  <fl-status-chip [status]="labStatus.currentTask.status"></fl-status-chip>
  <span>{{labStatus.currentTask.name}} {{labStatus.currentTask.info}}</span>
</div>

<ng-template #noTask>
  {{'lab_manager_no_task' | translate}}
</ng-template>

<fl-section [object]="labConfig">

  <fl-section-header>
    <h2>{{'lab_instance_config' | translate}}</h2>

    <fl-section-actions>
      <button mat-stroked-button type="button" class="g-button-small" (click)="openBrickVersionForm()">
        {{'lab_instance_add_brick' | translate}}
      </button>
    </fl-section-actions>
  </fl-section-header>

  <ng-container *flSectionBody>
    <mat-list class="g-mat-list-dense">
      <mat-list-item *ngFor="let brickVersion of labConfig.brickVersions">
        <div matLine>{{brickVersion.name}} : {{brickVersion.version}}</div>

        <!-- Info button -->
        <button mat-icon-button type="button" class="g-button-icon-small"
                (click)="openBrickVersionDetailDialog(brickVersion)"
                [matTooltip]="'brick_version_view_detail' | translate">
          <mat-icon>info</mat-icon>
        </button>

        <button mat-icon-button type="button" class="g-button-icon-small" (click)="openBrickVersionForm(brickVersion)"
                [matTooltip]="'lab_instance_update_brick' | translate">
          <mat-icon>edit</mat-icon>
        </button>
      </mat-list-item>
    </mat-list>


    <mat-expansion-panel class="advanced-config">
      <mat-expansion-panel-header>
        {{'lab_instance_advanced_config' | translate}}
      </mat-expansion-panel-header>

      <fl-text-icon>
        <mat-icon color="warn">warnings</mat-icon>
        <p class="g-warn-text">{{'lab_instance_advanced_config_warning' | translate}}</p>
      </fl-text-icon>

      <mat-form-field class="g-form-input">
        <mat-label>{{'name' | translate}}</mat-label>
        <input matInput [(ngModel)]="labConfig.glabTag" [placeholder]="'glab_image_tag' | translate">

        <mat-hint>{{'glab_image_tag_recommended' | translate}}: 'latest', 'beta'</mat-hint>
      </mat-form-field>

      <button mat-stroked-button type="button" (click)="resetToDefault()"
              class="g-centered-forced g-button-small">
        {{'lab_instance_reset_config' | translate}}
      </button>
    </mat-expansion-panel>

    <button mat-flat-button color="primary" type="button" (click)="save()" class="g-centered-forced save-button">
      {{'save' | translate}}
      <fl-button-loader *ngIf="isLoading"></fl-button-loader>
    </button>
  </ng-container>
</fl-section>

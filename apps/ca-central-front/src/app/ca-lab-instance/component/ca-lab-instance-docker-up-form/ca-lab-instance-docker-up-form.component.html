<fl-dialog-header>
  {{'lab_manager_compose_up_form' | translate}}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="lab-up-form" [formGroup]="formGp"
        class="form">

    <!--  Update containers  -->
    <div>
      <mat-checkbox formControlName="updateContainers">
        {{'lab_update_containers' | translate}}
      </mat-checkbox>
    </div>

    <!--  Docker prune  -->
    <div>
      <mat-checkbox formControlName="pruneSystem">
        {{'lab_prune_system' | translate}}
      </mat-checkbox>
    </div>
  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button color="primary" type="submit" form="lab-up-form"
          class="g-centered-forced">
    {{'lab_start_container' | translate}}
  </button>
</div>

<div class="g-page">

  <fl-async-section [object]="invitation$" [showServerErrorText]="true" class="section">

    <ng-container *flSectionBody="let invitation">

      <div class="container" fxLayoutAlign="center center">

        <fl-card class="card">
          <fl-card-body>
            <img *ngIf="invitation.space.photo" [src]="invitation.space | caSpacePhoto"
                 alt="Space logo"
                 class="logo"/>


            <div class="g-text-centered">
              <p class="help-text" [innerHTML]="'join_space_simple' | translate: {
                  fullname: invitation.createdBy.fullname,
                  space: invitation.space.name
                }">
              </p>
              <button mat-flat-button color="primary" type="button" (click)="acceptInvitation()">
                {{ 'join_space' | translate: {space: invitation.space.name} }}
                <fl-button-loader *ngIf="acceptIsLoading"></fl-button-loader>
              </button>
            </div>
          </fl-card-body>
        </fl-card>
      </div>
    </ng-container>
  </fl-async-section>
</div>

<fl-card>
  <fl-card-header>
    <h1>
      <fl-key-value>
        <fl-key>{{'team' | translate}}</fl-key>{{team.label}}
      </fl-key-value>

    </h1>

    <fl-card-actions>
      <ca-team-action-menu [team]="team" (teamDeleted)="onTeamDeleted()"></ca-team-action-menu>
    </fl-card-actions>
  </fl-card-header>
</fl-card>

<ca-team-users-list [groupId]="team.id" class="g-section">
</ca-team-users-list>

<ca-group-projects-list [teamId]="team.id" class="g-section"></ca-group-projects-list>

<div class="g-page">

  <fl-async-section [arrayObs]="groupsDatasource" emptyText="no_team">

    <fl-section-header class="g-page-title">
      <fl-text-icon iconPosition="start">
        <mat-icon class="g-icon-big" flIcon="group"></mat-icon>
        <h1>{{'my_teams' | translate}}</h1>
      </fl-text-icon>

      <fl-section-actions>
        <button mat-flat-button type="button" color="accent"
                (click)="createTeam()" class="g-button-small" [matTooltip]="'create_team' | translate">
          <mat-icon>add</mat-icon>
        </button>

      </fl-section-actions>
    </fl-section-header>

    <ng-container *flSectionBody="let groups">
      <ca-groups-list [groups]="groups"></ca-groups-list>

      <fl-infinite-load-more-result [datasource]="groupsDatasource"></fl-infinite-load-more-result>
    </ng-container>

  </fl-async-section>

</div>

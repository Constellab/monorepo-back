<div class="g-page">

  <fl-async-section [arrayObs]="teamsDatasource" emptyText="no_team">

    <fl-section-header class="g-page-title">
      <fl-text-icon iconPosition="start">
        <mat-icon class="g-icon-big g-icon-background g-primary-background" flIcon="group"></mat-icon>
        <h1>{{'my_teams' | translate}}</h1>
      </fl-text-icon>

      <fl-section-actions>
        <button mat-flat-button type="button" color="accent"
                (click)="createTeam()" class="g-button-small" [matTooltip]="'create_team' | translate">
          <mat-icon>add</mat-icon>
        </button>

      </fl-section-actions>
    </fl-section-header>

    <ng-container *flSectionBody="let teams">
      <div class="g-grid-5-rows">
        <a *ngFor="let team of teams" [routerLink]="team | caDetailRoute">
          <ca-team-card [team]="team"></ca-team-card>
        </a>
      </div>

      <fl-infinite-load-more-result [datasource]="teamsDatasource"></fl-infinite-load-more-result>
    </ng-container>

  </fl-async-section>

</div>

<fl-dialog-header>
  {{'request_new_licenses' | translate}}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" [formGroup]="formGroup" id="request-licenses-form">

    <p class="help-text">{{'request_new_licenses_help' | translate}}</p>

    <mat-form-field class="g-form-input">
      <mat-label>{{'nb_licenses' | translate}}</mat-label>
      <input matInput formControlName="nbLicenses" [placeholder]="'nb_licenses' | translate"
             type="number" [min]="0">

      <mat-error *ngIf="formGroup.get('nbLicenses').hasError('required')">
        {{'nb_licenses' | flErrorRequired}}
      </mat-error>
    </mat-form-field>

    <mat-form-field class="g-form-input">
      <mat-label>{{'request_licenses_comment' | translate}}</mat-label>
      <textarea matInput formControlName="text" [placeholder]="'request_licenses_comment' | translate"
                rows="5"></textarea>

      <mat-error *ngIf="formGroup.get('text').hasError('required')">
        {{'request_licenses_comment' | flErrorRequired}}
      </mat-error>
    </mat-form-field>

  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-raised-button color="primary" type="submit" form="request-licenses-form"
          class="g-centered-forced">
    {{'save' | translate}}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>

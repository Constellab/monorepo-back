<fl-dialog-header>
  {{'create_invitation' | translate}}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="space-invit-form" [formGroup]="formGp">

    <p class="help-text g-text-light">
      {{'create_invitation_help' | translate}}
    </p>

    <!--  Email  -->
    <mat-form-field class="g-form-input">
      <mat-label>{{'email' | translate}}</mat-label>
      <input matInput type="email" formControlName="userMail" required
             [placeholder]="'email' | translate">
      <mat-error *ngIf="formGp.get('userMail').hasError('required')">
        {{'email' | flErrorRequired}}
      </mat-error>
      <mat-error *ngIf="formGp.get('userMail').hasError('email')">
        {{'email_invalid' | translate}}
      </mat-error>
    </mat-form-field>

    <!--  Role  -->
    <mat-form-field class="g-form-input">
      <mat-label>{{'role' | translate}}</mat-label>
      <mat-select formControlName="role" [placeholder]="'role' | translate">
        <mat-option *ngFor="let role of availableRoles | flObjectKeys" [value]="role">
          {{role}}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="formGp.get('role').hasError('required')">
        {{'role' | flErrorRequired}}
      </mat-error>
    </mat-form-field>


  </form>
</mat-dialog-content>

<div matDialogActions>
  <button mat-flat-button color="primary" type="submit" form="space-invit-form"
          class="g-centered-forced">
    <mat-icon>send</mat-icon>
    {{'send_invitation' | translate}}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>

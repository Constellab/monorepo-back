<fl-dialog-header>
  {{'space_update_role' | translate}}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="space-role-form">

    <mat-form-field class="g-form-input" appearance="outline">
      <mat-label>{{'role' | translate}}</mat-label>
      <mat-select [formControl]="formControl" [placeholder]="'role' | translate">
        <mat-option *ngFor="let role of availableRoles | flObjectKeys" [value]="role">
          {{role}}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="formControl.hasError('required')">
        {{'role' | flErrorRequired}}
      </mat-error>
    </mat-form-field>

  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-raised-button color="primary" type="submit" form="space-role-form"
          class="g-centered-forced">
    {{'save' | translate}}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>

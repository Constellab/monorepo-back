<fl-card>
  <fl-card-header>
    <fl-text-icon>
      <mat-icon class="g-icon-big" flIcon="project"></mat-icon>
      <h2>{{'projects' | translate}}</h2>
    </fl-text-icon>

    <fl-card-actions>
    </fl-card-actions>
  </fl-card-header>

  <fl-card-body>
    <fl-infinite-scroll [datasource]="projects" class="g-infinite-table">
      <ca-project-table [datasource]="projects" [columns]="columns">
      </ca-project-table>
    </fl-infinite-scroll>
  </fl-card-body>
</fl-card>

<fl-login-page [redirectionRoute]="appRoute" class="g-dashboard-background login">

  <div class="footer" fxLayout="row wrap" fxLayoutAlign="space-between">
    <span class="g-text-light g-text-small g-text-link" (click)="openPasswordForgotten()">
      {{'flAuth.forgot_password' | translate}}
    </span>
    <a class="g-primary-text g-text-small g-text-link" [routerLink]="signupRoute">
      {{'flAuth.signup_link' | translate}}
    </a>
  </div>
</fl-login-page>

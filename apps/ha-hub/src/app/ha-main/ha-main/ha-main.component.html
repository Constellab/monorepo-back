<mat-toolbar class="nav-bar" fxHide.lt-sm>
  <a routerLink="../" class="gencovery-hub-logo gencovery-logo">
    <img alt="" src="../../../assets/images/gencovery-logo.png" fxHide.gt-sm/>
    <img alt="" src="../../../assets/images/hub-logo.png" fxHide.lt-md/>
  </a>

  <span class="option"><a routerLink="../">Home</a></span>
  <span class="option"><a [href]="constellabUrl" target="_blank">Constellab</a></span>
  <span class="spacer"></span>

  <ng-container *ngIf="(userConnected$ | async) == null">
    <a mat-flat-button color="primary" class="g-centered-forced bt-register"
       [href]="constellabUrl" target="_blank">
      {{'register' | translate}}
    </a>
    <a [routerLink]="loginRoute" mat-flat-button color="primary"
       class="g-centered-forced">
      {{'login' | translate}}
    </a>
  </ng-container>

  <span class="g-centered-forced span-initials" [matMenuTriggerFor]="userMenu" *ngIf="userConnected$ | async as user">
    <fl-user-profile-picture [user]="user">
    </fl-user-profile-picture></span>
  <mat-menu #userMenu="matMenu">
    <button mat-menu-item [routerLink]="'../admin'">{{'admin_dashboard' | translate}}</button>
    <button mat-menu-item (click)="logout()">{{'logout' |translate}}</button>
  </mat-menu>
</mat-toolbar>

<mat-toolbar class="nav-bar" fxHide.gt-xs>
  <a routerLink="../">
    <img alt="" src="../../../assets/images/gencovery-logo.png" class="gencovery-logo"/>
  </a>
  <span class="option"><a routerLink="../"><mat-icon>home</mat-icon></a></span>
  <span class="option"><a [href]="constellabUrl" target="_blank"><mat-icon>auto_awesome</mat-icon></a></span>
  <span class="spacer"></span>

  <ng-container *ngIf="(userConnected$ | async) == null">

       [href]="constellabUrl" target="_blank">
      {{'register' | translate}}
    </a>
    <a [routerLink]="loginRoute" mat-flat-button color="primary"
       class="g-centered-forced">
      {{'login' | translate}}
    </a>
  </ng-container>


  <span class="g-centered-forced span-initials" [matMenuTriggerFor]="userMenu" *ngIf="userConnected$ | async as user">
    <fl-user-profile-picture [user]="user">
    </fl-user-profile-picture></span>
  <mat-menu #userMenu="matMenu">
    <button mat-menu-item [routerLink]="'../admin'">{{'admin_dashboard' | translate}}</button>
    <button mat-menu-item (click)="logout()">{{'logout' |translate}}</button>
  </mat-menu>
</mat-toolbar>

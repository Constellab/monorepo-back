<fl-dialog-header>
  {{isUpdate ? ('edit_title' | translate) : ('create' | translate) }}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="edit-form" [formGroup]="formGp" fxLayout="column" class="form">

    <!--  type  -->
    <mat-radio-group formControlName="type" name="type" class="radio-button-zone" *ngIf="!isUpdate">
      <mat-radio-button [value]="'DOC'" [checked]="true">{{'documentation' | translate }}</mat-radio-button>
      <mat-radio-button [value]="'FOL'" class="radio-button-right">{{'folder' | translate }}</mat-radio-button>
      <mat-radio-button [value]="'TEC'" class="radio-button-right">{{'technical_documentation' | translate }}</mat-radio-button>
    </mat-radio-group>

    <!--  title  -->
    <mat-form-field class="g-form-input not-first-input" *ngIf="formGp.controls['type'].value !== 'TEC'">
      <mat-label>{{'title' | translate}}</mat-label>
      <input matInput formControlName="title" required flInputMaxLength="50"
             placeholder="{{'title' | translate}}" cdkFocusInitial>
      <mat-error *ngIf="formGp.get('title').hasError('required')">
        {{'title' | flErrorRequired}}
      </mat-error>
    </mat-form-field>

    <fl-input-file-container color="primary" [placeholder]="'import_technical_documentation' | translate"
                             *ngIf="formGp.controls['type'].value === 'TEC' && !isLoadingImport" class="g-centered-forced input-file">
      <input flInputFile type="file" [strictMode]="true"
             accept="application/json" (fileChange)="onFileSelected($any($event))">
    </fl-input-file-container>
    <p class="input-error-text" *ngIf="errorFile && formGp.controls['type'].value === 'TEC'">{{errorFileText | translate}}</p>

    <div class="import-loader" *ngIf="formGp.controls['type'].value === 'TEC' && isLoadingImport">
      <fl-loader></fl-loader>
    </div>
  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-raised-button color="primary" type="submit" form="edit-form"
          class="g-centered-forced" *ngIf="formGp.controls['type'].value !== 'TEC'">
    {{'save' | translate}}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>

</div>

<ha-ha404 [errorText]="'error_brick_not_found'" *ngIf="brickNotFound"></ha-ha404>

<fl-async-section [object]="brick$" class="full-w" *ngIf="!brickNotFound">
  <ng-container *flSectionBody="let brick">

    <div class="left-panel">
      <mat-icon class="button-left-panel" haSidenavButton></mat-icon>
      <a [routerLink]="'/bricks'" class="back-link">
        <fl-text-icon [iconPosition]="'start'">
          <mat-icon>arrow_back</mat-icon>
          {{'back_to_all_bricks' | translate}}
        </fl-text-icon>
      </a>
      <ha-public-sidenav [brick]="brick"></ha-public-sidenav>
      <div class="sidenav-div">
        <p>{{'related_tags' | translate}} :</p>
        <mat-chip-listbox>
          <mat-chip>Gencovery data</mat-chip>
          <mat-chip>Analysis</mat-chip>
          <mat-chip>Verified</mat-chip>
        </mat-chip-listbox>
      </div>
    </div>
    <div class="main-panel">
      <div class="brick-content-div">
        <router-outlet></router-outlet>
      </div>
    </div>
    <!--    <router-outlet></router-outlet>-->
  </ng-container>
</fl-async-section>

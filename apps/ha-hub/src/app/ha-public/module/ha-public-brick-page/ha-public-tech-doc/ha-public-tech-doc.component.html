<ha-ha404 [errorText]="'error_tech_doc_not_found'" *ngIf="techDocNotFound"></ha-ha404>

<div class="loader" *ngIf="isLoading">
  <fl-loader size="medium"></fl-loader>
</div>
<div class="doc-div" *ngIf="!isLoading && techDoc">
  <div class="doc-div-content g-max-article-width g-scrollable-element">
    <div class="doc-title-div" *ngIf="techDoc">
      <td-technical-doc-header [technicalDoc]="techDoc"></td-technical-doc-header>
    </div>
    <td-technical-doc [technicalDoc]="techDoc"></td-technical-doc>
  </div>
</div>

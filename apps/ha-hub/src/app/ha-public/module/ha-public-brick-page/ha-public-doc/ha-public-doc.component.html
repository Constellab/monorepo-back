
<div class="no-doc-div"*ngIf="docNotFound">
  <ha-ha404 [errorText]="'error_doc_not_found'" ></ha-ha404>
</div>

<div class="sidenavBody" *ngIf="!docNotFound">

  <div class="content">
    <div class="loader" *ngIf="isLoading">
      <fl-loader size="medium"></fl-loader>
    </div>
    <div class="doc-title-div" *ngIf="documentation && !isLoading">
      <div class="doc-title-bt">
        <h1 class="doc-title">{{documentation.title}}</h1>
        <div class="doc-bt" *ngIf="isAdmin | async">
          <button mat-icon-button type="button" (click)="onClickMenu($event)">
            <mat-icon>
              more_vert
            </mat-icon>
          </button>
        </div>
      </div>

    </div>
    <form class="documentation-form" [formGroup]="formGp" *ngIf="!isLoading">
      <fl-text-editor class="content-editor g-max-article-width" formControlName="content"
                      [disabled]="(isAdmin | async) === false || isDisabled" mode="JSON" scrollContainer="child"
                      [config]="textEditorConfig" (textChange)="onContentUpdate($event)"
                      flAutoScrollToAnchor></fl-text-editor>
    </form>
  </div>
  <div class="side" fxHide.lt-lg>
    <h1 class="title-doc-side" *ngIf="documentation">{{documentation.title}}</h1>
    <div *ngIf="documentation" class="title-side-line"></div>
    <ng-container *ngFor="let title of titles; let i = index">
      <ng-container *ngIf="title.level === 2; else e">
        <a [routerLink]="'.'" [fragment]="title.id" *ngIf="title.id"><h3>{{title.title}}</h3></a>
        <a [routerLink]="'.'" *ngIf="!title.id"><h3>{{title.title}}</h3></a>
      </ng-container>
      <ng-template #e>
        <a [routerLink]="'.'" [fragment]="title.id" *ngIf="title.id"><h4>{{title.title}}</h4></a>
        <a [routerLink]="'.'" *ngIf="!title.id"><h4>{{title.title}}</h4></a>
      </ng-template>
    </ng-container>
  </div>
</div>

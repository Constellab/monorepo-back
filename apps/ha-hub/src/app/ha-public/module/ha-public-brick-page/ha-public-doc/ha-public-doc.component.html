<div class="no-doc-div" *ngIf="docNotFound">
  <ha-ha404 [errorText]="'error_doc_not_found'"></ha-ha404>
</div>


<div class="main-panel" *ngIf="!docNotFound">
  <div class="loader" *ngIf="isLoading || !documentation">
    <fl-loader size="medium"></fl-loader>
  </div>
  <div class="doc-div" *ngIf="!isLoading && documentation">
    <div class="doc-div-content g-max-article-width">
      <div class="doc-title-div">
        <h4>{{documentation.title}}</h4>
        <button mat-icon-button type="button" (click)="onClickMenu($event)" *ngIf="isAdmin | async">
          <mat-icon>
            more_vert
          </mat-icon>
        </button>
      </div>
      <form class="documentation-form" [formGroup]="formGp" *ngIf="!isLoading">
        <fl-text-editor class="content-editor g-max-article-width" formControlName="content"
                        [disabled]="(isAdmin | async) === false || isDisabled" mode="JSON" scrollContainer="auto"
                        [config]="textEditorConfig" (textChange)="onContentUpdate($event)" [noPadding]="true"
                        flAutoScrollToAnchor></fl-text-editor>
      </form>
    </div>
  </div>
</div>
<div class="right-div g-scrollable-element" *ngIf="documentation">
  <div>
    <ha-public-brick-right-panel [currentPage]="documentation.title" [brickVersion]="brickVersion" [brickName]="brickName"
                                 [docTitles]="titles"></ha-public-brick-right-panel>
  </div>
</div>

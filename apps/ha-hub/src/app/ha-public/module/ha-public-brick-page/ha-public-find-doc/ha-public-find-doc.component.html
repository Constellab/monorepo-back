<fl-portal>
  <fl-portal-content class="portal-content">

    <form>
      <mat-form-field class="research-bar" appearance="fill">
        <mat-label>Assignee</mat-label>
        <input type="text" matInput [formControl]="myControl" [matAutocomplete]="auto">
        <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayFn">
          <mat-option *ngFor="let doc of filteredDocumentations | async" [value]="doc">
        <span class="option">
          {{doc.anchor ? doc.name + ' - ' + doc.anchor : doc.name}}
          <span class="option-info g-text-light">
            {{searchByLink && doc.brickName !== brickName ? ('from' | translate) + ' ' + doc.brickName + ' v' + doc.major : 'current_brick' | translate}}
          </span>
        </span>
          </mat-option>
        </mat-autocomplete>
      </mat-form-field>
    </form>

  </fl-portal-content>
</fl-portal>

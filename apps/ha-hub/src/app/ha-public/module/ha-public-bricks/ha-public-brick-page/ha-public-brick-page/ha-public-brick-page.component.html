<fl-async-section [object]="brick$" class="full-w">

  <ng-container *flSectionBody="let brick">

    <fl-article-container class="brickCard">
      <fl-article>
        <h1>
          {{ brick.name }}
        </h1>
        <p>
          {{brick.description}}
        </p>
      </fl-article>
    </fl-article-container>
    <router-outlet></router-outlet>
  </ng-container>

</fl-async-section>

<fl-dialog-header>
  {{isUpdate ? 'Edit' : 'Create' }}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="edit-form" [formGroup]="formGp" fxLayout="column">

    <!--  type  -->
    <mat-form-field class="g-form-input" *ngIf="!isUpdate">
      <mat-label>Type</mat-label>
      <mat-select formControlName="isFolder" name="type">
        <mat-option [value]="true">
          {{'folder' | translate }}
        </mat-option>
        <mat-option [value]="false">
          {{'documentation' | translate }}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="formGp.get('isFolder').hasError('required')">
        {{'type' | flErrorRequired}}
      </mat-error>
    </mat-form-field>

    <!--  title  -->
    <mat-form-field class="g-form-input">
      <mat-label>{{'title' | translate}}</mat-label>
      <input matInput formControlName="title" required flInputMaxLength="50"
             placeholder="{{'title' | translate}}">
      <mat-error *ngIf="formGp.get('title').hasError('required')">
        {{'title' | flErrorRequired}}
      </mat-error>
    </mat-form-field>

    <!--  path  -->
    <mat-form-field class="g-form-input">
      <mat-label>{{'path' | translate}}</mat-label>
      <input matInput formControlName="path" required flInputMaxLength="50"
             placeholder="{{'path' | translate}}">
      <mat-error *ngIf="formGp.get('path').hasError('required')">
        {{'path' | flErrorRequired}}
      </mat-error>
      <mat-error *ngIf="formGp.get('path').hasError('pattern')">
        {{'path_pattern_error' | translate}}
      </mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-raised-button color="primary" type="submit" form="edit-form"
          class="g-centered-forced">
    {{'save' | translate}}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>

<fl-dialog-header>
  {{'add_version' | translate}}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="add-version-form" [formGroup]="formGp" fxLayout="column">

    <!--  version  -->
    <mat-form-field class="g-form-input">
      <mat-label>{{'version' | translate}}</mat-label>
      <input matInput formControlName="version" required flInputMaxLength="50"
             placeholder="{{'version' | translate}}">
      <mat-error *ngIf="formGp.get('version').hasError('required')">
        {{'version' | flErrorRequired}}
      </mat-error>
    </mat-form-field>

    <!--  type of repository  -->
    <mat-form-field class="g-form-input">
      <mat-label>{{'type_of_repository' | translate}}</mat-label>
      <mat-select placeholder="{{'type_of_repository' | translate}}" required formControlName="repoType" value="GIT">
        <mat-option value="GIT" >GIT</mat-option>
        <mat-option value="PIP">PIP</mat-option>
      </mat-select>
      <mat-error *ngIf="formGp.get('repoType').hasError('required')">
        {{'type_of_repository' | flErrorRequired}}
      </mat-error>
    </mat-form-field>

    <label>{{'is_it_a_beta_version' | translate}} ?</label>
    <!--  isBeta  -->
    <mat-radio-group formControlName="isBeta" name="type">
      <mat-radio-button [value]="true" class="radio-button-bt">{{'yes' | translate }}</mat-radio-button>
      <mat-radio-button [value]="false" [checked]="true">{{'no' | translate }}</mat-radio-button>
    </mat-radio-group>

    <!--  subPatch  -->
    <mat-form-field class="g-form-input" *ngIf="formGp.value.isBeta">
      <mat-label>{{'beta_number' | translate}}</mat-label>
      <input matInput formControlName="subPatch" required flInputMaxLength="50"
             placeholder="{{'subPatch' | translate}}">
      <mat-error *ngIf="formGp.get('subPatch').hasError('required')">
        {{'version' | flErrorRequired}}
      </mat-error>
    </mat-form-field>

  </form>
</mat-dialog-content>



<div mat-dialog-actions>
  <button mat-raised-button color="primary" type="submit" form="add-version-form"
          class="g-centered-forced">
    {{'save' | translate}}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>

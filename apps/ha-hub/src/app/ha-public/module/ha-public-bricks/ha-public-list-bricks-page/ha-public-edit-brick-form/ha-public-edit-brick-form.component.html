<form (ngSubmit)="submit()" class="brick-form" [formGroup]="formGp">
  <!--  name  -->
  <mat-form-field class="g-form-input" appearance="fill">
    <mat-label>{{'name' | translate}}</mat-label>
    <input matInput type="text" formControlName="name">
    <mat-error *ngIf="formGp.get('name').hasError('required')">
      {{'name' | flErrorRequired}}
    </mat-error>
  </mat-form-field>

  <!--  description  -->
  <mat-form-field class="g-form-input" appearance="fill">
    <mat-label>{{'description' | translate}}</mat-label>
    <textarea matInput formControlName="description"></textarea>
    <mat-error *ngIf="formGp.get('description').hasError('required')">
      {{'description' | flErrorRequired}}
    </mat-error>
  </mat-form-field>

  <button mat-raised-button color="primary" type="submit" class="g-centered-forced">
    {{'save' | translate}}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</form>

<fl-dialog-header>
  {{'add_coauthors' | translate}}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="story-form" [formGroup]="formGp" *ngIf="formGp">
    <mat-form-field class="chip-list" appearance="fill">
      <mat-label>{{'coauthors' | translate}}</mat-label>
      <mat-chip-list #chipList>
        <mat-chip *ngFor="let cA of coAuthors" (removed)="remove(cA)">
          {{cA.id ? cA.fullName : cA.email}}
          <button mat-icon-button class="chip-icon-bt" (click)="cA.id ? openRemoveConfirmDialog(cA) : remove(cA)">
            <mat-icon>cancel</mat-icon>
          </button>
        </mat-chip>
        <input [matChipInputFor]="chipList"
               [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
               [matChipInputAddOnBlur]="true"
               (matChipInputTokenEnd)="add($event)">
      </mat-chip-list>
    </mat-form-field>
  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button color="primary" type="submit" form="story-form" class="g-centered-forced">
    {{'save' | translate}}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>

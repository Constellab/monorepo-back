<fl-dialog-title>
  {{title | translate}}
</fl-dialog-title>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="server-info-form" [formGroup]="formGp">

    <!--  Ip  -->
    <mat-form-field class="g-form-input" appearance="outline">
      <mat-label>{{'label' | translate}}</mat-label>
      <input matInput formControlName="label" required flInputMaxLength="50"
             placeholder="{{'label' | translate}}">
      <mat-error *ngIf="formGp.get('label').hasError('required')">
        {{'label' | flErrorRequired}}
      </mat-error>
    </mat-form-field>

  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-raised-button color="primary" type="submit" form="server-info-form"
          class="g-centered-forced">
    {{'save' | translate}}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>

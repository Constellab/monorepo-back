<gen-dialog-title>
  {{'new_protocol' | translate}}
</gen-dialog-title>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="protocol-form">
    <gen-protocol-form [formGp]="formGp"></gen-protocol-form>
  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-raised-button color="primary" type="submit" form="protocol-form"
          class="g-centered-forced">
    {{'save' | translate}}
    <gen-button-loader *ngIf="isLoading"></gen-button-loader>
  </button>
</div>

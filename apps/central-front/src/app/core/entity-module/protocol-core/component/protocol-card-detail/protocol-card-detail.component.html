<gen-card>
  <gen-card-header>
    <gen-text-icon>
      <mat-icon svgIcon="protocol" class="g-icon-big"></mat-icon>
      <p>{{protocol.label}}</p>
    </gen-text-icon>

    <gen-card-actions>
      <a [routerLink]="protocolDetailPage" mat-button
         class="g-button-small" *ngIf="showDetailButton">
        {{'protocol_detail_link' | translate}}
      </a>
    </gen-card-actions>
  </gen-card-header>

  <gen-card-body>
    <div *ngIf="protocol.hasProtocol()">
      <gen-protocol-json [json]="protocol.getJsonProtocol()"></gen-protocol-json>
    </div>
  </gen-card-body>
</gen-card>

<fl-dialog-title>
  {{title | translate}}
</fl-dialog-title>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="status-form">

    <!--  Status  -->
    <mat-form-field class="g-form-input" appearance="outline">
      <mat-label>{{'status' | translate}}</mat-label>
      <mat-select [formControl]="formControl" placeholder="{{'status' | translate}}"
                  required>
        <mat-option *ngFor="let status of enum | flObjectKeys" [value]="status">
          {{status | translate}}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="formControl.hasError('required')">
        {{'status' | flErrorRequired}}
      </mat-error>
      <mat-error *ngIf="formControl.hasError('sameValue')">
        {{'same_status_error' | translate}}
      </mat-error>
    </mat-form-field>

  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-raised-button color="primary" type="submit" form="status-form"
          class="g-centered-forced">
    {{'save' | translate}}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>

<div class="g-page">

  <gen-async-section [arrayObs]="labsArrays" emptyText="no_lab_instance">

    <gen-section-header class="g-page-title">
      <gen-text-icon iconPosition="start">
        <mat-icon class="g-icon-big">view_list</mat-icon>
        <h1>{{'labs_catalog' | translate}}</h1>
      </gen-text-icon>

      <gen-section-actions>
        <button mat-raised-button type="button" color="accent"
                class="g-button-small" (click)="openCreateLabDialog()">
          <mat-icon>add</mat-icon>
        </button>

      </gen-section-actions>
    </gen-section-header>

    <ng-container *genSectionBody>
      <gen-lab-table [datasource]="labsArrays" [columns]="columns"></gen-lab-table>
    </ng-container>

  </gen-async-section>

</div>

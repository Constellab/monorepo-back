<div class="g-page">
  <gen-section [isLoading]="isLoading" [object]="protocol">

    <ng-template genSectionBody>
      <gen-text-icon>
        <mat-icon class="g-icon-big" svgIcon="protocol"></mat-icon>
        <h1>{{protocol.label}}</h1>
      </gen-text-icon>

      <fl-card>
        <fl-card-body>
          <gen-protocol-json [json]="protocol.getJsonProtocol()" [expandProtocol]="true"></gen-protocol-json>
        </fl-card-body>
      </fl-card>

      <gen-protocol-experiments-list [protocolId]="protocol.id"
                                     class="g-section"></gen-protocol-experiments-list>
    </ng-template>
  </gen-section>
</div>

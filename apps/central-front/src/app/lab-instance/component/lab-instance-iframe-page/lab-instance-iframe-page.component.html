<fl-section class="full-page" [isLoading]="isLoading" [object]="labInstanceToken" [emptyText]="errorText">

  <ng-template flSectionBody>
    <gen-lab-instance-iframe [labUrl]="labInstanceToken.labInstance.url"

                             [iframeOption]="iframeOptions"></gen-lab-instance-iframe>
  </ng-template>

</fl-section>

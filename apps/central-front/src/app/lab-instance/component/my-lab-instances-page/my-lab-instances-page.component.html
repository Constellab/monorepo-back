<div class="g-page">

  <fl-async-section [arrayObs]="labInstancesDatasource" emptyText="no_lab_instance">

    <fl-section-header class="g-page-title">
      <fl-text-icon iconPosition="start">
        <mat-icon class="g-icon-big" svgIcon="lab"></mat-icon>
        <h1>{{'my_labs' | translate}}</h1>
      </fl-text-icon>

      <fl-section-actions>
        <button mat-raised-button type="button" color="accent"
                disabled class="g-button-small">
          <mat-icon>add</mat-icon>
        </button>

      </fl-section-actions>
    </fl-section-header>

    <ng-container *flSectionBody="let labInstances">
      <gen-lab-instances-list [labInstances]="labInstances"></gen-lab-instances-list>

      <fl-pagination-load-more-result [datasource]="labInstancesDatasource"></fl-pagination-load-more-result>
    </ng-container>

  </fl-async-section>

</div>

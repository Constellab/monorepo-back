<fl-dialog-title>
  {{'lab_user_create' | translate}}
</fl-dialog-title>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="lab-name-form">

    <!--  Name  -->
    <mat-form-field class="g-form-input" appearance="outline">
      <mat-label>{{'name' | translate}}</mat-label>
      <input matInput [formControl]="formControl" required flInputMaxLength="15"
             placeholder="{{'name' | translate}}">
      <mat-error *ngIf="formControl.hasError('required')">
        {{'name' | flErrorRequired}}
      </mat-error>
    </mat-form-field>

  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-raised-button color="primary" type="submit" form="lab-name-form"
          class="g-centered-forced">
    {{'save' | translate}}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>

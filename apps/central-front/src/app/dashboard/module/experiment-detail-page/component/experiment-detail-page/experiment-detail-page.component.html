<gen-section [isLoading]="isLoading" [object]="experiment">

  <ng-template genSectionBody>
    <div fxLayout="row" fxLayoutAlign="space-between center" class="header">
      <gen-text-icon>
        <mat-icon class="g-icon-big" svgIcon="experiment"></mat-icon>
        <h1>{{experiment.label}}</h1>
      </gen-text-icon>

      <div fxLayout="row" fxLayoutAlign="start center">
        <button mat-icon-button type="button" (click)="openStatusHistory()"
                [matTooltip]="'status_history' | translate">
          <mat-icon>history</mat-icon>
        </button>
        <gen-status-chip [statusHistory]="experiment.currentStatus"
                         class="g-text-big">
        </gen-status-chip>
      </div>
    </div>


    <div fxLayout="row" fxLayoutAlign="start stretch" fxLayout.lt-md="column" fxLayoutGap="2em">
      <gen-experiment-card-detail [experiment]="experiment" (update)="onExperimentUpdate($event)"
                                  class="flex">
      </gen-experiment-card-detail>

      <!--  Lab instance   -->
      <div class="flex">
        <gen-lab-instance-card [labInstance]="experiment.labInstance"
                               (labInstanceUpdated)="onLabInstanceUpdate($event)"
                               mode="big"></gen-lab-instance-card>
      </div>
    </div>

    <!--  Protocol  -->
    <div class="g-section" *ngIf="showProtocolForm; else protocolCard">
      <gen-experiment-protocol-edit [experimentId]="experiment.id"
                                    [protocol]="experiment.protocol"
                                    (protocolUpdate)="onExperimentUpdate($event)">
      </gen-experiment-protocol-edit>
    </div>

    <ng-template #protocolCard>
      <gen-protocol-card-detail class="g-section" [protocol]="experiment.protocol">
      </gen-protocol-card-detail>

      <!--  Report  -->
      <fl-card class="g-section">
        <fl-card-header>
          <gen-text-icon>
            <mat-icon class="g-icon-big">assignment</mat-icon>
            <p>{{'reports' | translate}}</p>
          </gen-text-icon>
        </fl-card-header>

        <fl-card-body>
          <gen-reports-list [experimentId]="experiment.id"></gen-reports-list>
        </fl-card-body>
      </fl-card>
    </ng-template>
  </ng-template>
</gen-section>

<fl-async-section [arrayObs]="experimentsArray" emptyText="no_experiment">

  <fl-section-header>
    <fl-text-icon>
      <mat-icon svgIcon="experiment"></mat-icon>
      <h2>{{'experiments' | translate}}</h2>
    </fl-text-icon>

<!--    <fl-section-actions>-->
<!--      <button mat-mini-fab type="button" color="accent"-->
<!--              (click)="openCreateExperimentDialog()"-->
<!--              [matTooltip]="'new_experiment' | translate">-->
<!--        <mat-icon>add</mat-icon>-->
<!--      </button>-->
<!--    </fl-section-actions>-->
  </fl-section-header>


  <ng-container *flSectionBody="let experiments">
    <div fxLayout="row wrap" fxLayoutGap="1%" fxLayoutGap.lt-md="0">
      <a class="experiment" *ngFor="let experiment of experiments; let i= index"
         [routerLink]="'experiment/' + experiment.id"
         fxFlex="24%" fxFlex.md="49%" fxFlex.lt-md="100%">
        <gen-experiment-card [experiment]="experiment" fxFill></gen-experiment-card>
      </a>
    </div>
  </ng-container>

</fl-async-section>

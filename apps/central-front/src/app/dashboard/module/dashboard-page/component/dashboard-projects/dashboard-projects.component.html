<gen-async-section [arrayObs]="projectsDatasource" emptyText="no_project">

  <gen-section-header class="g-headline">
    <a [routerLink]="myProjectsRoute" class="text-link">
      <gen-text-icon iconPosition="start">
        <mat-icon class="g-icon-big" svgIcon="project"></mat-icon>
        <h2>{{'my_projects' | translate}}</h2>
      </gen-text-icon>
    </a>
  </gen-section-header>

  <ng-container *genSectionBody="let projects">
    <gen-projects-list [projects]="projects"></gen-projects-list>
  </ng-container>

</gen-async-section>

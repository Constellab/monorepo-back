<fl-async-section [arrayObs]="labArray" emptyText="no_labs">
  <fl-section-header class="g-headline">
    <a [routerLink]="labsRoute" class="text-link">
      <fl-text-icon iconPosition="start">
        <mat-icon class="g-icon-big">view_list</mat-icon>
        <h2>{{'labs_catalog' | translate}}</h2>
      </fl-text-icon>
    </a>
  </fl-section-header>


  <ng-container *flSectionBody="let labs">
    <fl-card>
      <fl-card-body>
        <mat-nav-list dense>
          <mat-list-item *ngFor="let lab of labs">
            <mat-icon matListIcon>arrow_forward_ios</mat-icon>
            <a matLine>{{ lab.label }}</a>
          </mat-list-item>
        </mat-nav-list>
      </fl-card-body>
    </fl-card>
  </ng-container>
</fl-async-section>

<gen-async-section [arrayObs]="labArray" emptyText="no_labs">
  <gen-section-header class="g-headline">
    <a [routerLink]="labsRoute" class="text-link">
      <gen-text-icon iconPosition="start">
        <mat-icon class="g-icon-big">view_list</mat-icon>
        <h2>{{'labs_catalog' | translate}}</h2>
      </gen-text-icon>
    </a>
  </gen-section-header>


  <ng-container *genSectionBody="let labs">
    <gen-card>
      <gen-card-body>
        <mat-nav-list dense>
          <mat-list-item *ngFor="let lab of labs">
            <mat-icon matListIcon>arrow_forward_ios</mat-icon>
            <a matLine>{{ lab.label }}</a>
          </mat-list-item>
        </mat-nav-list>
      </gen-card-body>
    </gen-card>
  </ng-container>
</gen-async-section>

<gen-async-section [arrayObs]="labInstancesDatasource" emptyText="no_lab_instance">

  <gen-section-header class="g-headline">
    <a [routerLink]="myLabInstancesRoute" class="text-link">
      <gen-text-icon iconPosition="start">
        <mat-icon class="g-icon-big" svgIcon="lab"></mat-icon>
        <h2>{{'my_labs' | translate}}</h2>
      </gen-text-icon>
    </a>
  </gen-section-header>

  <ng-container *genSectionBody="let labInstance">
    <gen-lab-instances-list [labInstances]="labInstance"></gen-lab-instances-list>
  </ng-container>

</gen-async-section>

<fl-dialog-title>
  {{title | translate}}
</fl-dialog-title>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="project-form" [formGroup]="formGp">

    <!--  title  -->
    <mat-form-field class="g-form-input" appearance="outline">
      <mat-label>{{'title' | translate}}</mat-label>
      <input matInput formControlName="title" required flInputMaxLength="50"
             placeholder="{{'title' | translate}}">
      <mat-error *ngIf="formGp.get('title').hasError('required')">
        {{'title' | flErrorRequired}}
      </mat-error>
    </mat-form-field>


    <!--    Description      -->
    <fl-form-field class="g-form-input">
      <mat-label>{{'description' | translate}}</mat-label>
      <fl-text-editor formControlName="description"
                      class="text-editor">
      </fl-text-editor>
      <mat-error *ngIf="formGp.get('description').hasError('required')">
        {{'description' | flErrorRequired}}
      </mat-error>
    </fl-form-field>

  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-raised-button color="primary" type="submit" form="project-form"
          class="g-centered-forced">
    {{'save' | translate}}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>

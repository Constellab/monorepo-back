<fl-card class="g-full">

  <fl-card-header>
    <div>{{study.title}}</div>

    <fl-card-actions>
      <gen-status-chip [statusHistory]="study.currentStatus" mode="iconOnly">
      </gen-status-chip>
    </fl-card-actions>
  </fl-card-header>

  <fl-card-body>
    <gen-study-info [study]="study"></gen-study-info>
  </fl-card-body>

</fl-card>

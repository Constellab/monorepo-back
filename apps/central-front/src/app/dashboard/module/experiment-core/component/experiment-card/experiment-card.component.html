<fl-card class="g-full">

  <fl-card-header>
    <div>{{experiment.label}}</div>

    <fl-card-actions>
      <fl-status-chip [status]="experiment.currentStatus" mode="iconOnly">
      </fl-status-chip>
    </fl-card-actions>

  </fl-card-header>

  <fl-card-body>

    <gen-experiment-info [experiment]="experiment"></gen-experiment-info>
  </fl-card-body>

  <fl-card-footer>
    <a *ngIf="openInLabLink" [routerLink]="openInLabLink" [queryParams]="linkQueryParams"
       mat-button class="g-button-small go-to-button">
      {{'open_experiment_in_lab' | translate}}
      <mat-icon>arrow_forward_ios</mat-icon>
    </a>
  </fl-card-footer>
</fl-card>

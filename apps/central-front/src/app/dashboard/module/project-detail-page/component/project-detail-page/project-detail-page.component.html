<div>

  <fl-section [isLoading]="isLoading" [object]="project">

    <ng-template flSectionBody>
      <gen-project-detail [project]="project"
                          (projectUpdated)="onProjectUpdate($event)">
      </gen-project-detail>


      <gen-studies-list class="studies" [projectId]="project.id"></gen-studies-list>
    </ng-template>
  </fl-section>
</div>

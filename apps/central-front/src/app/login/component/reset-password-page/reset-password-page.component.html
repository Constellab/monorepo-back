<div class="g-page" fxLayout="column">

  <a routerLink="/" mat-icon-button>
    <mat-icon>home</mat-icon>
  </a>

  <div fxFlex="grow" fxLayoutAlign="center center">
    <gen-card class="card">
      <gen-card-header>
        <h1 class="g-page-title">{{'reset_password' | translate}}</h1>

      </gen-card-header>

      <gen-card-body>


        <form (ngSubmit)="submit()" [formGroup]="formGp">

          <!--  Password -->
          <mat-form-field appearance="outline" class="g-form-input">
            <mat-label>{{'password' | translate}}</mat-label>
            <input matInput type="password" formControlName="password" required
                   placeholder="{{'password' | translate}}" autocomplete="new-password">
            <mat-error *ngIf="formGp.get('password').hasError('required')">
              {{'password' | errorRequired}}
            </mat-error>
            <mat-error *ngIf="formGp.get('password').hasError('incorrectPasswordFormat')">
              {{'password_weak_error' | translate}}
            </mat-error>
          </mat-form-field>

          <!--  Repeat Password -->
          <mat-form-field appearance="outline" class="g-form-input">
            <mat-label>{{'repeat_password' | translate}}</mat-label>
            <input matInput type="password" formControlName="repeatPassword" required
                   placeholder="{{'repeat_password' | translate}}" autocomplete="off">
            <mat-error *ngIf="formGp.get('repeatPassword').hasError('required')">
              {{'repeat_password' | errorRequired}}
            </mat-error>
            <mat-error *ngIf="formGp.get('repeatPassword').hasError('incorrectRepeatPassword')">
              {{'repeat_password_error' | translate}}
            </mat-error>
          </mat-form-field>

          <button mat-raised-button color="primary" type="submit"
                  class="g-centered-forced">
            {{'reset_password' | translate}}
            <gen-button-loader *ngIf="isLoading"></gen-button-loader>
          </button>
        </form>

      </gen-card-body>

    </gen-card>
  </div>
</div>

<form (ngSubmit)="submit()" id="documentation-form" [formGroup]="formGp">

    <!--  title  -->
    <mat-form-field class="g-form-input">
        <mat-label>Title</mat-label>
        <input type="text">
        <mat-error *ngIf="formGp.get('title').hasError('required')">
            {{'title' | flErrorRequired}}
        </mat-error>
    </mat-form-field>


    <!--    content      -->
    <mat-form-field class="g-form-input">
        <mat-label>Content</mat-label>
        <textarea></textarea>
        <mat-error *ngIf="formGp.get('content').hasError('required')">
            {{'content' | flErrorRequired}}
        </mat-error>
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit" form="documetation-form" class="g-centered-forced">
        Save
        <!-- <fl-button-loader *ngIf="isLoading"></fl-button-loader> -->
    </button>
</form>

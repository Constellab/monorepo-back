<form (ngSubmit)="submit()" id="documentation-form" [formGroup]="formGp">

    <!--  title  -->
    <mat-form-field class="g-form-input" appearance="fill">
        <mat-label>Title</mat-label>
        <input matInput type="text" formControlName="title">
        <mat-error *ngIf="formGp.get('title').hasError('required')">
            {{'title' | flErrorRequired}}
        </mat-error>
    </mat-form-field>


    <!--    content      -->
    <mat-form-field class="g-form-input" appearance="fill">
        <mat-label>Content</mat-label>
        <textarea matInput formControlName="content"></textarea>
        <mat-error *ngIf="formGp.get('content').hasError('required')">
            {{'content' | flErrorRequired}}
        </mat-error>
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit" form="documentation-form" class="g-centered-forced">
        Save
    </button>
</form>

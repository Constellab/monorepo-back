<form (ngSubmit)="submit()" id="documentation-form" [formGroup]="formGp">

    <!--  title  -->
    <mat-form-field class="g-form-input" appearance="fill">
        <mat-label>{{'title' | translate}}</mat-label>
        <input matInput type="text" formControlName="title">
        <mat-error *ngIf="formGp.get('title').hasError('required')">
            {{'title' | flErrorRequired}}
        </mat-error>
    </mat-form-field>


    <!--    content      -->
    <fl-form-field class="g-form-input">
        <mat-label>{{'content' | translate}}</mat-label>
        <quill-editor formControlName="content" placeholder="{{'content' | translate}}"
                      class="g-full" [styles]="{height: '8em'}">
        </quill-editor>
        <mat-error *ngIf="formGp.get('content').hasError('required')">
          {{'content' | flErrorRequired}}
        </mat-error>
    </fl-form-field>
  
    <!--  path  -->
    <mat-form-field class="g-form-input" appearance="fill">
        <mat-label>{{'path' | translate}}</mat-label>
        <input matInput type="text" formControlName="path">
        <mat-error *ngIf="formGp.get('path').hasError('required')">
            {{'path' | flErrorRequired}}
        </mat-error>
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit" form="documentation-form" class="g-centered-forced">
        {{'save' | translate}}
        <fl-button-loader *ngIf="isLoading"></fl-button-loader>
    </button>
</form>

<button mat-raised-button color="primary" [routerLink]="'edit'">
  Create
</button>

<button mat-raised-button color="primary" style="margin-left: 10px" (click)="editFolder()">
  Create Folder
</button>

<mat-tree [dataSource]="dataSource" [treeControl]="treeControl" class="tree">

  <!-- This is the tree node template for leaf nodes -->
  <mat-tree-node *matTreeNodeDef="let node" matTreeNodePadding matTreeNodePaddingIndent="10px" class="tree-node">
    <mat-nav-list class="nav-list" [routerLink]="'../docs/' + node.completePath">
      <mat-list-item *ngIf="node.id != null; else elseBlock">
        <div matLine>
          {{node.name}}
        </div>
        <button mat-icon-button [routerLink]="edit(node.id)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button (click)="delete(node.id, $event)">
          <mat-icon>delete</mat-icon>
        </button>
      </mat-list-item>
      <ng-template #elseBlock>
        <div>
          The folder is empty.
        </div>
      </ng-template>
    </mat-nav-list>
  </mat-tree-node>

  <!-- This is the tree node template for expandable nodes -->
  <mat-tree-node *matTreeNodeDef="let node;when: hasChild" matTreeNodePadding matTreeNodePaddingIndent="10px">
    <mat-nav-list class="nav-list">
      <mat-list-item>
        <button mat-icon-button matTreeNodeToggle
                [attr.aria-label]="'Toggle ' + node.name">
          <mat-icon class="mat-icon-rtl-mirror">
            {{treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right'}}
          </mat-icon>
        </button>
        <div matLine>
          {{node.name}}
        </div>
        <button mat-icon-button (click)="editFolder(node)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button (click)="deleteFolder(node.id, node.parentId)">
          <mat-icon>delete</mat-icon>
        </button>

      </mat-list-item>
    </mat-nav-list>
  </mat-tree-node>
</mat-tree>

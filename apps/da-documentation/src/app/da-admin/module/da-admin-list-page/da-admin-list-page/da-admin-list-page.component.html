<p>Documentations</p>

<button mat-raised-button color="primary" (click)="create()" class="g-centered-forced">
    Create
</button>

<mat-nav-list>
    <mat-list-item *ngFor="let documentation of documentations; index as i">
        <p matLine>{{ documentation.title }}</p>
        <button mat-icon-button>
            <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button (click)="delete(documentation.id, i)">
            <mat-icon>delete</mat-icon>
        </button>
    </mat-list-item>
</mat-nav-list>

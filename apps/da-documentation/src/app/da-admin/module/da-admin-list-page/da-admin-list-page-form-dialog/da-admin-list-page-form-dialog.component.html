<fl-dialog-title>
  Edit Folder
</fl-dialog-title>

<mat-dialog-content>
  <form (ngSubmit)="submit()" [formGroup]="formGp">

    <!--  title  -->
    <mat-form-field class="g-form-input">
      <mat-label>{{'title' | translate}}</mat-label>
      <input matInput formControlName="title" required flInputMaxLength="50"
             placeholder="{{'title' | translate}}">
      <mat-error *ngIf="formGp.get('title').hasError('required')">
        {{'title' | flErrorRequired}}
      </mat-error>
    </mat-form-field>


    <table class="g-form-input" cellspacing="0">
      <tr>
        <td>
          <!--  folderId  -->
          <mat-form-field class="g-form-input" appearance="fill">
            <mat-label>Folder</mat-label>
            <mat-select formControlName="folderId" name="folderPath">
              <mat-option>Default</mat-option>
              <mat-option *ngFor="let folder of folders" [value]="folder.id">
                {{folder.title}}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </td>
        <td>
          <!--  path  -->
          <mat-form-field class="g-form-input" appearance="fill">
            <mat-label>{{'path' | translate}}</mat-label>
            <input matInput formControlName="path" required flInputMaxLength="50"
                   placeholder="{{'path' | translate}}">
            <mat-error *ngIf="formGp.get('path').hasError('required')">
              {{'title' | flErrorRequired}}
            </mat-error>
          </mat-form-field>
        </td>
      </tr>
    </table>

    <!--  order  -->
    <mat-form-field class="g-form-input">
      <mat-label>{{'order' | translate}}</mat-label>
      <input matInput formControlName="order" required flInputMaxLength="50"
             placeholder="{{'order' | translate}}">
      <mat-error *ngIf="formGp.get('order').hasError('required')">
        {{'order' | flErrorRequired}}
      </mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-raised-button color="primary" type="submit" form="biox-form"
          class="g-centered-forced">
    {{'save' | translate}}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>

<fl-async-section [object]="brick$">

  <ng-container *flSectionBody="let brick">
    <h1>
      {{ brick.name }}
    </h1>
    <p>
      {{brick.description}}
    </p>
    <mat-tab-group animationDuration="0ms" mat-align-tabs="center" class="full-width">
      <mat-tab label="Documentation" [routerLink]="'documentation'">
        <da-public-sidenav></da-public-sidenav>
      </mat-tab>
      <mat-tab label="Other"></mat-tab>
    </mat-tab-group>
  </ng-container>

</fl-async-section>

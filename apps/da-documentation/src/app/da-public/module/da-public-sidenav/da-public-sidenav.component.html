<mat-sidenav-container class="container" autosize>
  <mat-sidenav #drawer class="sidenav" mode="side" [opened]="true">
    <h1 class="sidenav-title">{{'Documentations' | translate}}</h1>
    <mat-nav-list>
      <mat-list-item class="sidenav-element"
                     *ngFor="let doc of docs;"
                     [routerLink]="doc.path">
        <p matLine>{{doc.title}}</p>
      </mat-list-item>
    </mat-nav-list>

    <div class="sidenav-div-redirect-admin">
      <button mat-raised-button color="primary" *ngIf="isConnected" [routerLink]="'../admin'" class="sidenav-bt-redirect-admin">
        Admin page
      </button>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="sidenav-content">
    <router-outlet></router-outlet>
  </mat-sidenav-content>

</mat-sidenav-container>

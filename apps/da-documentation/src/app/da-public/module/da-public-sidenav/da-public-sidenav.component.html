<mat-sidenav-container class="container" autosize="true">
  <mat-sidenav class="sidenav" mode="side" [opened]="true">
    <div class="g-full-height">

      <h1 class="title">Gencovery</h1>

      <mat-tree [dataSource]="dataSource" [treeControl]="treeControl" class="tree item">
        <!-- This is the tree node template for leaf nodes -->
        <mat-tree-node *matTreeNodeDef="let node">
          <mat-nav-list *ngIf="node.id != null" class="line">
            <a matTreeNodePadding matTreeNodePaddingIndent="15px" class="item" mat-list-item
                           [ngStyle]="{'font-size': node.level > 0 ? '14px' : '16px'}"
                            [routerLink]="node.completePath" routerLinkActive="active">
              <div matLine>
                {{node.name}}
              </div>
            </a>
          </mat-nav-list>
        </mat-tree-node>

        <!-- This is the tree node template for expandable nodes -->
        <mat-tree-node *matTreeNodeDef="let node;when: hasChild">
          <mat-nav-list class="nav-list line">
            <mat-list-item class="item" matTreeNodePadding matTreeNodePaddingIndent="15px"
                           [ngStyle]="{'font-size': node.level > 0 ? '14px' : '16px'}">
              <button mat-icon-button matTreeNodeToggle
                      [attr.aria-label]="'Toggle ' + node.name">
                <mat-icon class="mat-icon-rtl-mirror">
                  {{treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right'}}
                </mat-icon>
              </button>
              <div matLine>
                {{node.name}}
              </div>
            </mat-list-item>
          </mat-nav-list>
        </mat-tree-node>
      </mat-tree>

      <div class="sidenav-div-redirect-admin">
        <a mat-raised-button color="primary" *ngIf="isConnected" [routerLink]="'../admin'"
                class="sidenav-bt-redirect-admin">
          {{'admin_page' | translate}}
        </a>
      </div>
    </div>


  </mat-sidenav>

  <mat-sidenav-content class="sidenav-content">
    <router-outlet></router-outlet>
  </mat-sidenav-content>

</mat-sidenav-container>

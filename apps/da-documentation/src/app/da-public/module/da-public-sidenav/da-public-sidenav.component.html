<mat-sidenav-container class="container" autosize="true">
  <mat-sidenav class="sidenav" mode="side" [opened]="true">
    <div class="g-full-height" fxLayout="column">
      <h1 class="sidenav-title g-text-capitalize-first">{{'documentations' | translate}}</h1>

      <mat-tree [dataSource]="dataSource" [treeControl]="treeControl" class="tree">

        <!-- This is the tree node template for leaf nodes -->
        <mat-tree-node *matTreeNodeDef="let node" class="tree-node element">
          <mat-nav-list class="nav-list element">
            <a mat-list-item matTreeNodePadding matTreeNodePaddingIndent="15px" [routerLink]="node.completePath"
                           class="item" [ngStyle]="{'font-size':node.level > 0 ? '14px': '16px'}" routerLinkActive="active">
              <div matLine>
                {{node.name}}
              </div>
            </a>
          </mat-nav-list>
        </mat-tree-node>

        <!-- This is the tree node template for expandable nodes -->
        <mat-tree-node *matTreeNodeDef="let node;when: hasChild" class="element">
          <mat-nav-list class="nav-list element">
            <mat-list-item matTreeNodePadding matTreeNodePaddingIndent="15px" class="item"
                           [ngStyle]="{'font-size':node.level > 0 ? '14px': '16px'}">
              <button mat-icon-button matTreeNodeToggle
                      [attr.aria-label]="'Toggle ' + node.name">
                <mat-icon class="mat-icon-rtl-mirror">
                  {{treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right'}}
                </mat-icon>
              </button>
              <div matLine>
                {{node.name}}
              </div>
            </mat-list-item>
          </mat-nav-list>
        </mat-tree-node>
      </mat-tree>

      <div class="sidenav-div-redirect-admin">
        <a mat-raised-button color="primary" *ngIf="isConnected" [routerLink]="'../admin'"
                class="sidenav-bt-redirect-admin">
          {{'admin_page' | translate}}
        </a>
      </div>
    </div>


  </mat-sidenav>

  <mat-sidenav-content class="sidenav-content">
    <router-outlet></router-outlet>
  </mat-sidenav-content>

</mat-sidenav-container>

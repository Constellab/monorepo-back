server {
      listen 81;
      server_name gencovery.com;

      # Point to index.html
      root   /usr/share/nginx/html;
      index  index.html index.htm;

      # Security header configuration
      add_header Cache-Control no-cache;
      # add_header X-Frame-Options "DENY";
      add_header X-Content-Type-Options nosniff;
      add_header X-Xss-Protection "1; mode=block" always;

      # CSP FOR LOCAL ENV contains localhost:3001 in src
      # DO NOT COMMIT THIS LINE UNCOMMENTED
      # add_header Content-Security-Policy "default-src 'self' 'unsafe-eval' localhost:3001; script-src-elem 'self' localhost:3001 data:; frame-src 'self' *.gencovery.com *.gencovery.io; worker-src  data: 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: http: https: *.gencovery.com; font-src 'self' data: http: https: fonts.googleapis.com; connect-src 'self' https://fonts.googleapis.com localhost:3000;";

      # CSP FOR PROD ENV
      add_header Content-Security-Policy "default-src 'self' *.gencovery.com *.gencovery.io *.preconstellab.com *constellab.space; script-src-elem 'self' *.gencovery.com *.gencovery.io *.preconstellab.com *constellab.space data:; frame-src 'self' youtube.com www.youtube.com; worker-src *.gencovery.com *.gencovery.io *.preconstellab.com *constellab.space data: 'self' blob:; style-src 'self' 'unsafe-inline' *.gencovery.com *.gencovery.io *.preconstellab.com *constellab.space https://fonts.googleapis.com; img-src 'self' blob: data: http: https: *.gencovery.com *.gencovery.io *.preconstellab.com *constellab.space; font-src 'self' data: http: https: fonts.googleapis.com; connect-src 'self' *.gencovery.com *.gencovery.io *.preconstellab.com *constellab.space https://fonts.googleapis.com https://fonts.gstatic.com";

      add_header Referrer-Policy "no-referrer-when-downgrade";
      add_header Feature-Policy "accelerometer 'none'; autoplay 'none'; camera 'none' encrypted-media 'none'; geolocation 'none'; gyroscope 'none'; magnetometer 'none'; microphone 'none'; midi 'none'; payment 'none'; speaker 'none'; vr 'none'; vibrate 'none'";

      # keep the normal behavior for the css theme and json files (translations)
      # not cachable because of the file names don't change on a new version
      location ~ (dark-theme\.css|light-theme\.css|\.json)$ {
        add_header Cache-Control "no-store";
        # Cache duration : 1 week
        add_header strict-transport-security "max-age=604800";
        try_files $uri $uri/ /index.html;
      }

      # don't cache the index.html
      location ~ \.(html)$ {
        add_header Cache-Control "no-store";
        # Cache duration : 1 week
        add_header strict-transport-security "max-age=604800";
        add_header X-Frame-Options "SAMEORIGIN";
        try_files $uri $uri/ /index.html;
      }

      # cache all the css, js and ttf files for a weak
      location ~ \.(css|js|ttf)$ {
        # Cache duration : 1 week
        expires 604800;
        add_header Cache-Control "max-age=604800, public";
        try_files $uri $uri/ /index.html;
      }


      location / {
          try_files $uri $uri/ /index.html;
      }
}

<div class="g-page-fixed g-page-bottom-padding" fxLayout="column">
  <fl-async-section fxFlex [observable]="resource$">

    <fl-section-header>
      <h2>{{'resource' | translate}} : {{resourceId}}</h2>
      <fl-section-actions *ngIf="availableViews">
        <a *ngFor="let view of availableViews"
           mat-icon-button type="button"
           [routerLink]="'./'" [queryParams]="getQueryParam(view)"
           [replaceUrl]="true"
           [color]="view.route === currentView ? 'primary': null"
           [matTooltip]="view.tooltip | translate" matTooltipPosition="below">
          <mat-icon *ngIf="view.icon; else text">calendar_view_month</mat-icon>
          <ng-template #text>{{view.text}}</ng-template>
        </a>
      </fl-section-actions>
    </fl-section-header>

    <ng-container *flSectionBody="let resource">

      <ng-container [ngSwitch]="currentView">
        <gen-biox-resource-json *ngSwitchCase="'json'"
                                [resource]="resource"></gen-biox-resource-json>

        <gen-biox-resource-spreadsheet *ngSwitchCase="'spreadsheet'"
                                       [resource]="resource"></gen-biox-resource-spreadsheet>

      </ng-container>
    </ng-container>

  </fl-async-section>

</div>

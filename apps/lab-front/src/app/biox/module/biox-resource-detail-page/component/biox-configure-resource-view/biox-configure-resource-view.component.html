<fl-dialog-title>
  {{title}}
</fl-dialog-title>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="config-form" [formGroup]="formGp">
    <fl-dynamic-form [formGp]="formGp" [configs]="configs"></fl-dynamic-form>
  </form>
</mat-dialog-content>


<div mat-dialog-actions>
  <button mat-raised-button color="primary" type="submit" form="config-form"
          class="g-centered-forced">
    {{'biox.show_view' | translate}}
  </button>
</div>

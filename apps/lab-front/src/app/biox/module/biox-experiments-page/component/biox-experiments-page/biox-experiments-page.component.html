<div class="g-page">
  <fl-async-section [arrayObs]="bioxExperiments" emptyText="no_lab_experiment">

    <fl-section-header class="g-page-title">
      <fl-text-icon>
        <mat-icon class="g-icon-big" svgIcon="vials"></mat-icon>
        <h2>{{'lab_experiments' | translate}}</h2>
      </fl-text-icon>

      <fl-section-actions>
        <button mat-raised-button type="button" color="accent"
                class="g-button-small" [matTooltip]="'biox.new_experiment' | translate"
                (click)="createExperiment()">
          <mat-icon>add</mat-icon>
        </button>
      </fl-section-actions>
    </fl-section-header>

    <ng-container *flSectionBody>
      <fl-card>
        <fl-card-body>
          <gen-biox-experiment-table [datasource]="bioxExperiments" [columns]="displayedColumns">
          </gen-biox-experiment-table>
        </fl-card-body>
      </fl-card>
    </ng-container>


  </fl-async-section>

</div>

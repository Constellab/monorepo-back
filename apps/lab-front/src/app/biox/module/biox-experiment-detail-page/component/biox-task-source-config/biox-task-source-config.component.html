<div *ngIf="selectedResource$ | async as selectedResource ; else noSelectedResource ">


  <!-- A resource is selected -->
  <gen-biox-resource-card *ngIf="selectedResource.status === 'success'; else error"
                          [resource]="$any(selectedResource.object)"></gen-biox-resource-card>

  <ng-template #error>
    <fl-error-text [errorMessage]="'loaded_resource_error' | translate"></fl-error-text>
  </ng-template>
</div>
<!-- no selected resource -->
<ng-template #noSelectedResource>
  <fl-error-text [errorMessage]="'no_selected_resource' | translate"></fl-error-text>
</ng-template>


<div class="select-button">
  <button mat-stroked-button type="button"
          (click)="openResourceSelection()" class="g-centered-forced">
    {{'select_resource' | translate }}
  </button>
</div>

<div fxLayout="row wrap" fxLayoutGap="1em">

  <!-- Add object button  -->
  <button mat-icon-button type="button"
          [matTooltip]="'biox.add_object' | translate" matTooltipPosition="below"
          [matMenuTriggerFor]="addObject">
    <mat-icon>add</mat-icon>
  </button>


  <button mat-icon-button type="button" *ngIf="!saveIsLoading; else saveLoading"
          [matTooltip]="'biox.experiment_save' | translate" matTooltipPosition="below"
          (click)="save()">
    <mat-icon>save</mat-icon>
  </button>

  <ng-template #saveLoading>
    <fl-loader [size]="40"></fl-loader>
  </ng-template>

  <button mat-icon-button type="button"
          [matTooltip]="'biox.run_experiment' | translate" matTooltipPosition="below">
    <mat-icon>play_arrow</mat-icon>
  </button>
</div>


<!-- Add object menu -->
<mat-menu #addObject="matMenu">
  <button mat-menu-item (click)="addInterface()" type="button">
    <mat-icon>login</mat-icon>
    {{'biox.interface' | translate}}
  </button>
  <button mat-menu-item (click)="addOuterface()" type="button">
    <mat-icon>logout</mat-icon>
    {{'biox.outerface' | translate}}</button>
</mat-menu>

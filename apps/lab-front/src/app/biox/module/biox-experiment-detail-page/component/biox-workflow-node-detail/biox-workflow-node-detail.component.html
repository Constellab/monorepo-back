<div>

  <div class="g-text-light">
    <p>{{'biox.node_type' | translate}} : {{node.object.type}}</p>
    <p *ngIf="node.object.data.description">{{node.object.data.description}}</p>
  </div>

  <div class="g-section">
    <!-- Inputs -->
    <mat-expansion-panel *ngIf="node.hasInputs()" hideToggle [expanded]="true">
      <mat-expansion-panel-header>
        <mat-panel-title class="g-text-not-selectable">
          <fl-text-icon>
            <mat-icon>login</mat-icon>
            {{'biox.node_inputs' | translate}}
          </fl-text-icon>
        </mat-panel-title>
      </mat-expansion-panel-header>
      <gen-biox-workflow-ports-list [ports]="node.inputPorts"></gen-biox-workflow-ports-list>
    </mat-expansion-panel>

    <mat-divider></mat-divider>

    <!-- Outputs -->
    <mat-expansion-panel *ngIf="node.hasOutputs()" hideToggle [expanded]="true">
      <mat-expansion-panel-header>
        <mat-panel-title class="g-text-not-selectable">
          <fl-text-icon>
            <mat-icon>logout</mat-icon>
            {{'biox.node_outputs' | translate}}
          </fl-text-icon>
        </mat-panel-title>
      </mat-expansion-panel-header>
      <gen-biox-workflow-ports-list [ports]="node.outputPorts"></gen-biox-workflow-ports-list>
    </mat-expansion-panel>

    <mat-divider></mat-divider>

    <!-- Config -->
    <mat-expansion-panel *ngIf="config" hideToggle [expanded]="true" #configPanel>
      <mat-expansion-panel-header>
        <mat-panel-title fxLayout="column" fxLayoutAlign="center" class="g-text-not-selectable">
          <fl-text-icon>
            <mat-icon>settings</mat-icon>
            {{'biox.configuration' | translate}}
          </fl-text-icon>
        </mat-panel-title>
        <mat-panel-description fxLayout="row" fxLayoutAlign="end" *ngIf="isEditable">
          <button mat-icon-button type="button" class="edit-button"
                  (click)="openConfig($event, configPanel)">
            <mat-icon>edit</mat-icon>
          </button>
        </mat-panel-description>
      </mat-expansion-panel-header>
      <gen-biox-workflow-node-config [config]="config"></gen-biox-workflow-node-config>
    </mat-expansion-panel>

    <mat-divider></mat-divider>

    <!--  Progress -->
    <mat-expansion-panel *ngIf="showProgress" hideToggle [expanded]="true">
      <mat-expansion-panel-header>
        <mat-panel-title fxLayout="column" fxLayoutAlign="center" class="g-text-not-selectable">
          <fl-text-icon>
            <fl-status-chip [status]="node.object.progressBar"></fl-status-chip>
          </fl-text-icon>
        </mat-panel-title>

        <!--    Show the progress if it's running    -->
        <mat-panel-description>
          <div *ngIf="node.object.progressBar.getStatusName() === 'running'">
           {{node.object.progressBar.getProgress()}} %
          </div>
        </mat-panel-description>
      </mat-expansion-panel-header>

      <gen-biox-workflow-node-progress [progressBar]="node.object.progressBar"></gen-biox-workflow-node-progress>
    </mat-expansion-panel>

    <mat-divider></mat-divider>
  </div>
</div>

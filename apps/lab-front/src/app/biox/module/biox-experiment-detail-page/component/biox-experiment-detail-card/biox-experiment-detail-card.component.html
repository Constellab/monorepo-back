<fl-card *ngIf="experiment$ | async as experiment">

  <fl-card-header>
    <h1>{{experiment.data.title}}</h1>

    <fl-card-actions>

      <button mat-icon-button type="button" (click)="toggleDetail()">
        <mat-icon>{{expandIcon}}</mat-icon>
      </button>

      <ng-container *ngIf="experiment.isEditable()">
        <button *ngIf="experiment.isRunning()" mat-icon-button type="button" (click)="stopExperiment()"
                [matTooltip]="'biox.stop_experiment' | translate">
          <mat-icon>stop</mat-icon>
        </button>

        <button mat-icon-button type="button" (click)="openUpdateDialog()"
                [matTooltip]="'biox.update_experiment' | translate">
          <mat-icon>edit</mat-icon>
        </button>

        <button mat-icon-button type="button" (click)="openValidationDialog()"
                [matTooltip]="'biox.validate_experiment' | translate">
          <mat-icon>verified</mat-icon>
        </button>

        <button mat-icon-button type="button" (click)="openTagsFormDialog()"
                [matTooltip]="'tags' | translate">
          <mat-icon>local_offer</mat-icon>
        </button>
      </ng-container>

      <button mat-icon-button type="button" (click)="openDuplicateConfirmation()"
              [matTooltip]="'biox.clone_experiment' | translate">
        <mat-icon>content_copy</mat-icon>
      </button>

      <mat-icon *ngIf="experiment.isValidated"
                [matTooltip]="'biox.experiment_validated' | translate">
        verified
      </mat-icon>

      <fl-status-chip [status]="experiment" mode="iconText"
                      class="status" (click)="openProgressInformation()"
                      [ngClass]="{'g-clickable': experiment.status !== 'DRAFT'}"></fl-status-chip>
    </fl-card-actions>
  </fl-card-header>
  <fl-card-body *ngIf="showDetail">
    <fl-tag-list class="tag-list" [tags]="experiment.tags"></fl-tag-list>

    <fl-limit-height [maxHeight]="100">
      <div [innerHTML]="experiment.data.description"></div>
    </fl-limit-height>
  </fl-card-body>

  <fl-card-footer *ngIf="showDetail">
    <p class="g-text-small g-text-light">
      {{'last_modified_the'| translate}} {{experiment.savedAt | flDate}}
    </p>
  </fl-card-footer>
</fl-card>

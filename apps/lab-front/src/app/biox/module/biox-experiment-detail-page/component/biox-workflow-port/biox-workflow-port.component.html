<div fxLayout="row" fxLayoutAlign="start center">
  <div class="color-container">
    <div [style.backgroundColor]="port.getColor()" class="color-round"></div>
  </div>

  <div fxFlex="30%">
    {{port.name}}
  </div>

  <div fxFlex="auto" class="g-text-light">
    <div *ngFor="let type of port.type">
      {{type}}
    </div>
  </div>
</div>

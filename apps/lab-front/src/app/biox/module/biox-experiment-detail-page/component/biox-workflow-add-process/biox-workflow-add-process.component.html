<div fxLayout="row" class="g-full-height">

  <!-- Left section with task or protocol selection -->
  <div class="left-section">
    <mat-tab-group class="g-mat-tab-flex">
      <mat-tab [label]="'tasks' | translate">
        <fl-async-section [object]="tasks$">

          <ng-container *flSectionBody="let taskTypes">
            <gen-biox-process-types-tree [processTypesTree]="taskTypes"
                                         (processTypeClick)="selectTask($event)"
                                         (processTypeDblClick)="selectAndAddTask($event)"></gen-biox-process-types-tree>
          </ng-container>
        </fl-async-section>

      </mat-tab>

      <mat-tab [label]="'protocols' | translate">
        <fl-async-section [object]="protocols$">
          <ng-container *flSectionBody="let protocols">
            <gen-biox-process-types-tree [processTypesTree]="protocols"
                                         (processTypeClick)="selectProtocol($event)"
                                         (processTypeDblClick)="selectAndAddProtocol($event)"></gen-biox-process-types-tree>
          </ng-container>
        </fl-async-section>
      </mat-tab>
    </mat-tab-group>
  </div>

  <!-- Right section with process detail information -->
  <div class="right-section">
    <fl-async-section [object]="processType$">

      <ng-container *flSectionBody="let processType">
        <gen-biox-process-type-card [processType]="processType"
                                    class="card">
          <button mat-icon-button color="primary" type="button"
                  (click)="addProcess(processType)"
                  [matTooltip]="'biox.add_selected_process' | translate">
            <mat-icon>add</mat-icon>
          </button>
        </gen-biox-process-type-card>
      </ng-container>
    </fl-async-section>
  </div>
</div>

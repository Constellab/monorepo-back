<div fxLayout="row" class="g-full-height">

  <!-- Left section with task or protocol selection -->
  <div class="left-section">
    <mat-tab-group class="g-mat-tab-flex">
      <mat-tab [label]="'tasks' | translate">
        <fl-async-section [object]="tasks$">

          <ng-container *flSectionBody="let taskTypes">
            <gen-biox-processable-types-tree [processableTypesTree]="taskTypes"
                                             (processableTypeClick)="selectTask($event)"
                                             (processableTypeDblClick)="selectAndAddTask($event)"></gen-biox-processable-types-tree>
          </ng-container>
        </fl-async-section>

      </mat-tab>

      <mat-tab [label]="'protocols' | translate">
        <fl-async-section [object]="protocols$">
          <ng-container *flSectionBody="let protocols">
            <gen-biox-processable-types-tree [processableTypesTree]="protocols"
                                             (processableTypeClick)="selectProtocol($event)"
                                             (processableTypeDblClick)="selectAndAddProtocol($event)"></gen-biox-processable-types-tree>
          </ng-container>
        </fl-async-section>
      </mat-tab>
    </mat-tab-group>
  </div>

  <!-- Right section with process detail information -->
  <div class="right-section">
    <fl-async-section [object]="processableType$">

      <ng-container *flSectionBody="let processableType">
        <gen-biox-processable-type-card [processableType]="processableType"
                                        class="card">
          <button mat-icon-button color="primary" type="button"
                  (click)="addProcessable(processableType)"
                  [matTooltip]="'biox.add_selected_process' | translate">
            <mat-icon>add</mat-icon>
          </button>
        </gen-biox-processable-type-card>
      </ng-container>
    </fl-async-section>
  </div>
</div>

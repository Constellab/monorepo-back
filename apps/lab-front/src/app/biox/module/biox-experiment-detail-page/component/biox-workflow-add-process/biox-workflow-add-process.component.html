<div fxLayout="row" class="g-full-height">

  <!-- Left section with process or protocol selection -->
  <div class="left-section">
    <mat-tab-group class="g-mat-tab-flex">
      <mat-tab [label]="'processes' | translate">
        <fl-async-section [object]="processes$">

          <ng-container *flSectionBody="let processes">
            <gen-biox-processable-types-tree [processableTypesTree]="processes"
                                             (processableTypeClick)="selectProcessable($event)"
                                             (processableTypeDblClick)="selectAndAddProcessable($event)"></gen-biox-processable-types-tree>
          </ng-container>
        </fl-async-section>

      </mat-tab>

      <mat-tab [label]="'protocols' | translate">
        <fl-async-section [object]="protocols$">
          <ng-container *flSectionBody="let protocols">
            <gen-biox-processable-types-tree [processableTypesTree]="protocols"
                                             (processableTypeClick)="selectProcessable($event)"
                                             (processableTypeDblClick)="selectAndAddProcessable($event)"></gen-biox-processable-types-tree>
          </ng-container>
        </fl-async-section>
      </mat-tab>
    </mat-tab-group>
  </div>

  <!-- Right section with process detail information -->
  <div class="right-section">
    <gen-biox-processable-type-card *ngIf="selectedProcess" [processableType]="selectedProcess"
                                    class="card">
      <button mat-icon-button color="primary" type="button"
              (click)="addProcessable(selectedProcess)"
              [matTooltip]="'biox.add_selected_process' | translate">
        <mat-icon>add</mat-icon>
      </button>
    </gen-biox-processable-type-card>
  </div>
</div>

<!--    Processes    -->
<!--  <mat-tab [label]="'processes' | translate">-->

<div fxLayout="row" class="g-full-height">

  <!-- Left section with process selection -->
  <fl-async-section [object]="processes$" class="left-section">

    <ng-container *flSectionBody="let processes">
      <gen-biox-process-types-tree [processTypesTree]="processes"
                                   (processTypesClick)="selectProcess($event)"
                                   (processTypesDblClick)="selectAndAddProcess($event)"
      ></gen-biox-process-types-tree>
    </ng-container>
  </fl-async-section>

  <!-- Right section with process detail information -->
  <div class="right-section">
    <gen-biox-process-type-card *ngIf="selectedProcess" [processType]="selectedProcess"
                                class="card">
      <button mat-icon-button color="primary" type="button"
              (click)="addProcessable(selectedProcess)"
              [matTooltip]="'biox.add_selected_process' | translate">
        <mat-icon>add</mat-icon>
      </button>
    </gen-biox-process-type-card>
  </div>
</div>

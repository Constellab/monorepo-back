<p>{{'biox.execution_time' | translate}} :
  {{progressBar.data.elapsedTime | number:'1.0-3'}}s
</p>

<mat-list dense>
  <mat-list-item *ngFor="let message of progressBar.data.messages">
    <div fxLayout="row" fxLayoutAlign="space-between" class="g-full">
      <div>{{message.text}}</div>
      <div class="g-text-light date"
           [matTooltip]="message.datetime | flDate:'D, HH:mm:ss'">
        {{message.datetime | flDate : 'HH:mm:ss'}}
      </div>
    </div>
  </mat-list-item>
</mat-list>

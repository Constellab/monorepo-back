<fl-dialog-header>
  {{'biox.validate_experiment' | translate}}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="validation-form">

    <!--    Study      -->
    <mat-form-field class="g-form-input">
      <mat-label>{{'biox.study' | translate}}</mat-label>
      <mat-select [formControl]="formControl">
        <gen-biox-study-select-options></gen-biox-study-select-options>
      </mat-select>
      <mat-error *ngIf="formControl.hasError('required')">
        {{'required' | flErrorRequired}}
      </mat-error>
    </mat-form-field>

  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-raised-button color="primary" type="submit" form="validation-form"
          class="g-centered-forced">
    {{'biox.validate_experiment' | translate}}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>

<div>

  <div fxLayout="row wrap" fxLayoutAlign="space-between center">

    <!-- Title   -->
    <div>
      {{name}} {{node.object.process.type}}
    </div>

    <!--  actions -->
    <div fxLayout="row" fxLayoutGap="0.5em">
      <!--   Only for protocol, possibility to zoom in   -->
      <button *ngIf="nodeIsProtocol()" (click)="zoomInProtocol()"
              mat-icon-button type="button">
        <mat-icon>loupe</mat-icon>
      </button>

      <button mat-icon-button type="button"
              *ngIf="showConfigButton"
              (click)="openConfig()">
        <mat-icon>settings</mat-icon>
      </button>
    </div>
  </div>

  <!-- Body -->
  <div>
  </div>
</div>

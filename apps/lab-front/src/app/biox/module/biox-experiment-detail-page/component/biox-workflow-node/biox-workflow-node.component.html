<div #container class="container">

  <div fxLayout="column" fxLayoutAlign="space-between center">

    <!-- Title   -->
    <div class="name">
      {{node.title}}
    </div>


    <!--  actions -->
    <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="0.5em">
      <!--   Only for protocol, possibility to zoom in   -->
      <button *ngIf="nodeIsProtocol()" (click)="zoomInProtocol()"
              mat-icon-button type="button" [disabled]="layerIsLoading$ | async">
        <mat-icon>loupe</mat-icon>
      </button>

      <button mat-icon-button type="button"
              (click)="openNodeDetail()" [matTooltip]="'biox.open_node_detail' | translate">
        <mat-icon>info</mat-icon>
      </button>

      <fl-status-chip mode="iconOnly" [status]="this.node.object.status"></fl-status-chip>
    </div>
  </div>

  <!-- Body -->
  <div>
  </div>
</div>

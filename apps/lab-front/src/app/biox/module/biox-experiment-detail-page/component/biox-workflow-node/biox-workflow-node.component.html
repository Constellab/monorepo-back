<div #container (dblclick)="openNodeDetail()">

  <div fxLayout="row" fxLayoutAlign="space-between center">

    <!-- Title   -->
    <div class="name">
      {{name}}
    </div>

    <!--  actions -->
    <div fxLayout="row" fxLayoutGap="0.5em">
      <!--   Only for protocol, possibility to zoom in   -->
      <button *ngIf="nodeIsProtocol()" (click)="zoomInProtocol()"
              mat-icon-button type="button" [disabled]="layerIsLoading$ | async">
        <mat-icon>loupe</mat-icon>
      </button>

      <button mat-icon-button type="button"
              *ngIf="showConfigButton"
              (click)="openConfig($event)">
        <mat-icon>settings</mat-icon>
      </button>
    </div>
  </div>

  <!-- Body -->
  <div>
  </div>
</div>

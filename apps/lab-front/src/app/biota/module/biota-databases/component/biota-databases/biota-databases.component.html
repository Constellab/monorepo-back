<div class="g-page-fixed" fxLayout="column">

  <gen-biota-database-search-form (search)="onSearch($event)"></gen-biota-database-search-form>

  <fl-async-section fxFlex="auto" [arrayObs]="biotaDatasource" emptyText="biota.no_entry" class="g-grow-max">

    <ng-container *flSectionBody>

      <div fxLayout="row" fxLayoutGap="1em" class="container">
        <gen-biota-database-table class="table" fxFlex="auto" [datasource]="biotaDatasource" [columns]="columns"
                                  (showDetail)="openDetail($event)"></gen-biota-database-table>

        <div fxFlex="30%" fxHide.xs class="max-height g-scrollable-element">
          <gen-biota-data-card class="g-full" *ngIf="selectedData" [biotaData]="selectedData"></gen-biota-data-card>
        </div>
      </div>
    </ng-container>
  </fl-async-section>

</div>

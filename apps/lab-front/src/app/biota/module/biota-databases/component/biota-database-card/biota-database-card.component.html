<fl-card class="g-full-height">
  <fl-card-header>{{database.name | translate}}</fl-card-header>

  <fl-card-body>
    <ng-container *ngIf="databasesEntries; else noEntry">
      {{databasesEntries}} {{'biota.entries' | translate}}
    </ng-container>
    <ng-template #noEntry>
      {{'biota.no_entry' | translate}}
    </ng-template>
  </fl-card-body>

</fl-card>

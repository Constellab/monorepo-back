<fl-infinite-scroll [datasource]="datasource" infiniteMode="body">
  <mat-table fxFlex="100" mat-table [dataSource]="datasource" class="table">

    <!-- Id -->
    <ng-container matColumnDef="id">
      <mat-header-cell *matHeaderCellDef>
        <span>{{'id' | translate}}</span>
      </mat-header-cell>
      <mat-cell *matCellDef="let biotaData">
        {{biotaData.id}}
      </mat-cell>
    </ng-container>

    <!-- Name -->
    <ng-container matColumnDef="name">
      <mat-header-cell *matHeaderCellDef>
        <span>{{'name' | translate}}</span>
      </mat-header-cell>
      <mat-cell *matCellDef="let biotaData">
          {{biotaData.name}}
      </mat-cell>
    </ng-container>


    <!-- Type -->
    <ng-container matColumnDef="type">
      <mat-header-cell *matHeaderCellDef>
        <span>{{'type' | translate}}</span>
      </mat-header-cell>
      <mat-cell *matCellDef="let biotaData">
        {{biotaData.type}}
      </mat-cell>
    </ng-container>


    <mat-header-row *matHeaderRowDef="_columns; sticky: true"></mat-header-row>
    <mat-row *matRowDef="let row; columns: _columns;"></mat-row>
  </mat-table>
</fl-infinite-scroll>

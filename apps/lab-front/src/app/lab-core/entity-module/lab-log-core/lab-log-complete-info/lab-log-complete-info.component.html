<div>
  <fl-key-value>
    <fl-key>{{'name' | translate}}</fl-key>
    {{log.logInfo.name}}
  </fl-key-value>

  <fl-key-value>
    <fl-key>{{'monitoring.log_size' | translate}}</fl-key>
    {{log.logInfo.fileSize | flByteText}}

  <div class="configuration-container">
    <h2>{{'monitoring.log_content' | translate}}</h2>
    <div class="configuration">{{log.content}}</div>
  </div>
</div>

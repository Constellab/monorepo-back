<fl-dialog-header>
  {{logName}}
</fl-dialog-header>

<mat-dialog-content>
  <fl-async-section [object]="labLogCompleteInfo$">

    <ng-container *flSectionBody="let log">
      <lab-log-complete-info [log]="log"></lab-log-complete-info>
    </ng-container>
  </fl-async-section>
</mat-dialog-content>

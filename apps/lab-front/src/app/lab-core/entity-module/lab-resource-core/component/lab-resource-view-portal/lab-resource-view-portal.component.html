<fl-portal class="portal" flResize="both">
  <fl-portal-header [enableDrag]="true">
    <div class="title">{{view.title}}</div>

    <fl-portal-header-buttons>
      <rv-technical-info-button [technicalInfo]="view.technical_info"></rv-technical-info-button>
      <fl-resize-portal-fullscreen-button></fl-resize-portal-fullscreen-button>
    </fl-portal-header-buttons>
  </fl-portal-header>

  <fl-portal-content>
    <rv-resource-view [view]="view" [config]="config" [resourceId]="resourceId" [displayMode]="'portal'"
                            [style.width]="width" [style.height]="height"></rv-resource-view>
  </fl-portal-content>
</fl-portal>

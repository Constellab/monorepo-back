<fl-card class="g-full-height">
  <fl-card-header>
    <fl-text-icon>
      <mat-icon>history</mat-icon>
      <h2>{{'biox.resource_view_historic' | translate}}</h2>
    </fl-text-icon>
  </fl-card-header>

  <fl-card-body class="card-body">

    <fl-infinite-table-container [datasource]="datasource" class="table">
      <lab-view-config-table [datasource]="datasource" [columns]="columns"
                             [selectableRow]="true"
                             (viewConfigSelected)="onViewConfigSelect($event)"></lab-view-config-table>
    </fl-infinite-table-container>
  </fl-card-body>
</fl-card>

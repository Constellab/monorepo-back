<fl-async-section [object]="resource$" fxLayout="column" class="g-full-height main-section">

  <ng-container *flSectionBody="let resource">

    <!--  Use an embed section to show header once the resource is loaded  -->
    <fl-section fxFlex="auto" [object]="resource" class="section">

      <fl-section-header class="header">
        <h2 class="header-title">{{resource.name}} |
          <span class="g-text-light">{{fullScreenViewConfig?.viewName}}</span>
        </h2>
        <fl-text-icon class="g-text-tiny g-text-light" *ngIf="resource.experiment"
                      gap="0">
          <mat-icon flIcon="experiment" class="g-icon-tiny"></mat-icon>
          {{resource.experiment.title}}
        </fl-text-icon>

        <fl-section-actions>
            <button mat-stroked-button type="button"
                    (click)="openViewSpecs($event)" class="button g-button-small">
              <mat-icon>visibility</mat-icon>
              {{'biox.view_specs' | translate}}
            </button>

            <button mat-stroked-button type="button" *ngIf="!readOnly"
                    (click)="openTransformerResource()" class="button g-button-small">
              <mat-icon>move_down</mat-icon>
              {{'biox.transformers' | translate}}
            </button>

            <!--   Link to resource detail page only for readOnly       -->
            <a mat-stroked-button type="button" *ngIf="readOnly"
               [routerLink]="resource | labDetailRoute"
               class="button g-button-small">
              <mat-icon flIcon="preview"></mat-icon>
              {{'biox.open_resource_page' | translate}}
            </a>

            <a mat-stroked-button type="button" *ngIf="resource.experiment && !readOnly"
               [routerLink]="resource.experiment.id | labDetailRoute:'experiment'"
               class="button g-button-small">
              <mat-icon flIcon="experiment"></mat-icon>
              {{'biox.experiment' | translate}}
            </a>

          <lab-resource-actions-menu [readOnly]="readOnly" [resource]="resource" (update)="onUpdate($event)"
                                     (updateTags)="onUpdateTags($event)"
                                     (delete)="onDelete()">
          </lab-resource-actions-menu>
        </fl-section-actions>
      </fl-section-header>


      <ng-container *flSectionBody>

        <!--  Header    -->
        <div class="page-padding body">
          <lab-resource-view *ngIf="fullScreenView" [view]="fullScreenView"
                             [config]="fullScreenViewConfig" [resourceId]="resource.id"></lab-resource-view>
          <div *ngIf="showLoader" class="g-text-centered">
            <fl-loader size="medium"></fl-loader>
          </div>
        </div>
      </ng-container>

    </fl-section>

  </ng-container>

</fl-async-section>

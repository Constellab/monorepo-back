<fl-dialog-header>
  {{'biox.import_from_another_lab' | translate}}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="import-ext-resource">

    <p class="help-text">{{'biox.import_from_another_lab_help' | translate}}</p>

    <!--    Url      -->
    <mat-form-field class="g-form-input">
      <mat-label>{{'biox.share_url' | translate}}</mat-label>
      <input matInput [formControl]="formCtrl" [placeholder]="'biox.share_url' | translate">
      <mat-error *ngIf="formCtrl.hasError('required')">
        {{'biox.share_url' | flErrorRequired }}
      </mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button color="primary" type="submit" form="import-ext-resource"
          class="g-centered-forced">
    {{'save' | translate}}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>

<fl-text-icon>
  <mat-icon flIcon="view"></mat-icon>
  <h2>{{'biox.available_views' | translate}}</h2>
</fl-text-icon>

<div fxLayout="row wrap">
  <fl-card *ngFor="let viewSpec of viewSpecs$ | async" class="view-spec"
           (click)="openConfigPortal(viewSpec)"
           [ngClass]="{'default-view-spec' : viewSpec.defaultView}">
    <fl-card-body>

      <div fxLayout="row" fxLayoutAlign="center">
        <lab-view-type-image [viewType]="viewSpec.viewType" size="4em">
        </lab-view-type-image>
      </div>

      <div class="view-info">
        <div>{{viewSpec.getName()}}</div>
        <p class="text g-text-small g-text-tiny">{{viewSpec.shortDescription}}</p>
      </div>
    </fl-card-body>
  </fl-card>
</div>

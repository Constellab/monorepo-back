<fl-infinite-scroll [datasource]="datasource">

  <mat-option *ngFor="let resource of resources$ | async" [value]="getValue(resource)">
    <div class="option">
      <div>{{resource.name}}</div>
      <div class="g-text-tiny g-text-light">{{'created' | translate}} {{resource.createdAt | flFromNow}}</div>
    </div>
  </mat-option>

</fl-infinite-scroll>

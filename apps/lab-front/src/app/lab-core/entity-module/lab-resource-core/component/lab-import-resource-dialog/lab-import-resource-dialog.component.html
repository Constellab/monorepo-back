<fl-dialog-header>
  {{'biox.import_resource' | translate}}
</fl-dialog-header>

<mat-dialog-content class="content">
  <!--   Small explanation text     -->
  <div class="g-text-light help-text">
    {{'biox.import_resource_text' | translate }}
  </div>

  <div class="g-text-centered">
    <button mat-stroked-button type="button" (click)="openImportSelectDialog()">
      {{'biox.select_importer' | translate}}
    </button>
  </div>

  <div *ngIf="processTypeIsLoading" class="g-text-centered">
    <fl-loader size="medium"></fl-loader>
  </div>


  <form *ngIf="selectedImporterType" (ngSubmit)="submit()" [formGroup]="formGp">

    <mat-divider class="divider"></mat-divider>
    <!--   Info about importer with button to see detail     -->
    <div fxLayout="row" fxLayoutAlign="space-between center">
      <h2>{{selectedImporterType.humanName}}</h2>

      <lab-process-type-show-detail-button [processTypingName]="selectedImporterType.typingName">
      </lab-process-type-show-detail-button>
    </div>
    <div class="g-text-light short-description">
      {{selectedImporterType.shortDescription || selectedImporterType.humanName}}
    </div>

    <div>
      <lab-configure-specs-form [configData]="configData"></lab-configure-specs-form>
    </div>

    <!--   If the import doesn't need config   -->
    <div *ngIf="showNoConfigMessage" class="g-text-light">
      {{'biox.resource_import_no_config' | translate}}
    </div>

    <button mat-flat-button color="primary" type="submit"
            class="g-centered-forced submit-button">
      {{'biox.import_resource' | translate}}
      <fl-button-loader *ngIf="callIsLoading"></fl-button-loader>
    </button>
  </form>

</mat-dialog-content>

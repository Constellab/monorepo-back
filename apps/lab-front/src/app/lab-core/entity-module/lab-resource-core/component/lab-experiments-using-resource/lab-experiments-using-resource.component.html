<fl-card class="g-full-height">
  <fl-card-header>
    <fl-text-icon>
      <mat-icon flIcon="experiment"></mat-icon>
      <h2>{{'biox.experiments_that_use_the_resource' | translate}}</h2>
    </fl-text-icon>
  </fl-card-header>

  <fl-card-body class="card-body">

    <fl-infinite-table-container [datasource]="datasource">
      <lab-experiment-table [datasource]="datasource" [columns]="columns"></lab-experiment-table>
    </fl-infinite-table-container>
  </fl-card-body>
</fl-card>

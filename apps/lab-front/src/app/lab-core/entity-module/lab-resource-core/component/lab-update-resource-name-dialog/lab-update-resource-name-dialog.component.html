<fl-dialog-header>
  {{'biox.update_resource_name' | translate}}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="resource-name-form">

    <mat-form-field class="g-form-input">
      <mat-label>{{'name' | translate}}</mat-label>
      <input matInput [formControl]="formCtrl" required flInputMaxLength="50"
             placeholder="{{'name' | translate}}">
      <mat-error *ngIf="formCtrl.hasError('required')">
        {{'name' | flErrorRequired}}
      </mat-error>
    </mat-form-field>

  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button color="primary" type="submit" form="resource-name-form"
          class="g-centered-forced">
    {{'save' | translate}}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>

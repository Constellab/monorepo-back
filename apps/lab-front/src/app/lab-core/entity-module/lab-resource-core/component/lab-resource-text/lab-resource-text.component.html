<div class="g-text-centered button" *ngIf="!reachedFirstPage">
  <button mat-flat-button color="primary" type="button"
          (click)="loadPreviousPage()" [disabled]="isLoading">
    {{'biox.resource_previous_text_load' | translate}}
  </button>
</div>


<div (flInfiniteScroll)="loadNextPage()" [flInfiniteMode]="infiniteScrollMode" [flInfiniteDisabled]="reachedLastPage || isLoading"
     class="container">
  {{text}}
</div>

<div class="g-text-centered button" *ngIf="!reachedLastPage">
  <button mat-flat-button color="primary" type="button"
          (click)="loadNextPage()" [disabled]="isLoading">
    {{'biox.resource_next_text_load' | translate}}
  </button>
</div>

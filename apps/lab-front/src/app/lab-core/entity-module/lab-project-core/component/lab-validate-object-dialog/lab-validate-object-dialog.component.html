<fl-dialog-header>
  {{title | translate}}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="validation-form">

    <p *ngIf="helpText" class="g-text-light help-text">{{helpText| translate}}</p>

    <!--    Project      -->
    <mat-form-field class="g-form-input">
      <mat-label>{{'biox.project' | translate}}</mat-label>
      <mat-select [formControl]="formControl">
        <lab-project-select-options></lab-project-select-options>
      </mat-select>
      <mat-error *ngIf="formControl.hasError('required')">
        {{'required' | flErrorRequired}}
      </mat-error>
    </mat-form-field>

  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-raised-button color="primary" type="submit" form="validation-form"
          class="g-centered-forced">
    {{title | translate}}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>

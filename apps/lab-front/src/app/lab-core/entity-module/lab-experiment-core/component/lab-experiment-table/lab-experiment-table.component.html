<mat-table fxFlex="100" mat-table [dataSource]="datasource" class="table">


  <!-- Title -->
  <ng-container matColumnDef="title">
    <mat-header-cell *matHeaderCellDef class="g-cell-header-with-left-border">
      <span> {{'title' | translate}}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let experiment" class="g-cell-with-left-border"
              [style.borderLeftColor]="experiment.project?.id | flStringToRgb">
      <div>
        <div>{{experiment.title}}</div>
        <fl-text-icon class="g-text-tiny g-text-light" *ngIf="experiment.project"
                      gap="0">
          <mat-icon flIcon="project" class="g-icon-tiny"></mat-icon>
          {{experiment.project.title}}
        </fl-text-icon>
      </div>
    </mat-cell>
  </ng-container>

  <!-- score-->
  <ng-container matColumnDef="score">
    <mat-header-cell *matHeaderCellDef>
      <span>{{'biox.score' | translate}}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let experiment">
      <span>{{experiment.score}}</span>
    </mat-cell>
  </ng-container>

  <!-- Status -->
  <ng-container matColumnDef="status">
    <mat-header-cell *matHeaderCellDef>
      <span>{{'status' | translate}}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let experiment">
      <mat-icon *ngIf="experiment.isValidated"
                [matTooltip]="'biox.experiment_validated' | translate"
                class="verified-icon" flIcon="validated">
      </mat-icon>

      <fl-status-chip [status]="experiment.status" mode="iconText" size="small">
      </fl-status-chip>
    </mat-cell>
  </ng-container>

  <!-- Created -->
  <ng-container matColumnDef="createdAt">
    <mat-header-cell *matHeaderCellDef>
      <span>{{'creation_info' | translate}}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let experiment">
      <fl-user-with-date [user]="experiment.createdBy" [date]="experiment.createdAt"></fl-user-with-date>
    </mat-cell>
  </ng-container>

  <!-- Tags -->
  <ng-container matColumnDef="tags">
    <mat-header-cell *matHeaderCellDef class="g-column-width-2">
      <span> {{'tags' | translate}}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let experiment" class="g-column-width-2 tags">
      <fl-tag-list [tags]="experiment.tags"
                   [tagSelectable]="true" (tagSelected)="onTagSelected($event)"></fl-tag-list>
    </mat-cell>
  </ng-container>

  <!-- Disassociate experiment -->
  <ng-container matColumnDef="disassociate">
    <mat-header-cell *matHeaderCellDef class="g-table-icon-button-cell">
    </mat-header-cell>
    <mat-cell *matCellDef="let experiment" class="g-table-icon-button-cell">
      <button mat-icon-button type="button" (click)="disassociateExperiment(experiment, $event)"
              [matTooltip]="'biox.report_disassociate_experiment' | translate">
        <mat-icon>clear</mat-icon>
      </button>
    </mat-cell>
  </ng-container>


  <!-- Dynamic columns -->
  <ng-container *ngFor="let column of dynamicColumns" [matColumnDef]="column.accessor">
    <mat-header-cell *matHeaderCellDef>
      {{column.columnName | translate}}
    </mat-header-cell>
    <mat-cell *matCellDef="let experiment">
      <div>
        <span>{{experiment[column.accessor]}}</span>
      </div>
    </mat-cell>
  </ng-container>


  <mat-header-row *matHeaderRowDef="_columns; sticky: true"></mat-header-row>

  <!-- Mode selectable -->
  <ng-container *ngIf="rowSelectable; else notSelectable">
    <mat-row *matRowDef="let row; columns: _columns;" class="g-table-row-selectable"
             (click)="rowClicked(row)"
             flDragHover="drag-element" [flDragHoverMode]="supportedDropType" (flDrop)="onDrop(row, $event)">
    </mat-row>
  </ng-container>

  <!-- Mode link -->
  <ng-template #notSelectable>
    <mat-row *matRowDef="let row; columns: _columns;" class="g-table-row-selectable"
             [routerLink]="row | labDetailRoute"
             flDragHover="drag-element" [flDragHoverMode]="supportedDropType" (flDrop)="onDrop(row, $event)">
    </mat-row>
  </ng-template>
</mat-table>

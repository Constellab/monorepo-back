<mat-table fxFlex="100" mat-table [dataSource]="datasource" class="table">


  <!-- Title -->
  <ng-container matColumnDef="title">
    <mat-header-cell *matHeaderCellDef>
      <span> {{'title' | translate}}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let experiment" class="g-cell-with-left-border"
              [style.borderLeftColor]="experiment.project?.id | flStringToRgb">
      <div>
        <div>{{experiment.title}}</div>
        <fl-text-icon class="g-text-tiny g-text-light" *ngIf="experiment.project"
                      gap="0">
          <mat-icon flIcon="project" class="g-icon-tiny"></mat-icon>
          {{experiment.project.title}}
        </fl-text-icon>
      </div>
    </mat-cell>
  </ng-container>

  <!-- score-->
  <ng-container matColumnDef="score">
    <mat-header-cell *matHeaderCellDef>
      <span>{{'biox.score' | translate}}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let experiment">
      <span>{{experiment.score}}</span>
    </mat-cell>
  </ng-container>

  <!-- Status -->
  <ng-container matColumnDef="status">
    <mat-header-cell *matHeaderCellDef>
      <span>{{'status' | translate}}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let experiment">
      <mat-icon *ngIf="experiment.isValidated"
                [matTooltip]="'biox.experiment_validated' | translate"
                class="verified-icon">verified
      </mat-icon>

      <fl-status-chip [status]="experiment.status" mode="iconText">
      </fl-status-chip>
    </mat-cell>
  </ng-container>

  <!-- Created -->
  <ng-container matColumnDef="createdAt">
    <mat-header-cell *matHeaderCellDef>
      <span>{{'creation_info' | translate}}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let experiment">
      <fl-creation-info [createdAt]="experiment.createdAt"
                        [createdBy]="experiment.createdBy.fullname"
                        class="g-text-small">
      </fl-creation-info>
    </mat-cell>
  </ng-container>

  <!-- Tags -->
  <ng-container matColumnDef="tags">
    <mat-header-cell *matHeaderCellDef class="g-column-width-2">
      <span> {{'tags' | translate}}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let resource" class="g-column-width-2 tags">
      <fl-tag-list [tags]="resource.tags" [limitNumber]="6"></fl-tag-list>
    </mat-cell>
  </ng-container>


  <!-- Dynamic columns -->
  <ng-container *ngFor="let column of dynamicColumns" [matColumnDef]="column.accessor">
    <mat-header-cell *matHeaderCellDef>
      <p>{{column.columnName | translate}}</p>
    </mat-header-cell>
    <mat-cell *matCellDef="let experiment">
      <div>
        <span>{{experiment[column.accessor]}}</span>
      </div>
    </mat-cell>
  </ng-container>


  <mat-header-row *matHeaderRowDef="_columns; sticky: true"></mat-header-row>

  <!-- Mode selectable -->
  <ng-container *ngIf="rowSelectable; else notSelectable">
    <mat-row *matRowDef="let row; columns: _columns;" class="g-table-row-selectable"
             (click)="rowClicked(row)"></mat-row>
  </ng-container>

  <!-- Mode link -->
  <ng-template #notSelectable>
    <mat-row *matRowDef="let row; columns: _columns;" class="g-table-row-selectable"
             [routerLink]="row | labDetailRoute"></mat-row>
  </ng-template>
</mat-table>

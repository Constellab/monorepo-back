<fl-dialog-header>
  {{title | translate}}
</fl-dialog-header>

<mat-dialog-content class="g-dialog-disable-overflow">
  <form (ngSubmit)="submit()" id="biox-form" [formGroup]="formGp">

    <!--  title  -->
    <mat-form-field class="g-form-input">
      <mat-label>{{'title' | translate}}</mat-label>
      <input matInput formControlName="title" required flInputMaxLength="50"
             placeholder="{{'title' | translate}}">
      <mat-error *ngIf="formGp.get('title').hasError('required')">
        {{'title' | flErrorRequired}}
      </mat-error>
    </mat-form-field>

    <!--    Project      -->
    <mat-form-field class="g-form-input">
      <mat-label>{{'biox.project' | translate}}</mat-label>
      <mat-select formControlName="project">
        <lab-project-select-options></lab-project-select-options>
      </mat-select>
    </mat-form-field>

  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button color="primary" type="submit" form="biox-form"
          class="g-centered-forced">
    {{'save' | translate}}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>

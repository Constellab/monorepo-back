<fl-dialog-header>
  {{title | translate}}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="share-link-form" [formGroup]="formGp">

    <p class="help-text">{{'biox.share_object_help' | translate}}</p>

    <!--    Valid until      -->
    <mat-form-field class="g-form-input">
      <mat-label>{{'biox.share_link_valid_until' | translate}}</mat-label>
      <input matInput formControlName="validUntil"
             [matDatepicker]="endingPicker" [placeholder]="'biox.share_link_valid_until' | translate">
      <mat-datepicker-toggle matSuffix [for]="endingPicker"></mat-datepicker-toggle>
      <mat-datepicker #endingPicker startView="month"></mat-datepicker>
      <mat-error *ngIf="formGp.get('validUntil').hasError('required')">
        {{'biox.share_link_valid_until' | flErrorRequired }}
      </mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button color="primary" type="submit" form="share-link-form"
          class="g-centered-forced">
    {{'save' | translate}}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>

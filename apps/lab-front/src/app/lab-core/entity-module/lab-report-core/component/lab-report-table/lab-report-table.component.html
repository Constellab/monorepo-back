<mat-table fxFlex="100" mat-table [dataSource]="datasource" class="table">

  <!-- Title -->
  <ng-container matColumnDef="title">
    <mat-header-cell *matHeaderCellDef>
      <span> {{'title' | translate}}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let report" class="g-cell-with-left-border"
              [style.borderLeftColor]="report.project?.id | flStringToRgb">
      <div class="validated-icon">
        <mat-icon *ngIf="report.isValidated"
                  [matTooltip]="'biox.report_validated' | translate" flIcon="validated">
        </mat-icon>
      </div>

      <div>
        <div>{{report.title}}</div>
        <fl-text-icon class="g-text-tiny g-text-light" *ngIf="report.project"
                      gap="0">
          <mat-icon flIcon="experiment" class="g-icon-tiny"></mat-icon>
          {{report.project.title}}
        </fl-text-icon>
      </div>

    </mat-cell>
  </ng-container>


  <!-- Datetime -->
  <ng-container matColumnDef="createdAt">
    <mat-header-cell *matHeaderCellDef>
      <span>{{'datetime' | translate}}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let report">
      <span>{{report.createdAt | flDate}}</span>
    </mat-cell>
  </ng-container>


  <!-- Dynamic columns -->
  <ng-container *ngFor="let column of dynamicColumns" [matColumnDef]="column.accessor">
    <mat-header-cell *matHeaderCellDef>
      {{column.columnName | translate}}
    </mat-header-cell>
    <mat-cell *matCellDef="let obj">
      <div>
        <span>{{obj[column.accessor]}}</span>
      </div>
    </mat-cell>
  </ng-container>


  <mat-header-row *matHeaderRowDef="_columns; sticky: true"></mat-header-row>
  <!-- Mode selectable -->
  <ng-container *ngIf="rowSelectable; else notSelectable">
    <mat-row *matRowDef="let row; columns: _columns;" class="g-table-row-selectable"
             (click)="rowClicked(row)"></mat-row>
  </ng-container>

  <!-- Mode link -->
  <ng-template #notSelectable>
    <mat-row *matRowDef="let row; columns: _columns;" class="g-table-row-selectable"
             [routerLink]="row | labDetailRoute"></mat-row>
  </ng-template>
</mat-table>

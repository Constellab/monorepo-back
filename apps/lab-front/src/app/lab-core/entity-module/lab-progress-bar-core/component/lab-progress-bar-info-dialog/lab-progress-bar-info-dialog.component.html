<fl-dialog-header>
  <fl-dialog-header-actions>
    <a [href]="downloadUrl$ | async" download mat-icon-button
       [matTooltip]="'biox.download_messages' | translate">
      <mat-icon>cloud_download</mat-icon>
    </a>
  </fl-dialog-header-actions>
</fl-dialog-header>

<mat-dialog-content #content>
  <fl-async-section [object]="progressBar$">

    <ng-container *flSectionBody>
      <lab-progress-bar-info [progressBar$]="progressBar$" [scrollableElement]="content"></lab-progress-bar-info>
    </ng-container>
  </fl-async-section>
</mat-dialog-content>

<fl-dialog-header>
  {{title | translate}}
</fl-dialog-header>

<mat-dialog-content>

  <div class="help-text" *ngIf="isUpdateMode()">
    {{'tag_update_help_text' | translate}}
  </div>

  <form (ngSubmit)="submit()" id="tag-form" [formGroup]="formGp">

    <!--  Key  -->
    <mat-form-field class="g-form-input" appearance="outline">
      <mat-label>{{'tag_key' | translate}}</mat-label>
      <input matInput formControlName="key" required [flInputMaxLength]="maxLength"
             placeholder="{{'tag_key' | translate}}">
      <mat-error *ngIf="formGp.get('key').hasError('required')">
        {{'tag_key' | flErrorRequired}}
      </mat-error>
    </mat-form-field>

    <!--  Value  -->
    <mat-form-field class="g-form-input" appearance="outline">
      <mat-label>{{'tag_value' | translate}}</mat-label>
      <input matInput formControlName="value" required [flInputMaxLength]="maxLength"
             placeholder="{{'tag_value' | translate}}">
      <mat-error *ngIf="formGp.get('value').hasError('required')">
        {{'tag_value' | flErrorRequired}}
      </mat-error>
    </mat-form-field>

  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-raised-button color="primary" type="submit" form="tag-form"
          class="g-centered">
    {{'save' | translate}}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>

<fl-dialog-header>
  {{'biox.configuration' | translate}}
</fl-dialog-header>

<mat-dialog-content class="content">
  <form (ngSubmit)="submit()" id="config-form" [formGroup]="formGp">
    <lab-configure-specs-form [configData]="configData"></lab-configure-specs-form>
  </form>
</mat-dialog-content>


<div mat-dialog-actions>
  <button mat-flat-button color="primary" type="submit" form="config-form"
          class="g-centered-forced">
    {{'save' | translate}}
  </button>
</div>

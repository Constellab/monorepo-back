<div fxLayout="column" class="form" [formGroup]="formGp">

  <div fxLayout="row wrap" fxLayoutGap="1em" fxLayoutAlign="space-between center"
       class="g-full">

    <!--  ViewType  -->
    <mat-form-field class="g-full">
      <mat-label>{{'biox.view_type' | translate }}</mat-label>
      <mat-select formControlName="viewType" [placeholder]="'biox.view_type' | translate"
                  multiple>
        <mat-select-trigger *ngIf="formGp.value.viewType | labViewTypeInfo as viewType">
          <fl-text-icon>
            <mat-icon [flIcon]="viewType.icon"></mat-icon>
            {{viewType.text | translate}}
          </fl-text-icon>
        </mat-select-trigger>
        <lab-select-view-type-options></lab-select-view-type-options>
      </mat-select>
    </mat-form-field>

    <!--  Title  -->
    <mat-form-field class="g-full">
      <mat-label>{{'title' | translate }}</mat-label>
      <input matInput formControlName="title" [placeholder]="'title' | translate" autocomplete="off">
    </mat-form-field>

    <!--  Projects -->
    <mat-expansion-panel [expanded]="true" class="g-full" *ngIf="showProjectFilter">
      <mat-expansion-panel-header>
        <mat-panel-title>
          {{'biox.projects' | translate }}
        </mat-panel-title>
      </mat-expansion-panel-header>

      <lab-project-select formControlName="project" (selectionChange)="callSearch()"></lab-project-select>
    </mat-expansion-panel>

    <!--   Tags    -->
    <lab-tag-dashboard formControlName="tags" (selectionChange)="callSearch()"
                       class="tags"></lab-tag-dashboard>

    <!--  Creation date  -->
    <div class="g-no-hint g-full g-form-field-compact">
      <p class="g-text-small subtitle">{{'creation_date' | translate}}</p>
      <fl-search-date-interval formGroupName="createdAt">
      </fl-search-date-interval>
    </div>

<!--  Include none highlighted  -->
    <mat-checkbox formControlName="includeNotFlagged"
                  class="checkbox g-mat-checkbox-wrap-text">
      {{'biox.view_include_not_flagged' | translate }}
    </mat-checkbox>




  </div>
</div>

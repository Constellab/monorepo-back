<fl-search class="g-full-height">

  <!-- Advanced section in the right in a drawer -->
  <fl-search-advanced-form>
    <!--  Show project filter only when full page (the search). Otherwise, it is useless  -->
    <lab-view-config-search-form [showProjectFilter]="fullPageSearch"></lab-view-config-search-form>
  </fl-search-advanced-form>


  <!--  Center header  -->
  <fl-search-header>
    <fl-text-icon>
      <mat-icon flIcon="view"></mat-icon>
      <h2>{{'biox.viewbox' | translate}}</h2>
    </fl-text-icon>
  </fl-search-header>


  <fl-search-result>
    <lab-view-config-table [datasource]="datasource" [columns]="columns"
                           [selectableRow]="!fullPageSearch"
                           (viewConfigSelected)="selectViewConfig($event)"
                           (tagSelected)="searchOnTag($event)"></lab-view-config-table>
  </fl-search-result>

</fl-search>

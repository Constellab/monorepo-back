<mat-table fxFlex="100" mat-table [dataSource]="datasource">

  <!-- ViewType -->
  <ng-container matColumnDef="viewType">
    <mat-header-cell *matHeaderCellDef>
      <span> {{'biox.view_type' | translate}}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let viewConfig">
      <ng-container *ngIf="viewConfig.viewType | labViewTypeInfo as viewTypeInfo">
        <fl-text-icon>
          <mat-icon [flIcon]="viewTypeInfo.icon"></mat-icon>
          {{viewTypeInfo.text | translate}}
        </fl-text-icon>
      </ng-container>

    </mat-cell>
  </ng-container>

  <!-- Resource -->
  <ng-container matColumnDef="resource">
    <mat-header-cell *matHeaderCellDef>
      <span>{{'resource' | translate}}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let viewConfig">
      <div>
        <div class="name">{{viewConfig.resource.name}}</div>
        <fl-text-icon class="g-text-tiny g-text-light" *ngIf="viewConfig.experiment"
                      gap="0">
          <mat-icon flIcon="experiment" class="g-icon-tiny"></mat-icon>
          {{viewConfig.experiment.title}}
        </fl-text-icon>
      </div>
    </mat-cell>
  </ng-container>

  <!-- Tags -->
  <ng-container matColumnDef="tags">
    <mat-header-cell *matHeaderCellDef class="g-column-width-2">
      <span> {{'tags' | translate}}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let resource" class="g-column-width-2 tags">
      <fl-tag-list [tags]="resource.tags"
                   [tagSelectable]="tagSelectable" (tagSelected)="onTagSelected($event)"></fl-tag-list>
    </mat-cell>
  </ng-container>

  <!-- Datetime -->
  <ng-container matColumnDef="createdAt">
    <mat-header-cell *matHeaderCellDef>
      <span>{{'biox.view_config_date' | translate}}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let viewConfig">
      <fl-from-now [date]="viewConfig.createdAt"></fl-from-now>
    </mat-cell>
  </ng-container>

  <!-- Preview -->
  <ng-container matColumnDef="preview">
    <mat-header-cell *matHeaderCellDef class="g-table-icon-button-cell">
    </mat-header-cell>
    <mat-cell *matCellDef="let viewConfig" class="g-table-icon-button-cell">

      <button mat-icon-button type="button" (click)="showPreview(viewConfig, $event)"
              [matTooltip]="'biox.view_preview' | translate">
        <mat-icon>visibility</mat-icon>
      </button>
    </mat-cell>
  </ng-container>

  <!-- Action -->
  <ng-container matColumnDef="action">
    <mat-header-cell *matHeaderCellDef class="g-table-icon-button-cell">
    </mat-header-cell>
    <mat-cell *matCellDef="let viewConfig" class="g-table-icon-button-cell">

      <lab-view-config-actions-menu [viewConfig]="viewConfig"
                                    (update)="onUpdate($event)"
                                    (updateTags)="onUpdateTags(viewConfig, $event)">
      </lab-view-config-actions-menu>
    </mat-cell>
  </ng-container>

  <!-- Flagged -->
  <ng-container matColumnDef="flagged">
    <mat-header-cell *matHeaderCellDef class="g-table-icon-button-cell">
    </mat-header-cell>
    <mat-cell *matCellDef="let viewConfig" class="g-table-icon-button-cell">
      <lab-flag-button [entity]="viewConfig"></lab-flag-button>
    </mat-cell>
  </ng-container>

  <!-- Dynamic columns -->
  <ng-container *ngFor="let column of dynamicColumns" [matColumnDef]="column.accessor">
    <mat-header-cell *matHeaderCellDef>
      {{column.columnName | translate}}
    </mat-header-cell>
    <mat-cell *matCellDef="let obj">
      <div>
        <span>{{obj[column.accessor]}}</span>
      </div>
    </mat-cell>
  </ng-container>


  <mat-header-row *matHeaderRowDef="_columns; sticky: true"></mat-header-row>


  <!-- Mode selectable -->
  <ng-container *ngIf="selectableRow; else notSelectable">
    <mat-row *matRowDef="let row; columns: _columns;" class="g-table-row-selectable"
             (click)="rowClicked(row)"
             flDragHover="drag-element" [flDragHoverMode]="supportedDropType" (flDrop)="onDrop(row, $event)">
    </mat-row>
  </ng-container>

  <!-- Mode link -->
  <ng-template #notSelectable>
    <mat-row *matRowDef="let row; columns: _columns;" class="g-table-row-selectable"
             [routerLink]="row | labDetailRoute"
             flDragHover="drag-element" [flDragHoverMode]="supportedDropType" (flDrop)="onDrop(row, $event)">
    </mat-row>
  </ng-template>


</mat-table>

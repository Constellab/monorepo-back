<mat-table fxFlex="100" mat-table [dataSource]="datasource">

  <!-- ViewType -->
  <ng-container matColumnDef="viewType">
    <mat-header-cell *matHeaderCellDef>
      <span> {{'biox.view_type' | translate}}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let viewConfig">
      <ng-container *ngIf="viewConfig.viewType | labViewTypeInfo as viewTypeInfo">
        <fl-text-icon>
          <mat-icon>{{viewTypeInfo.icon}}</mat-icon>
          {{viewTypeInfo.text | translate}}
        </fl-text-icon>
      </ng-container>
    </mat-cell>
  </ng-container>


  <!-- Datetime -->
  <ng-container matColumnDef="createdAt">
    <mat-header-cell *matHeaderCellDef>
      <span>{{'datetime' | translate}}</span>
    </mat-header-cell>
    <mat-cell *matCellDef="let viewTypeInfo">
      <fl-from-now [date]="viewTypeInfo.createdAt"></fl-from-now>
    </mat-cell>
  </ng-container>

  <!-- Preview -->
  <ng-container matColumnDef="preview">
    <mat-header-cell *matHeaderCellDef class="g-table-icon-button-cell">
    </mat-header-cell>
    <mat-cell *matCellDef="let viewTypeInfo" class="g-table-icon-button-cell">

      <button mat-icon-button type="button" (click)="showPreview(viewTypeInfo, $event)"
              [matTooltip]="'biox.view_preview' | translate">
        <mat-icon>visibility</mat-icon>
      </button>
    </mat-cell>
  </ng-container>

  <!-- Dynamic columns -->
  <ng-container *ngFor="let column of dynamicColumns" [matColumnDef]="column.accessor">
    <mat-header-cell *matHeaderCellDef>
      {{column.columnName | translate}}
    </mat-header-cell>
    <mat-cell *matCellDef="let obj">
      <div>
        <span>{{obj[column.accessor]}}</span>
      </div>
    </mat-cell>
  </ng-container>


  <mat-header-row *matHeaderRowDef="_columns; sticky: true"></mat-header-row>
  <mat-row *matRowDef="let row; columns: _columns;" class="g-table-row-selectable"
           (click)="rowClicked(row)"></mat-row>

</mat-table>

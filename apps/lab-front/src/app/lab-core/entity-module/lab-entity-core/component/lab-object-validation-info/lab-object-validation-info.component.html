<!--  Validated info  -->
<fl-text-icon *ngIf="object.validatedBy && object.validatedAt"
              [matTooltip]="object.validatedAt | flDate:'DATETIME_MED'">
  <mat-icon flIcon="validated"></mat-icon>
  <p>
    {{'validation_info' | translate: {date: object.validatedAt | flDate, user: object.validatedBy.fullname} }}
  </p>
</fl-text-icon>

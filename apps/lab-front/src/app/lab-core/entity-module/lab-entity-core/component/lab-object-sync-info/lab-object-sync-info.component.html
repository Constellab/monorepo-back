<div *ngIf="object.isSynced ; else notSynced"
     fxLayout="row wrap" fxLayoutAlign="start center" fxLayoutGap="0.5em">
  <mat-icon>sync</mat-icon>
  <div>{{'biox.last_sync' | translate}} :</div>
  <fl-user-with-date [user]="object.lastSyncBy" [date]="object.lastSyncAt"></fl-user-with-date>
</div>

<ng-template #notSynced>
  <fl-text-icon class="separator">
    <mat-icon>sync_disabled</mat-icon>
    {{'biox.not_synced_with_space' | translate}}
  </fl-text-icon>
</ng-template>

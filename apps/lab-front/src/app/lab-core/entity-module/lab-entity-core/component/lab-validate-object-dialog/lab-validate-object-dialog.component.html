<fl-dialog-header>
  {{title | translate}}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="validation-form">

    <p *ngIf="helpText" class="g-text-light help-text">{{helpText| translate}}</p>

    <!--    Project      -->
    <div class="g-text-centered">
      <fl-form-field>
        <lab-project-select-button [formControl]="formControl"></lab-project-select-button>
        <mat-error *ngIf="formControl.hasError('required')">
          {{'biox.project' | flErrorRequired}}
        </mat-error>
      </fl-form-field>
    </div>

  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button color="primary" type="submit" form="validation-form"
          class="g-centered-forced">
    {{title | translate}}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>

<fl-section [isLoading]="isLoading" [object]="isRunning">

  <ng-container *flSectionBody>

    <div>
      <fl-text-icon>
        <mat-icon *ngIf="isRunning; else notRunning" color="primary" class="g-icon-big">check</mat-icon>
        <ng-template #notRunning>
          <mat-icon color="warn" class="g-icon-big">error</mat-icon>
        </ng-template>
        <p class="g-text-big">{{'monitoring.lab_running' | translate}}</p>
      </fl-text-icon>
    </div>


  </ng-container>
</fl-section>

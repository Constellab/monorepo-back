<fl-card>
  <fl-card-header>
    <fl-text-icon>
      <mat-icon class="g-icon-big">description</mat-icon>
      <h2>{{'monitoring.logs' | translate}}</h2>
    </fl-text-icon>

  </fl-card-header>

  <fl-card-body>

    <fl-async-section [object]="logsStatus$">

      <ng-container *flSectionBody="let logsStatus">

        <fl-key-value>
          <fl-key>{{'monitoring.log_folder' | translate}}</fl-key>
          {{logsStatus.logFolder}}
        </fl-key-value>

        <lab-log-table [datasource]="logsList" [columns]="displayedColumns"></lab-log-table>
      </ng-container>
    </fl-async-section>
  </fl-card-body>
</fl-card>

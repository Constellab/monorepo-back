<fl-dialog-header>
  {{'monitoring.call_migration_title' | translate}}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="migration-form">

    <p class="g-text-light help-text">{{'monitoring.call_migration_help_text'| translate}}</p>


    <!--    Project      -->
    <mat-form-field class="g-form-input">
      <mat-label>{{'monitoring.select_migration_version' | translate}}</mat-label>
      <mat-select [formControl]="formControl">
        <mat-option *ngFor="let migration of brickMigrations$ | async" [value]="migration.version">
          {{migration.version}} | <span class="g-text-light g-text-small">{{migration.shortDescription}}</span>
        </mat-option>
      </mat-select>
      <mat-error *ngIf="formControl.hasError('required')">
        {{'monitoring.select_migration_version' | flErrorRequired}}
      </mat-error>
    </mat-form-field>

  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button color="primary" type="submit" form="migration-form"
          class="g-centered-forced">
    {{'monitoring.call_migration' | translate}}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>

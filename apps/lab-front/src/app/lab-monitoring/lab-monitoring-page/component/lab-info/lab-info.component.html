<div *ngIf="isLoading; else loadingFinished" class="g-text-centered">
  <fl-loader size="medium"></fl-loader>
</div>

<ng-template #loadingFinished>

  <fl-text-icon *ngIf="labInfo else error">
    <mat-icon color="primary" class="g-icon-big">check</mat-icon>

    <p class="g-text-big">{{'monitoring.lab_running' | translate}}</p>

    <fl-key-value>
      <fl-key>{{'monitoring.lab_name' | translate}}</fl-key>
      {{labInfo.labName}}
    </fl-key-value>

    <fl-key-value *ngIf="labInfo.frontVersion">
      <fl-key>{{'monitoring.front_version' | translate}}</fl-key>
      {{labInfo.frontVersion}}
    </fl-key-value>
  </fl-text-icon>


  <ng-template #error>
    <fl-text-icon>
      <mat-icon color="warn" class="g-icon-big">error</mat-icon>
      <p class="g-text-big">{{'monitoring.lab_not_running' | translate}}</p>
    </fl-text-icon>
  </ng-template>
</ng-template>

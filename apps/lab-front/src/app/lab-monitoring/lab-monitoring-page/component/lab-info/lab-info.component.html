<div *ngIf="isLoading; else loadingFinished" class="g-text-centered">
  <fl-loader size="medium"></fl-loader>
</div>

<ng-template #loadingFinished>

  <div *ngIf="labInfo else error">

    <fl-text-icon>
      <mat-icon color="primary" class="g-icon-big">check</mat-icon>

      <p class="g-text-big">{{'monitoring.lab_running' | translate}}</p>

      <fl-key-value>
        <fl-key>{{'monitoring.lab_name' | translate}}</fl-key>
        {{labInfo.labName}}
      </fl-key-value>

      <fl-key-value *ngIf="labInfo.frontVersion">
        <fl-key>{{'monitoring.front_version' | translate}}</fl-key>
        {{labInfo.frontVersion}}
      </fl-key-value>
    </fl-text-icon>

    <div class="action">
      <button mat-stroked-button type="button" class="g-button-small action-button"
              (click)="deleteUnavailableTypings()">
        {{'monitoring.delete_unavailable_typings' | translate}}
      </button>

      <button mat-stroked-button type="button" class="g-button-small action-button"
              (click)="synchronizeProjects()">
        {{'monitoring.synchronize_projects' | translate}}
        <fl-button-loader *ngIf="synchronizeLoading" size="small"></fl-button-loader>
      </button>

      <button mat-stroked-button type="button" class="g-button-small action-button"
              (click)="cleanLab()">
        {{'monitoring.clean_lab' | translate}}
      </button>

    </div>
  </div>

  <ng-template #error>
    <fl-text-icon>
      <mat-icon color="warn" class="g-icon-big">error</mat-icon>
      <p class="g-text-big">{{'monitoring.lab_not_running' | translate}}</p>
    </fl-text-icon>
  </ng-template>
</ng-template>

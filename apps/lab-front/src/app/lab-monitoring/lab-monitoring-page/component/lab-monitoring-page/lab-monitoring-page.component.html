<div class="g-page">


  <div class="g-page-title nav-bar"
       fxLayout="row" fxLayoutAlign="row center" fxLayoutGap="1em">
    <fl-text-icon>
      <mat-icon class="g-icon-big">troubleshoot</mat-icon>
      <h1>{{'monitoring.monitoring' | translate}}</h1>
    </fl-text-icon>

    <a mat-button [routerLink]="monitoringRoute" routerLinkActive="menu-active"
       [routerLinkActiveOptions]="{exact: true}">
      <mat-icon>dashboard</mat-icon>
      {{'monitoring.dashboard' | translate}}
    </a>

    <a mat-button [routerLink]="monitoringVenvsRoute" routerLinkActive="menu-active"
       [routerLinkActiveOptions]="{exact: true}">
      <mat-icon>takeout_dining</mat-icon>
      {{'monitoring.venv_list' | translate}}
    </a>
  </div>

  <router-outlet></router-outlet>
</div>

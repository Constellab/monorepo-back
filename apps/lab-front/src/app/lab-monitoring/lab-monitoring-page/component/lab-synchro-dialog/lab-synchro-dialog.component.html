<fl-dialog-header>
  {{'monitoring.synchronize_lab' | translate}}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="sync-form" [formGroup]="formGp">

    <!--  Sync users  -->
    <div>
      <mat-checkbox formControlName="syncUsers">
        {{'monitoring.synchronize_users' | translate}}
      </mat-checkbox>
    </div>

    <!--  Sync projects  -->
    <div class="sync-project">
      <mat-checkbox formControlName="syncProjects">
        {{'monitoring.synchronize_projects' | translate}}
      </mat-checkbox>
    </div>

  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button color="primary" type="submit" form="sync-form"
          class="g-centered-forced">
    {{'save' | translate}}
  </button>
</div>

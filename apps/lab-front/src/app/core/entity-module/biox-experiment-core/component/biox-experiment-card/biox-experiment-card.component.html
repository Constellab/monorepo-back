<fl-card>

  <fl-card-header>
    <h1>{{experiment.title}}</h1>

    <fl-card-actions>

      <button mat-icon-button type="button" (click)="toggleDetail()">
        <mat-icon>{{expandIcon}}</mat-icon>
      </button>

      <ng-content></ng-content>

      <fl-status-chip [status]="experiment.status" mode="iconText"
                      class="status"></fl-status-chip>
    </fl-card-actions>
  </fl-card-header>

  <fl-card-body *ngIf="showDetail">

    <fl-limit-height [maxHeight]="100">
      <div [innerHTML]="experiment.description"></div>
    </fl-limit-height>
  </fl-card-body>

  <fl-card-footer>
      <p class="g-text-small g-text-light">
        {{'last_modified_the'| translate}} {{experiment.lastModifiedAt | flDate}}
      </p>
  </fl-card-footer>
</fl-card>

<fl-card>

  <fl-card-header>
    <h1>{{experiment.data.title}}</h1>

    <fl-card-actions>
      <ng-content></ng-content>

      <fl-status-chip [status]="experiment" mode="iconText"
                      class="status"></fl-status-chip>
    </fl-card-actions>
  </fl-card-header>

  <fl-card-body>
    {{'datetime'| translate}} : {{experiment.createdAt | flDate}}

    <fl-limit-height [maxHeight]="100">
      <div [innerHTML]="experiment.data.description">
      </div>
    </fl-limit-height>
  </fl-card-body>
</fl-card>

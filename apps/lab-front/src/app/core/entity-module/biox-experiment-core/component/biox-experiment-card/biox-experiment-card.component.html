<fl-card>

  <fl-card-header>
    <h1>{{experiment.data.title}}</h1>

    <fl-card-actions>
      <fl-status-chip [status]="experiment" mode="iconText"></fl-status-chip>
    </fl-card-actions>
  </fl-card-header>

  <fl-card-body>
    {{'datetime'| translate}} : {{experiment.createdAt | flDate}}

    <div>
      {{experiment.data.description}}
    </div>
  </fl-card-body>
</fl-card>

<fl-dynamic-form-group [control]="publicFormGp" [config]="publicConfig"></fl-dynamic-form-group>

<mat-expansion-panel *ngIf="showProtectedConfigs" flDisableAnimationInit [expanded]="protectedConfigExpand"
                     class="expansion-panel">
  <mat-expansion-panel-header>
    <mat-panel-title>
      {{'biox.advanced_configuration' | translate}}
    </mat-panel-title>
  </mat-expansion-panel-header>

  <fl-dynamic-form-group [control]="protectedFormGp" [config]="protectedConfig"></fl-dynamic-form-group>
</mat-expansion-panel>

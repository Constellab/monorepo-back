<div fxLayout="row" class="g-full">
  <fl-async-section [object]="transformersList$" emptyText="biox.no_transformers" class="section g-scrollable-element"
                    fxFlex="20%">

    <ng-container *flSectionBody="let transformers">
      <div *ngFor="let transformer of transformers" fxLayout="row" fxLayoutAlign="space-between center"
           class="g-full" [genBioxProcessTypeHoverDetail]="transformer" [flMouseEnterDelay]="500">
        <button mat-stroked-button type="button" (click)="addTransformer(transformer)"
                class="g-button-small button">
          {{transformer.name}}
        </button>
      </div>
    </ng-container>
  </fl-async-section>

  <div class="divider"></div>

  <div class="section right-section g-scrollable-element" fxFlex="80%">
    <mat-accordion cdkDropList (cdkDropListDropped)="drop($event)">
      <ng-container *ngFor="let transformer of selectedTransformers; let index = index; let last = last">
        <mat-expansion-panel hideToggle cdkDrag [expanded]="true" class="transform-panel"
                             [formGroup]="getFormGroup(index)">

          <mat-expansion-panel-header>
            <!--    Force text color to override disable color    -->
            <div class="g-full g-text-normal-color" fxLayout="row" fxLayoutAlign="start center">
              <div class="transform-name" fxFlex="auto">{{transformer.transformer.name}}</div>

              <div class="g-text-light"
                   *ngIf="!transformer.hasConfig">{{'biox.transformer_no_config' | translate}}</div>

              <button mat-icon-button type="button" (click)="removeTransformer(index, $event)">
                <mat-icon>clear</mat-icon>
              </button>
            </div>
          </mat-expansion-panel-header>

          <gen-biox-configure-specs-form *ngIf="transformer.hasConfig; else noConfig"
                                         [bioxConfigData]="transformer.configData"
                                         formGroupName="config"></gen-biox-configure-specs-form>


          <ng-template #noConfig>
            <fl-error-text [errorMessage]="'biox.transformer_no_config' | translate"></fl-error-text>
          </ng-template>
        </mat-expansion-panel>

        <mat-icon class="g-centered-forced" *ngIf="!last">arrow_drop_down</mat-icon>
      </ng-container>
    </mat-accordion>
  </div>
</div>

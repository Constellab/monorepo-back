<mat-slide-toggle
  color="primary"
  [checked]="checked"
  [disabled]="disabled"
  (change)="toggleChange($event)"
  (click)="stopEventPropagation($event)">
  {{'dev_env_toggle' | translate}}
</mat-slide-toggle>

<div *ngIf="showHelpMessage" class="g-text-tiny g-text-light help-text">
  {{'dev_env_not_available' | translate}}
</div>

<div *ngIf="action$ | async as action" [style.width]="drawerWidth"
     fxLayout="column" class="g-full-height">

  <div fxLayout="row" fxLayoutAlign="space-between center" class="header">
    <div class="g-text-big title">
      {{action.title}}
    </div>

    <button mat-icon-button type="button" flDrawerClose tabindex="-1"
            [matTooltip]="'close' | translate">
      <mat-icon>clear</mat-icon>
    </button>
  </div>

  <div class="container" fxFlex="auto">

    <ng-container [ngSwitch]="action.action">

      <lab-workflow-node-detail *ngSwitchCase="'selectNode'"></lab-workflow-node-detail>

    </ng-container>
  </div>

</div>

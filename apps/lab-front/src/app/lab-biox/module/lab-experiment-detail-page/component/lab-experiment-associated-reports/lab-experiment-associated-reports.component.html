<fl-async-section [arrayObs]="reports" emptyText="biox.no_experiment_associated_report">

  <fl-section-header>
    <h3>{{'biox.experiment_associated_report' | translate}}</h3>

    <fl-section-actions>
      <button mat-icon-button type="button" [matTooltip]="'biox.experiment_associate_report' | translate"
              (click)="associateExperiment()">
        <mat-icon>add</mat-icon>
      </button>
    </fl-section-actions>

  </fl-section-header>

  <ng-container *flSectionBody>
    <lab-report-table [datasource]="reports" [columns]="columns"
                      (reportDisassociate)="disassociateReport($event)">
    </lab-report-table>
  </ng-container>
</fl-async-section>

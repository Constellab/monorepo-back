<fl-section [object]="reports" [isLoading]="isLoading" emptyText="biox.no_experiment_associated_report">

  <fl-section-header>
    <h3>{{'biox.experiment_associated_report' | translate}}</h3>

    <fl-section-actions>
      <button mat-icon-button type="button" [matTooltip]="'biox.experiment_associate_report' | translate"
              (click)="associateExperiment()">
        <mat-icon>add</mat-icon>
      </button>
    </fl-section-actions>

  </fl-section-header>

  <ng-container *flSectionBody>
    <lab-report-table *ngIf="!reports.isEmpty(); else empty" [datasource]="reports" [columns]="columns"
                      (reportDisassociate)="disassociateReport($event)">
    </lab-report-table>

    <ng-template #empty>
      <fl-error-text *ngIf="reports.isEmpty()"
                     [errorMessage]="'biox.no_experiment_associated_report' | translate"></fl-error-text>
    </ng-template>
  </ng-container>
</fl-section>

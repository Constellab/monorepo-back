<fl-key-value class="execution-time" *ngIf="progressBar.data.elapsedTime > 0">
  <fl-key>{{'biox.execution_time' | translate}}</fl-key>
  {{progressBar.data.elapsedTime * 1000 | flDuration}}
</fl-key-value>

<div>
  <div *ngFor="let message of progressBar.data.messages">
    <!--    <div fxLayout="row" fxLayoutAlign="space-between" class="g-full">-->
    <div fxLayout="row" fxLayoutAlign="space-between" class="g-full">
      <fl-status-chip [status]="message.type" mode="iconText" size="small"></fl-status-chip>
      <div class="g-text-light date"
           [matTooltip]="message.datetime | flDate:'D, HH:mm:ss'">
        {{message.datetime | flDate : 'HH:mm:ss'}}
      </div>
    </div>

    <fl-limit-height class="text">
      {{message.text}}
    </fl-limit-height>
    <!--      <div class="g-text-light date"-->
    <!--           [matTooltip]="message.datetime | flDate:'D, HH:mm:ss'">-->
    <!--        {{message.datetime | flDate : 'HH:mm:ss'}}-->
    <!--      </div>-->
    <!--    </div>-->

    <mat-divider class="divider"></mat-divider>
  </div>
</div>

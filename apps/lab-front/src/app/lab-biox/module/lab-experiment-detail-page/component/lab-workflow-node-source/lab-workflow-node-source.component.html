<div>

  <div fxLayout="column" fxLayoutAlign="space-between center">

    <!-- Title   -->
    <div class="name g- g-text-small">
      {{title$ | async}}
    </div>


    <!--  actions -->
    <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="0.5em">
      <button mat-icon-button type="button"
              (click)="openNodeDetail()" [matTooltip]="'biox.open_node_detail' | translate">
        <mat-icon>info</mat-icon>
      </button>

      <!--      <fl-status-chip mode="iconOnly" [status]="node.object.status"></fl-status-chip>-->
      <ng-container *ngIf="resourceId$ | async as resourceId">
        <button *ngIf="resourceId" mat-icon-button (click)="openResourceDetail(resourceId)"
                type="button" [matTooltip]="'biox.resource_preview' | translate">
          <mat-icon>visibility</mat-icon>
        </button>
      </ng-container>
    </div>
  </div>

</div>

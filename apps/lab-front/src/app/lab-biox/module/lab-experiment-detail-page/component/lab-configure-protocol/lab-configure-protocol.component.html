<fl-async-section [object]="processes$" emptyText="biox.process_no_config">

  <ng-container *flSectionBody="let processes">

    <div class="container">

      <div class="left-section">
        <div *ngFor="let process of processes" class="process" matRipple
             (click)="selectProcess(process)">
          <div>{{ process.data?.title }}</div>
          <div class="g-text-small g-text-light">{{process.name}}</div>
        </div>
      </div>

      <div class="right-section">
        <lab-configure-process [process$]="selectedProcess$"></lab-configure-process>
      </div>
    </div>

  </ng-container>

</fl-async-section>

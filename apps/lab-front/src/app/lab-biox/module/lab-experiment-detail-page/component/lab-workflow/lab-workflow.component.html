<div fxLayout="column" class="g-full-height" *ngIf="!error; else showError">

  <!--  Workflow header  -->
  <div class="header" fxLayout="row" fxLayoutAlign="start center"
       fxLayoutGap="1em" *ngIf="!flowIsLoading">
    <lab-workflow-actions></lab-workflow-actions>

    <div class="divider"></div>

    <lab-workflow-layers-breadcrumb></lab-workflow-layers-breadcrumb>

  </div>

  <!--  Workflow zone  -->
  <div class="experiment-workflow" #workflow fxFlex="auto">

    <div class="g-text-centered" *ngIf="flowIsLoading">
      <fl-loader></fl-loader>
    </div>

  </div>
</div>

<ng-template #showError>
  <fl-error-text [errorMessage]="'biox.workflow_loading_error' | translate"></fl-error-text>
</ng-template>

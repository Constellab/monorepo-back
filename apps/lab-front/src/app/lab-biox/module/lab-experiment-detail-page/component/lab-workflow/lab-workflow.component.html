<div fxLayout="column" class="g-full-height container" *ngIf="!error; else showError">

  <!--  Workflow zone  -->
  <div class="experiment-workflow" fxFlex="auto">
    <pr-workflow *ngIf="workflow" [workflow]="workflow"
                 [mode$]="mode$"
                 [viewConfig]="viewConfig">
      <lab-workflow-actions></lab-workflow-actions>

    </pr-workflow>


    <div class="g-text-centered" *ngIf="workflowIsLoading">
      <fl-loader></fl-loader>
    </div>

  </div>
</div>

<ng-template #showError>
  <fl-error-text [errorMessage]="'biox.workflow_loading_error' | translate"></fl-error-text>
</ng-template>

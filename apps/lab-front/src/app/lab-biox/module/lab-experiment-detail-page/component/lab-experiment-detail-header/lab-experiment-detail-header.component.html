<div *ngIf="experiment$ | async as experiment" fxLayout="row" fxLayoutAlign="start center">

  <fl-text-icon fxFlex="auto">
    <mat-icon *ngIf="experiment.isValidated" class="g-icon-big"
              [matTooltip]="'biox.experiment_validated' | translate"
              flIcon="validated">
    </mat-icon>
    <h1>{{experiment.title}}</h1>
  </fl-text-icon>

  <lab-sync-object-button [object]="experiment" [syncObjectFunc]="syncObjectFunc"
                          (objectUpdate)="onExperimentUpdate($event)">
  </lab-sync-object-button>


  <button mat-icon-button type="button" [matMenuTriggerFor]="menu"
          class="buttons">
    <mat-icon>more_vert</mat-icon>
  </button>

  <fl-status-chip [status]="experiment.status" mode="iconText"
                  class="buttons"></fl-status-chip>

  <!-- Menu -->
  <mat-menu #menu>
    <button mat-menu-item type="button" (click)="openCreateReport()">
      <mat-icon>post_add</mat-icon>
      {{'biox.create_report' | translate}}
    </button>

    <!--  Update buttons  -->
    <ng-container *ngIf="experiment.isEditable()">
      <button mat-menu-item type="button" (click)="openUpdateDialog()">
        <mat-icon>edit</mat-icon>
        {{'biox.update_experiment' | translate}}
      </button>

      <button mat-menu-item type="button" (click)="openValidationDialog()">
        <mat-icon flIcon="validated"></mat-icon>
        {{'biox.validate_experiment' | translate}}
      </button>

      <button mat-menu-item type="button" (click)="resetExperiment()">
        <mat-icon>restart_alt</mat-icon>
        {{'biox.reset_experiment' | translate}}
      </button>
    </ng-container>

    <button mat-menu-item type="button" (click)="openTagsFormDialog()">
      <mat-icon>local_offer</mat-icon>
      {{'tags' | translate}}
    </button>

    <button mat-menu-item type="button" (click)="openDuplicateConfirmation()">
      <mat-icon>content_copy</mat-icon>
      {{'biox.clone_experiment' | translate}}
    </button>

    <button mat-menu-item [matMenuTriggerFor]="monitoring">
      <mat-icon>troubleshoot</mat-icon>
      {{'biox.experiment_monitoring' | translate}}
    </button>

    <button mat-menu-item type="button" (click)="removeExperimentFromQueue()"
            class="g-warn-text" *ngIf="experiment.status.value === 'IN_QUEUE'">
      <mat-icon color="warn">stop</mat-icon>
      {{'biox.remove_experiment_from_queue' | translate}}
    </button>

    <button mat-menu-item type="button" (click)="deleteExperiment()"
            *ngIf="experiment.isEditable()">
      <mat-icon color="warn">delete</mat-icon>
      <span class="g-warn-text">{{'biox.delete_experiment' | translate}}</span>
    </button>

  </mat-menu>

  <!-- Monitoring menu -->
  <mat-menu #monitoring>
    <button mat-menu-item type="button" (click)="openProgressInformation()">
      <mat-icon>description</mat-icon>
      {{'biox.node_progress_detail' | translate}}
    </button>

    <button mat-menu-item type="button" (click)="openProcessLogs(experiment)">
      <mat-icon>description</mat-icon>
      {{'biox.view_process_logs' | translate}}
    </button>

    <button mat-menu-item type="button" (click)="openProcessMonitor(experiment)">
      <mat-icon>troubleshoot</mat-icon>
      {{'biox.view_process_monitoring' | translate}}
    </button>
  </mat-menu>


</div>

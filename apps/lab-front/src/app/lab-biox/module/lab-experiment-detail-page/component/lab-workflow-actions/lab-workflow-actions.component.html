<div fxLayout="row wrap" fxLayoutGap="1em">

  <!-- Add object button  -->
  <button mat-icon-button type="button"
          [matTooltip]="'biox.add_object' | translate" matTooltipPosition="below"
          [matMenuTriggerFor]="addObject">
    <mat-icon>add</mat-icon>
  </button>


  <button mat-icon-button type="button"
          [matTooltip]="'biox.experiment_save' | translate" matTooltipPosition="below"
           (click)="save()" [disabled]="isLoading">
    <mat-icon>save</mat-icon>
    <fl-button-loader *ngIf="saveIsLoading"></fl-button-loader>
  </button>

  <button mat-icon-button type="button" (click)="start()"
          [matTooltip]="'biox.experiment_start' | translate" matTooltipPosition="below"
          [disabled]="isLoading">
    <mat-icon>play_arrow</mat-icon>
    <fl-button-loader *ngIf="startIsLoading"></fl-button-loader>
  </button>
</div>


<!-- Add object menu -->
<mat-menu #addObject="matMenu">
  <button mat-menu-item (click)="addProcess()" type="button">
    <mat-icon>developer_board</mat-icon>
    {{'biox.add_process' | translate}}
  </button>
  <button mat-menu-item (click)="addInterface()" type="button">
    <mat-icon>login</mat-icon>
    {{'biox.interface' | translate}}
  </button>
  <button mat-menu-item (click)="addOuterface()" type="button">
    <mat-icon>logout</mat-icon>
    {{'biox.outerface' | translate}}</button>
</mat-menu>

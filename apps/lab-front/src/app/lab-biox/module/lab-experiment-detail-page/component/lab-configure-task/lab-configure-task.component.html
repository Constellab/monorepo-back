<form (ngSubmit)="submit()" id="process-config-form" [formGroup]="formGp" class="form"
      fxLayout="column">
  <div fxFlex="auto">
    <lab-configure-specs-form [configData]="task.config"></lab-configure-specs-form>
  </div>

  <div class="g-centered">
    <button mat-flat-button color="primary" type="submit">
      <mat-icon>save</mat-icon>
      <span>{{'save' | translate}}</span>
    </button>
  </div>
</form>

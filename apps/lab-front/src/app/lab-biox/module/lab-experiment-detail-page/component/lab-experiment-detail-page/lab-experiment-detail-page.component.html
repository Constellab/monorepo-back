<mat-drawer-container class="g-page-fixed page" [hasBackdrop]="false">

  <!-- content of the page -->
  <mat-drawer-content fxFlex="auto">
    <fl-async-section [object]="experiment$" fxFlex="auto" class="section">

      <ng-container *flSectionBody="let experiment">
        <div fxLayout="column" class="g-full-height">

          <lab-experiment-detail-header class="g-card-background"></lab-experiment-detail-header>

          <mat-tab-group fxFlex="auto" class="g-mat-tab-full-height g-mat-tab-header-card-background"
                         [(selectedIndex)]="selectedTabIndex" (selectedIndexChange)="tabIndexChange($event)">
            <mat-tab [label]="'biox.experiment_detail' | translate">
              <lab-experiment-detail></lab-experiment-detail>
            </mat-tab>

            <mat-tab [label]="'biox.experiment_workflow' | translate">
              <ng-template matTabContent>
                <!--    Workflow of experiment      -->
                <lab-workflow></lab-workflow>
              </ng-template>
            </mat-tab>
          </mat-tab-group>


        </div>
      </ng-container>

    </fl-async-section>
  </mat-drawer-content>

  <mat-drawer mode="over" position="end" class="drawer">
    <lab-workflow-drawer-action></lab-workflow-drawer-action>
  </mat-drawer>

</mat-drawer-container>

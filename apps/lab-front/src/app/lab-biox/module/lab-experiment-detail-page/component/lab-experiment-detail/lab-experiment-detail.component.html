<fl-article-container class="g-full-height container" *ngIf="experiment$| async as experiment">

  <!-- Technical information -->
  <fl-article-left-side>

    <!--  Tags  -->
    <div fxLayout="row">
      <fl-tag-list fxFlex="auto" [tags]="experiment.tags" [showNoTagMessage]="true"></fl-tag-list>
      <button mat-icon-button type="button" class="g-button-icon-small"
              (click)="openTagsFormDialog()">
        <mat-icon>edit</mat-icon>
      </button>
    </div>

    <!--  Project  -->
    <fl-text-icon *ngIf="experiment.project" class="separator">
      <mat-icon flIcon="project"></mat-icon>
      <lab-project-inline [project]="experiment.project"></lab-project-inline>
    </fl-text-icon>

    <!--  Type  -->
    <fl-text-icon class="separator">
      <mat-icon flIcon="experiment"></mat-icon>
      <fl-key-value>
        <fl-key>{{'biox.experiment_type' | translate}}</fl-key>
        {{experiment.type.name | translate}}
      </fl-key-value>
    </fl-text-icon>

    <!--  Validated info  -->
    <lab-object-validation-info class="separator" [object]="experiment"
                                *ngIf="experiment.isValidated"></lab-object-validation-info>

    <!--  Sync info  -->
    <lab-object-sync-info class="separator" [object]="experiment" *ngIf="experiment.isSynced"></lab-object-sync-info>

    <!--  Created by & Last modified bt  -->
    <p class="g-text-small g-text-light separator">
      <fl-creation-info [user]="experiment.createdBy"
                        [date]="experiment.createdAt"></fl-creation-info>
    </p>
    <p class="g-text-small g-text-light">
      <fl-last-modification-info [user]="experiment.lastModifiedBy"
                                 [date]="experiment.lastModifiedAt"></fl-last-modification-info>
    </p>


  </fl-article-left-side>

  <fl-article>
    <fl-text-editor [config]="textEditorConfig"
                    [(ngModel)]="description" mode="JSON" [disabled]="experiment.isValidated" class="text-editor"
                    [placeholder]="'biox.experiment_description_placeholder' | translate"
                    (textChange)="onDescriptionChanged($event)"></fl-text-editor>
  </fl-article>

  <fl-article-right-side>

    <fl-card>
      <fl-card-body>
        <lab-experiment-associated-reports [experimentId]="experiment.id"></lab-experiment-associated-reports>
      </fl-card-body>
    </fl-card>
  </fl-article-right-side>
</fl-article-container>

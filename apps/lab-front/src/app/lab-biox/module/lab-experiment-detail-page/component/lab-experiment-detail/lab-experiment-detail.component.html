<fl-article-container class="g-full-height container" *ngIf="experiment$| async as experiment">

  <!-- Technical information -->
  <fl-article-left-side>

    <!--  Tags  -->
    <div fxLayout="row">
      <fl-tag-list fxFlex="auto" [tags]="experiment.tags" [showNoTagMessage]="true"></fl-tag-list>
      <button mat-icon-button type="button" class="g-button-icon-small"
              (click)="openTagsFormDialog()">
        <mat-icon>edit</mat-icon>
      </button>
    </div>

    <!--  Project  -->
    <div *ngIf="experiment.project" class="separator">
      {{'biox.project' | translate}} : <span class="g-text-light">{{experiment.project.title | translate}}</span>
    </div>

    <!--  Type  -->
    <div class="separator">
      {{'biox.experiment_type' | translate}} : <span class="g-text-light">{{experiment.type.name | translate}}</span>
    </div>

    <!--  Validated info  -->
    <p class="separator" *ngIf="experiment.validatedBy">
      {{'validated_by' | translate}} {{experiment.validatedBy.fullname}}
    </p>
    <p *ngIf="experiment.validatedAt" [matTooltip]="experiment.validatedAt | flDate:'D HH:mm'">
      {{'validated_on' | translate}} {{experiment.validatedAt | flDate}}
    </p>

    <!--  Created by & Last modified bt  -->
    <p class="g-text-small g-text-light separator">
      <fl-creation-info [createdBy]="experiment.createdBy.fullname"
                        [createdAt]="experiment.createdAt"></fl-creation-info>
    </p>
    <p class="g-text-small g-text-light">
      <fl-last-modification-info [lastModifiedBy]="experiment.lastModifiedBy.fullname"
                                 [lastModifiedAt]="experiment.lastModifiedAt"></fl-last-modification-info>
    </p>
  </fl-article-left-side>

  <fl-article>
    <fl-text-editor [config]="textEditorConfig"
                    [(ngModel)]="description" mode="JSON" [disabled]="experiment.isValidated" class="text-editor"
                    [placeholder]="'biox.experiment_description_placeholder' | translate"
                    (textChange)="onDescriptionChanged($event)"></fl-text-editor>
  </fl-article>

  <fl-article-right-side>

    <lab-experiment-associated-reports [experimentId]="experiment.id"></lab-experiment-associated-reports>
  </fl-article-right-side>
</fl-article-container>

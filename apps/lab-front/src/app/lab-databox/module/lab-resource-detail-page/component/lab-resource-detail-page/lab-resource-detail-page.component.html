<fl-async-section [object]="resource$" class="g-page-fixed page" fxLayout="column">

  <ng-container *flSectionBody="let resource">

    <!--  Use an embed section to show header once the resource is loaded  -->
    <fl-section fxFlex="auto" [object]="resource" class="section">

      <fl-section-header class="header">
        <h2 class="header-title">{{resource.name}} |
          <span class="g-text-light">{{fullScreenViewName}}</span>
        </h2>

        <fl-section-actions>
          <button mat-stroked-button type="button" *ngIf="resource.isImportable"
                  (click)="openImportResource()" class="button g-button-small">
            <mat-icon>system_update_alt</mat-icon>
            {{'biox.import_resource' | translate}}
          </button>

          <button mat-stroked-button type="button"
                  (click)="openViewSpecs($event)" class="button g-button-small">
            <mat-icon>visibility</mat-icon>
            {{'biox.view_specs' | translate}}
          </button>

          <button mat-stroked-button type="button"
                  (click)="openTransformerResource()" class="button g-button-small">
            <mat-icon>move_down</mat-icon>
            {{'biox.transformers' | translate}}
          </button>

          <button mat-stroked-button type="button" *ngIf="resource.isDownloadable()"
                  (click)="downloadFile()" class="button g-button-small">
            <mat-icon>cloud_download</mat-icon>
            <span>{{'biox.file_resource_download' | translate}}</span>
          </button>

          <button mat-stroked-button type="button"
                  (click)="openTagFormDialog()" class="button g-button-small">
            <mat-icon>local_offer</mat-icon>
            {{'tags' | translate}}
          </button>

          <a mat-stroked-button type="button" *ngIf="resource.experimentId"
             [routerLink]="resource.experimentId | labDetailRoute:'experiment'"
             class="button g-button-small">
            <mat-icon flIcon="experiment"></mat-icon>
            {{'experiment' | translate}}
          </a>
        </fl-section-actions>
      </fl-section-header>


      <ng-container *flSectionBody="let resource">

        <!--  Header    -->
        <div class="page-padding body">
          <lab-resource-view *ngIf="fullScreenView" [view]="fullScreenView"
                             [fullscreen]="true"></lab-resource-view>
          <div *ngIf="showLoader" class="g-text-centered">
            <fl-loader size="medium"></fl-loader>
          </div>
        </div>
      </ng-container>

    </fl-section>

  </ng-container>

</fl-async-section>

<div class="g-page">
  <fl-async-section fxFlex="auto" [object]="report$">

    <ng-container *flSectionBody="let report">

      <div fxLayout="row" fxLayoutAlign="start center">
        <mat-icon [matTooltip]="'biox.report_validated' | translate"
                  class="g-icon-big verified-icon" *ngIf="report.isValidated">verified
        </mat-icon>
        <h2 fxFlex="auto">{{report.title}}</h2>

        <div *ngIf="!report.isValidated">
          <button mat-icon-button type="button" [matTooltip]="'biox.save_report_content' | translate"
                  (click)="saveReportContent()">
            <mat-icon>save</mat-icon>
            <fl-button-loader *ngIf="saveContentIsLoading" size="small"></fl-button-loader>
          </button>

          <button mat-icon-button type="button" [matTooltip]="'biox.update_report' | translate"
                  (click)="updateReport()">
            <mat-icon>edit</mat-icon>
          </button>

          <button mat-icon-button type="button" [matTooltip]="'biox.validate_report' | translate"
                  (click)="validate()">
            <mat-icon>verified</mat-icon>
          </button>

          <button mat-icon-button type="button" [matTooltip]="'biox.delete_report' | translate"
                  color="warn" (click)="delete()">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </div>

      <!--   Content   -->
      <div fxFlex="auto" class="g-full" fxLayout="row">
        <div class="report-side">

        </div>

        <fl-text-editor fxFlex="auto" [(ngModel)]="content" mode="JSON"
                        [disabled]="report.isValidated" class="g-max-article-width g-full-height"
                        [placeholder]="'biox.report_placeholder' | translate"></fl-text-editor>
        <div class="report-side experiments">
          <lab-report-associated-experiments></lab-report-associated-experiments>
        </div>
      </div>


    </ng-container>
  </fl-async-section>
</div>

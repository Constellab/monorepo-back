<div class="g-page">
  <fl-async-section fxFlex="auto" [object]="report$">

    <ng-container *flSectionBody="let report">

      <div fxLayout="row" fxLayoutAlign="start center">
        <mat-icon [matTooltip]="'biox.report_validated' | translate"
                  class="g-icon-big verified-icon" *ngIf="report.isValidated"
                  flIcon="validated">
        </mat-icon>
        <h2 fxFlex="auto">{{report.title}}</h2>

        <lab-sync-object-button [object]="report" [syncObjectFunc]="syncObjectFunc"
                                additionalConfirmText="biox.sync_report_confirmation"
                                (objectUpdate)="onReportUpdate($event)" class="g-print-hide">
        </lab-sync-object-button>

        <div *ngIf="!report.isValidated" class="g-print-hide">
          <button mat-icon-button type="button" [matTooltip]="'biox.update_report' | translate"
                  (click)="updateReport()">
            <mat-icon>edit</mat-icon>
          </button>

          <button mat-icon-button type="button" [matTooltip]="'biox.validate_report' | translate"
                  (click)="validate()">
            <mat-icon flIcon="validated"></mat-icon>
          </button>

          <button mat-icon-button type="button" [matTooltip]="'biox.print_report' | translate"
                  (click)="printReport()">
            <mat-icon>print</mat-icon>
          </button>


          <button mat-icon-button type="button" [matTooltip]="'biox.delete_report' | translate"
                  color="warn" (click)="delete()">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </div>

      <!--   Content   -->
      <fl-article-container>
        <fl-article-left-side>

          <!--  Project  -->
          <fl-text-icon *ngIf="report.project" class="separator">
            <mat-icon flIcon="project"></mat-icon>
            <fl-key-value>
              <fl-key>{{'biox.project' | translate}}</fl-key>
              {{report.project.title | translate}}
            </fl-key-value>
          </fl-text-icon>

          <!--  Validated info  -->
          <lab-object-validation-info class="separator" [object]="report"
                                      *ngIf="report.isValidated"></lab-object-validation-info>

          <!--  Sync info  -->
          <lab-object-sync-info class="separator" [object]="report" *ngIf="report.isSynced"></lab-object-sync-info>


          <!--  Created by & Last modified bt  -->
          <p class="g-text-small g-text-light separator">
            <fl-creation-info [user]="report.createdBy"
                              [date]="report.createdAt"></fl-creation-info>
          </p>
          <p class="g-text-small g-text-light">
            <fl-last-modification-info [user]="report.lastModifiedBy"
                                       [date]="report.lastModifiedAt"></fl-last-modification-info>
          </p>
        </fl-article-left-side>
        <fl-article>
          <fl-text-editor [(ngModel)]="content" mode="JSON" [disabled]="report.isValidated"
                          class="g-full-height g-print-section"
                          (textChange)="onContentUpdate($event)" [config]="textEditorConfig"
                          [placeholder]="'biox.report_placeholder' | translate" [autoFocus]="true"></fl-text-editor>
        </fl-article>
        <fl-article-right-side class="experiments">

          <fl-card>
            <fl-card-body>
              <lab-report-associated-experiments></lab-report-associated-experiments>
            </fl-card-body>
          </fl-card>
        </fl-article-right-side>
      </fl-article-container>


    </ng-container>
  </fl-async-section>
</div>

<div class="g-page">
  <fl-async-section fxFlex="auto" [object]="report$">

    <ng-container *flSectionBody="let report">

      <div fxLayout="row" fxLayoutAlign="start center">
        <mat-icon [matTooltip]="'biox.report_validated' | translate"
                  class="g-icon-big verified-icon" *ngIf="report.isValidated">verified
        </mat-icon>
        <h2 fxFlex="auto">{{report.title}}</h2>

        <div *ngIf="!report.isValidated">
          <button mat-icon-button type="button" [matTooltip]="'biox.update_report' | translate"
                  (click)="updateReport()">
            <mat-icon>edit</mat-icon>
          </button>

          <button mat-icon-button type="button" [matTooltip]="'biox.validate_report' | translate"
                  (click)="validate()">
            <mat-icon>verified</mat-icon>
          </button>

          <button mat-icon-button type="button" [matTooltip]="'biox.delete_report' | translate"
                  color="warn" (click)="delete()">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </div>

      <!--   Content   -->
      <fl-article-container fxFlex="auto">
        <fl-article-left-side>
          <!--  Project  -->
          <div *ngIf="report.project" class="separator">
            {{'biox.project' | translate}} : <span class="g-text-light">{{report.project.title | translate}}</span>
          </div>

          <!--  Created by & Last modified bt  -->
          <p class="g-text-small g-text-light separator">
            <fl-creation-info [createdBy]="report.createdBy.fullname"
                              [createdAt]="report.createdAt"></fl-creation-info>
          </p>
          <p class="g-text-small g-text-light">
            <fl-last-modification-info [lastModifiedBy]="report.lastModifiedBy.fullname"
                                       [lastModifiedAt]="report.lastModifiedAt"></fl-last-modification-info>
          </p>
        </fl-article-left-side>
        <fl-article>
          <fl-text-editor [(ngModel)]="content" mode="JSON" [disabled]="report.isValidated" class="g-full-height"
                          (textChange)="onContentUpdate($event)"
                          [placeholder]="'biox.report_placeholder' | translate" [autoFocus]="true"></fl-text-editor>
        </fl-article>
        <fl-article-right-side class="experiments">
          <lab-report-associated-experiments></lab-report-associated-experiments>
        </fl-article-right-side>
      </fl-article-container>


    </ng-container>
  </fl-async-section>
</div>

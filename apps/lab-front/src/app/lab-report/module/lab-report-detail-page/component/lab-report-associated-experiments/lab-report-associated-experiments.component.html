<fl-async-section [arrayObs]="experiments" emptyText="biox.no_report_associated_experiment">

  <fl-section-header>
    <fl-text-icon>
      <mat-icon flIcon="experiment"></mat-icon>
      <h3>{{'biox.report_associated_experiment' | translate}}</h3>
    </fl-text-icon>

    <fl-section-actions *ngIf="canEdit">
      <button mat-icon-button type="button" [matTooltip]="'biox.report_associate_experiment' | translate"
              (click)="associateExperiment()">
        <mat-icon>add</mat-icon>
      </button>
    </fl-section-actions>

  </fl-section-header>

  <ng-container *flSectionBody>
    <lab-experiment-table [datasource]="experiments" [columns]="columns"
                          (experimentDisassociate)="disassociateExperiment($event)"></lab-experiment-table>
  </ng-container>
</fl-async-section>

<fl-section [object]="experiments" [isLoading]="isLoading" emptyText="biox.no_report_associated_experiment">

  <fl-section-header>
    <h3>{{'biox.report_associated_experiment' | translate}}</h3>

    <fl-section-actions *ngIf="canEdit">
      <button mat-icon-button type="button" [matTooltip]="'biox.report_associate_experiment' | translate"
              (click)="associateExperiment()">
        <mat-icon>add</mat-icon>
      </button>
    </fl-section-actions>

  </fl-section-header>

  <ng-container *flSectionBody>
    <div>
      <div *ngFor="let experiment of experiments; let index = index" fxLayout="row" fxLayoutAlign="start center"
           class="g-full">
        <fl-text-icon fxFlex="auto">
          <mat-icon [matTooltip]="'biox.experiment_validated' | translate" *ngIf="experiment.isValidated">verified
          </mat-icon>
          <a [routerLink]="experiment | labDetailRoute" class="g-text-link">
            {{experiment.title}}
          </a>
        </fl-text-icon>
        <button mat-icon-button type="button" (click)="disassociateExperiment(experiment, index)"
                [matTooltip]="'biox.report_disassociate_experiment' | translate"
                *ngIf="canEdit">
          <mat-icon>clear</mat-icon>
        </button>
      </div>
    </div>
  </ng-container>
</fl-section>

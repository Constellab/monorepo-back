# Unit + E2E suites of one app, plus the shared libs both apps import.
#
# The E2E suites boot the whole Nest app in-process (Test.createTestingModule + supertest)
# against a real MariaDB and a real Redis, so CI needs those two services — not a deployed
# environment. They come from compose.test.yml, the same file developers run locally, which
# is what keeps "green on my laptop" and "green in CI" the same statement.
#
# Called by the release workflows so a tag that fails its suites never produces an image.
name: Tests

on:
  workflow_call:
    inputs:
      app_name:
        description: Only used to label the job in the checks list.
        required: true
        type: string
      test_script:
        description: package.json script to run, e.g. cn-space-api:test-ci.
        required: true
        type: string

jobs:
  tests:
    name: ${{ inputs.app_name }}
    runs-on: ubuntu-latest
    # The E2E suites are serial by construction (maxWorkers: 1 — every suite drops and
    # re-synchronizes the same schema), so they are slow by design. The timeout is a
    # hung-connection backstop, not a performance target.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      # --frozen-lockfile: CI must install what bun.lock says and fail otherwise, rather
      # than silently resolving a newer dependency than the one the tests were written for.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # --wait blocks on the healthchecks declared in the compose file, so the first
      # connection the tests make is not a race against MariaDB's initialization.
      - name: Start the test databases and redis
        run: bun run test-db:up

      - name: Run the tests
        run: bun run ${{ inputs.test_script }}

      # A failing E2E suite usually says "connection refused" and nothing else; the
      # container logs are where the actual reason is.
      - name: Dump the container logs
        if: failure()
        run: docker compose -f compose.test.yml logs --tail=200

      - name: Stop the test databases and redis
        if: always()
        run: bun run test-db:down

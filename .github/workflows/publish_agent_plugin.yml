name: Publish an agent plugin

# Reusable: publishes one Claude Code plugin folder into the public Constellab/agent-plugins
# repository. Each application calls it from its own workflow, on its own release tag.
#
# The tag, not master, is the trigger every caller uses: the skills describe MCP tools, so
# publishing from master would hand clients a skill naming tools that no deployed API answers.
#
# A tag builds and pushes the image; the CapRover deploy is a separate manual step. So a
# plugin can reach clients shortly before the API that serves its tools does.

on:
  workflow_call:
    inputs:
      plugin_dir:
        description: Path of the plugin folder in this repository, without a trailing slash.
        required: true
        type: string
      plugin_name:
        description: Folder name under plugins/ in the public repository. Must match `name` in plugin.json.
        required: true
        type: string
      tag_prefix:
        description: Release tag prefix that authorizes publishing this plugin, e.g. `cn_`.
        required: true
        type: string
    secrets:
      agent_plugins_token:
        required: true

env:
  PLUGIN_DIR: ${{ inputs.plugin_dir }}
  PLUGIN_NAME: ${{ inputs.plugin_name }}
  PUBLIC_REPO: Constellab/agent-plugins

jobs:
  # Runs on pull requests too: a manifest that fails to load is only visible to whoever
  # installs it, so it has to be caught before the tag, not at publish time.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      # The folder name under plugins/ is what `/plugin install <name>@constellab` resolves,
      # and it comes from the caller while `name` comes from the manifest. Nothing downstream
      # compares them, so a mismatch would publish a plugin nobody can install by its own name.
      - name: Check the plugin name matches its manifest
        run: |
          set -euo pipefail
          manifest_name=$(jq -r .name "$PLUGIN_DIR/.claude-plugin/plugin.json")
          if [ "$manifest_name" != "$PLUGIN_NAME" ]; then
            echo "::error::plugin_name is '$PLUGIN_NAME' but $PLUGIN_DIR/.claude-plugin/plugin.json" \
                 "declares '$manifest_name'. They have to match."
            exit 1
          fi

      # --strict turns manifest warnings into errors, which is what catches a misspelled
      # field name that would otherwise be ignored at runtime.
      - name: Validate the plugin manifest
        run: bunx @anthropic-ai/claude-code plugin validate "$PLUGIN_DIR" --strict

      # The version guard runs here, on the pull request, and not only at publish time: a tag
      # that fails it has already been cut, so the release turns red over a bump that cost one
      # line while the change was still under review. Comparing against the published copy is
      # what makes this answerable before the tag exists.
      - name: Check out the public plugins repository
        uses: actions/checkout@v6.0.2
        with:
          repository: ${{ env.PUBLIC_REPO }}
          token: ${{ secrets.agent_plugins_token }}
          path: public

      - name: Check the version was bumped for the change
        run: bash .github/scripts/check_plugin_version.sh "$PLUGIN_DIR" "public/plugins/$PLUGIN_NAME"

  publish:
    needs: validate
    if: startsWith(github.ref, format('refs/tags/{0}', inputs.tag_prefix)) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Check out the public plugins repository
        uses: actions/checkout@v6.0.2
        with:
          repository: ${{ env.PUBLIC_REPO }}
          token: ${{ secrets.agent_plugins_token }}
          path: public

      # Already enforced on the pull request; repeated here as the last gate for
      # workflow_dispatch and for a tag that never passed through one. It also exports
      # PLUGIN_VERSION for the commit message below.
      - name: Refuse a change that did not bump the version
        run: bash .github/scripts/check_plugin_version.sh "$PLUGIN_DIR" "public/plugins/$PLUGIN_NAME"

      - name: Copy the plugin as reviewed
        run: |
          set -euo pipefail
          rm -rf "public/plugins/$PLUGIN_NAME"
          mkdir -p public/plugins
          cp -r "$PLUGIN_DIR" "public/plugins/$PLUGIN_NAME"

      # `git add` is scoped to this plugin's folder, not `-A`: another application publishes
      # its own plugin into the same repository, and a wide add would sweep its in-flight
      # commit into this one. The rebase retry is for the same reason — two releases on the
      # same day collide on the default branch.
      - name: Commit and push
        working-directory: public
        run: |
          set -euo pipefail
          git config user.name "constellab-bot"
          git config user.email "support@gencovery.com"
          git add "plugins/$PLUGIN_NAME"
          if git diff --quiet --cached; then
            echo "Nothing changed in $PLUGIN_NAME — already published."
            exit 0
          fi
          git commit -m "$PLUGIN_NAME $PLUGIN_VERSION"
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed, retrying"
            sleep 5
          done
          echo "::error::Could not push to $PUBLIC_REPO after 3 attempts"
          exit 1

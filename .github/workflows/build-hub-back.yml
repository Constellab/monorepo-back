name: Main Workflow hub back

on:
  push:
    tags:
      - 'hn_*'

jobs:
  build_and_push_image:
    uses: ./.github/workflows/build_github_package.yml
    with:
      registry: ghcr.io
      image_name: ghcr.io/constellab/community-back
      github_ref: ${{ github.ref }}
      tag_prefix: hn_
      dockerfile_path: ./apps/hn-hub/Dockerfile
    secrets:
      registry_username: ${{ github.actor }}
      registry_password: ${{ secrets.GITHUB_TOKEN }}


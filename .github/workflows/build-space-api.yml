name: Main Workflow space back

on:
  push:
    tags:
      - 'cn_*'

jobs:
  # The suites run against the tagged commit before anything is published: an image that
  # is already in the registry is one somebody can deploy, so a red suite has to stop it
  # here rather than be noticed afterwards.
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      app_name: cn-space-api
      test_script: cn-space-api:test-ci

  build_and_push_image:
    needs: tests
    uses: ./.github/workflows/build_github_package.yml
    with:
      registry: ghcr.io
      image_name: ghcr.io/constellab/space-api
      tag_prefix: cn_
      dockerfile_path: ./apps/cn-space-api/Dockerfile
    secrets:
      registry_username: ${{ github.actor }}
      registry_password: ${{ secrets.GITHUB_TOKEN }}

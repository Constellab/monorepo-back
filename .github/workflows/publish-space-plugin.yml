name: Publish the space plugin

# Publishes apps/cn-space-api/claude-plugin/space into Constellab/agent-plugins.
#
# `cn_*` is the Space API's release tag: the plugin's skill names MCP tools served by that
# API, so it publishes when the API carrying them is released, never on a merge to master.

on:
  push:
    tags:
      - 'cn_*'
  pull_request:
    paths:
      - 'apps/cn-space-api/claude-plugin/**'
      - '.claude-plugin/**'
      # The API serves the commands that install this plugin, from constants that repeat what
      # the manifest declares. `check_constants` below is what keeps the two equal, so an edit
      # to this file has to reach it — without this path it only runs when the plugin moves,
      # which is the half of the drift it cannot see.
      - 'apps/cn-space-api/src/app/cn-mcp/cn-mcp.constants.ts'
      - '.github/scripts/check_plugin_constants.sh'
      - '.github/workflows/publish-space-plugin.yml'
      - '.github/workflows/publish_agent_plugin.yml'
  workflow_dispatch:

jobs:
  # Its own job rather than a step of `publish`: a job that calls a reusable workflow with
  # `uses` cannot carry steps of its own.
  check_constants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Check the API constants match the plugin manifest
        run: |
          bash .github/scripts/check_plugin_constants.sh \
            apps/cn-space-api/claude-plugin/space/.claude-plugin/plugin.json \
            apps/cn-space-api/src/app/cn-mcp/cn-mcp.constants.ts \
            CN_MCP_PLUGIN_NAME \
            CN_MCP_PLUGIN_API_URL_CONFIG_KEY \
            CN_MCP_SPACE_API_RESOURCE_PATH

  # Gated on the constants check: a release must not publish a plugin whose manifest disagrees
  # with the API serving its install commands, since the two only meet in a user's terminal.
  publish:
    needs: check_constants
    uses: ./.github/workflows/publish_agent_plugin.yml
    with:
      plugin_dir: apps/cn-space-api/claude-plugin/space
      plugin_name: space
      tag_prefix: cn_
    secrets:
      agent_plugins_token: ${{ secrets.AGENT_PLUGINS_TOKEN }}

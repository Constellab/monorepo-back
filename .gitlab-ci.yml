image: docker:latest
services:
  - docker:dind

variables:
  DOCKER_DRIVER: overlay2
  GIT_DEPTH: 0
  LAB_FRONT_IMAGE: lab-front
  CA_IMAGE: central-front
  CN_IMAGE: central-back
  HA_IMAGE: community-front
  HN_IMAGE: community-back

stages:
  - build-lab
  - build-central-front
  - build-central-back
  - build-hub-front
  - build-hub-back

# Build lab front
build-lab:
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  stage: build-lab
  script:
    # retrieve version number from tag ex : lab_1.0.0
    - export VERSION=$(echo $CI_COMMIT_TAG | cut -d'_' -f2)
    # Build the docker image from Dockerfile with the latest tag and a tag for the version
    - docker build --tag $CI_REGISTRY_IMAGE/$LAB_FRONT_IMAGE:$VERSION --tag $CI_REGISTRY_IMAGE/$LAB_FRONT_IMAGE:latest -f apps/lab-front/Dockerfile .
    # Push both image in the registry
    - docker push $CI_REGISTRY_IMAGE/$LAB_FRONT_IMAGE:$VERSION
    - docker push $CI_REGISTRY_IMAGE/$LAB_FRONT_IMAGE:latest
  only:
    - /lab_.*/

# Build central front
build-central-front:
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  stage: build-central-front
  script:
    # retrieve version number from tag ex : ca_1.0.0
    - export VERSION=$(echo $CI_COMMIT_TAG | cut -d'_' -f2)
    # Build the docker image from Dockerfile with the latest tag and a tag for the version
    - docker build --tag $CI_REGISTRY_IMAGE/$CA_IMAGE:$VERSION --tag $CI_REGISTRY_IMAGE/$CA_IMAGE:latest -f apps/ca-central-front/Dockerfile .
    # Push both image in the registry
    - docker push $CI_REGISTRY_IMAGE/$CA_IMAGE:$VERSION
    - docker push $CI_REGISTRY_IMAGE/$CA_IMAGE:latest
  only:
    - /ca_.*/


# Build central back
build-central-back:
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  stage: build-central-back
  script:
    # retrieve version number from tag ex : cn_1.0.0
    - export VERSION=$(echo $CI_COMMIT_TAG | cut -d'_' -f2)
    # Build the docker image from Dockerfile with the latest tag and a tag for the version
    - docker build --tag $CI_REGISTRY_IMAGE/$CN_IMAGE:$VERSION --tag $CI_REGISTRY_IMAGE/$CN_IMAGE:latest -f apps/cn-central-back/Dockerfile .
    # Push both image in the registry
    - docker push $CI_REGISTRY_IMAGE/$CN_IMAGE:$VERSION
    - docker push $CI_REGISTRY_IMAGE/$CN_IMAGE:latest
  only:
    - /cn_.*/

# Build hub front
build-hub-front:
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  stage: build-hub-front
  script:
    # retrieve version number from tag ex : ha_1.0.0
    - export VERSION=$(echo $CI_COMMIT_TAG | cut -d'_' -f2)
    # Build the docker image from Dockerfile with the latest tag and a tag for the version
    - docker build --tag $CI_REGISTRY_IMAGE/$HA_IMAGE:$VERSION --tag $CI_REGISTRY_IMAGE/$HA_IMAGE:latest -f apps/ha-hub/Dockerfile .
    # Push both image in the registry
    - docker push $CI_REGISTRY_IMAGE/$HA_IMAGE:$VERSION
    - docker push $CI_REGISTRY_IMAGE/$HA_IMAGE:latest
  only:
    - /ha_.*/

# Build hub back
build-hub-back:
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  stage: build-hub-back
  script:
    - docker pull $CI_REGISTRY_IMAGE/$HA_IMAGE:latest
    # retrieve version number from tag ex : hn_1.0.0
    - export VERSION=$(echo $CI_COMMIT_TAG | cut -d'_' -f2)
    # Build the docker image from Dockerfile with the latest tag and a tag for the version
    - docker build --tag $CI_REGISTRY_IMAGE/$HN_IMAGE:$VERSION --cache-from $CI_REGISTRY_IMAGE/$HA_IMAGE:latest --tag $CI_REGISTRY_IMAGE/$HN_IMAGE:latest -f apps/hn-hub/Dockerfile .
    # Push both image in the registry
    - docker push $CI_REGISTRY_IMAGE/$HN_IMAGE:$VERSION
    - docker push $CI_REGISTRY_IMAGE/$HN_IMAGE:latest
  only:
    - /hn_.*/

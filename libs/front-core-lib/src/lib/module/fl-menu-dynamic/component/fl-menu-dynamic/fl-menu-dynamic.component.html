<mat-menu [overlapTrigger]="true" [hasBackdrop]="hasBackdrop">
  <div [ngClass]="containerClass">
    <ng-container *ngFor="let item of menuItems">
      <mat-divider *ngIf="item.divider"></mat-divider>

      <!-- Handle branch node menu items -->
      <span *ngIf="item.type === 'button' && item.children?.length > 0 ; else leaf">
      <button mat-menu-item [matMenuTriggerFor]="subMenu.menu" (click)="callItem(item, $event)"
              [disabled]="item.disabled">
        <mat-icon *ngIf="item.icon" [flIcon]="item.icon"></mat-icon>
        {{item.text | flTranslatableText}}
      </button>
      <fl-menu-dynamic #subMenu [menuItems]="item.children" [hasBackdrop]="hasBackdrop"></fl-menu-dynamic>
    </span>

      <!-- Handle leaf node menu items -->
      <ng-template #leaf>

        <!--    Link    -->
        <a *ngIf="item.type === 'link'" mat-menu-item [routerLink]="item.link">
          <mat-icon *ngIf="item.icon" [flIcon]="item.icon"></mat-icon>
          {{item.text | flTranslatableText}}
        </a>

        <!--    Button    -->
        <button *ngIf="item.type === 'button'" mat-menu-item (click)="callItem(item, $event)"
                [disabled]="item.disabled">
          <mat-icon *ngIf="item.icon" [flIcon]="item.icon"></mat-icon>
          {{item.text | flTranslatableText}}
        </button>
      </ng-template>
    </ng-container>
  </div>
</mat-menu>

<!--<div class="section-border">-->
<fl-section [disableEmptyText]="true">
  <fl-section-header>
    <div>{{config.placeholder}}</div>
    <div class="g-text-small g-text-light" *ngIf="config.hint">{{config.hint}}</div>
    <fl-section-actions>
      <div [matTooltip]="addTooltip">
        <button mat-icon-button type="button" (click)="addGroup()" [disabled]="disableAdd">
          <mat-icon>add</mat-icon>
        </button>
      </div>
    </fl-section-actions>
  </fl-section-header>

  <ng-container *flSectionBody>
    <div *ngIf="hasValue(); else noValue">
      <div *ngFor="let formGp of control.controls; let i = index; let last = last">
        <div fxLayout="row">
          <fl-dynamic-abstract-form [control]="formGp" [config]="config.formGpConfig" fxFlex="auto">
          </fl-dynamic-abstract-form>
          <div>
            <div [matTooltip]="removeTooltip">
              <button mat-icon-button type="button"
                      (click)="removeGroup(i)" [disabled]="disableRemove">
                <mat-icon>clear</mat-icon>
              </button>
            </div>
          </div>
        </div>

        <mat-divider *ngIf="!last"></mat-divider>
      </div>
    </div>

    <ng-template #noValue>
      <div class="g-text-centered">
        <p class="g-text-light">{{'flDynamicField.no_value_in_array' | translate}}</p>
        <button mat-flat-button type="button" color="primary" (click)="addGroup()" class="g-button-small">
          {{'flDynamicField.add_value_in_array' | translate}}
        </button>
      </div>
    </ng-template>
  </ng-container>
</fl-section>

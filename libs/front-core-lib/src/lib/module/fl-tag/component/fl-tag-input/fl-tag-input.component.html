<mat-form-field class="g-full">
  <mat-label>{{label | translate}}</mat-label>
  <mat-chip-list #chipList
                 cdkDropList
                 cdkDropListOrientation="horizontal"
                 (cdkDropListDropped)="dropChip($event)">
    <mat-chip
      *ngFor="let tag of value"
      [flTag]="tag"
      cdkDrag
      [removable]="true"
      (removed)="remove(tag)">
    </mat-chip>
    <mat-chip *ngIf="newTag" [removable]="true" (removed)="removeTempFruit()" class="temp-fruit">{{newTag.key}} :
    </mat-chip>
    <input
      [placeholder]="'flTag.search_tag' | translate"
      #input
      [formControl]="inputCtrl"
      [matAutocomplete]="auto"
      [matChipInputFor]="chipList"
      [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
      (matChipInputTokenEnd)="addUnknownValue($event)" tabindex="0"
      [flInputMaxLength]="maxLength">
  </mat-chip-list>
  <mat-autocomplete #auto="matAutocomplete"
                    (optionSelected)="optionSelected($event)" [autoActiveFirstOption]="true">

    <mat-option *ngFor="let option of filteredOptions | async" [value]="option">
      {{option}}
    </mat-option>

  </mat-autocomplete>

  <mat-hint>{{'flTag.input_helper_text' | translate}}</mat-hint>
</mat-form-field>

<div fxLayout="row" fxLayoutAlign="space-between center" class="g-full-height">

  <div>
    <!--  The text color depend on the background  -->
    <div [ngClass]="{'g-primary-contrast': mode === 'success', 'g-warn-contrast': mode === 'error'}"
         class="message" [innerHTML]="text | flTranslatableText">
    </div>
  </div>

  <button *ngIf="showDetailButton" class="button"
          [ngClass]="{'button-success': mode === 'success', 'button-warn': mode === 'error'}"
          mat-button type="button" (click)="openDetailDialog($event)">
    {{'detail' | translate}}
  </button>

  <button *ngIf="showCloseButton" class="button"
          [ngClass]="{'button-success': mode === 'success', 'button-warn': mode === 'error'}"
          mat-button type="button" (click)="closeSnackBar()">
    {{'ok' | translate}}
  </button>
</div>

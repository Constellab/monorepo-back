<div class="user-icon g-primary-background" [style.height]="sizeNumber+'em'" [style.width]="sizeNumber+'em'"
     [style.line-height]="sizeNumber+'em'" [style.font-size]="fontSize+'em'">
  <img [src]="imgSrc" class="user-icon-image" [style.display]="!(hasPhoto$ | async) ? 'none' : 'block'" />
  <span *ngIf="!(hasPhoto$ | async)">{{ initials }}</span>
</div>

<div class="user-icon g-primary-background"
     [style.height]="circleSize"
     [style.width]="circleSize"
     [style.line-height]="circleSize"
     [style.font-size]="fontSize+'em'"
     [style.border]="border ? '1px solid var(--main-background)' : 'none'">
  <img [src]="imgSrc" class="user-icon-image"
       *ngIf="imgSrc; else noPhoto" [alt]="initials"/>
  <ng-template #noPhoto>
<!--    Necessary to set an image dynamically-->
    <img src="" class="user-icon-image" [style]="{'display': 'none'}"/>

    <span class="g-text-not-selectable">{{ initials }}</span>
  </ng-template>
</div>

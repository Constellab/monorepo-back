<fl-input-search [selectedItem]="selectedUser"
                 (selectedItemChange)="setAndEmitValue($event)"
                 [datasource]="usersDatasource"
                 [placeholder]="placeholder"
                 [required]="required"
                 [disabled]="disabled"
                 (focused)="onFocused($event)">

  <div class="photo" *flInputSearchPrefix="let selectedUser">
    <fl-user-profile-picture *ngIf="selectedUser; else noUser" [user]="selectedUser"
                             size="small"></fl-user-profile-picture>
    <ng-template #noUser>
      <mat-icon>account_circle</mat-icon>
    </ng-template>

  </div>


  <fl-user-inline *flInputSearchOption="let user" [user]="user" [portalOnHover]="false"></fl-user-inline>
</fl-input-search>

<div class="user-info-portal mat-elevation-z5">

  <div class="top-side">
    <div class="user-top-info">
      <div class="fullname">{{user.fullname}}</div>
    </div>
  </div>
  <div class="bot-side">
    <div class="user-bot-info">
      <fl-text-icon>
        <mat-icon>mail</mat-icon>
        <div class="g-text-small email">{{user.email}}</div>
      </fl-text-icon>

      <fl-text-icon iconPosition="start" *ngIf="user.company">
        <mat-icon>space</mat-icon>
        {{user.company}}
      </fl-text-icon>
      <fl-text-icon iconPosition="start" *ngIf="user.activity">
        <mat-icon>badge</mat-icon>
        {{user.activity}}
      </fl-text-icon>
      <a [routerLink]="userRoute" *ngIf="userRoute">
        <button class="button-view-profile g-button-small"  mat-stroked-button color="primary" type="button">
          <fl-text-icon iconPosition="start">
            <mat-icon class="g-button-icon-small">person</mat-icon>
            {{'flUser.view_profile' | translate}}
          </fl-text-icon>
        </button>
      </a>
    </div>
  </div>
  <fl-user-profile-picture [size]="'5.5'" [user]="user" class="profil-picture"></fl-user-profile-picture>
</div>

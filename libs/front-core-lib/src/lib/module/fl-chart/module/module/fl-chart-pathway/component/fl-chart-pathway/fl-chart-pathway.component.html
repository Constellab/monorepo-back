<mat-drawer-container class="g-full-height" [hasBackdrop]="false">

  <!-- Main content with chart -->
  <mat-drawer-content>
    <div class="container" fxLayout="column">

      <div #chart fxFlex="auto"></div>

      <!--    Action bar on the bottom  -->
      <div fxLayout="row" class="action-bar">

        <!--   Slider to hide link     -->
        <div>
          <p class="g-text-small g-text-light">{{'flChart.pathway_link_value_help' | translate}} : {{sliderValue}}</p>
          <mat-slider class="slider"
            [disabled]="drawerState"
            [max]="linksMaxAbsValue"
            [min]="0"
            [step]="1"
            [thumbLabel]="true"
            tickInterval="auto"
            [(ngModel)]="sliderValue"
            (input)="hideLinkLowerThan($event)">
          </mat-slider>
        </div>
      </div>

    </div>


  </mat-drawer-content>

  <mat-drawer mode="over" position="end" [(opened)]="drawerState" (closed)="resetNodeAndLinkOpacity()">
    <fl-chart-pathway-node-detail *ngIf="selectedNode" [node]="selectedNode"></fl-chart-pathway-node-detail>
  </mat-drawer>
</mat-drawer-container>

<div class="drawer" *ngIf="action$ | async as action"
     fxLayout="column">

  <div fxLayout="row" fxLayoutAlign="space-between center" class="header">
    <p>{{action.title}}</p>

    <button mat-icon-button type="button" flDrawerClose tabindex="-1"
            [matTooltip]="'close' | translate">
      <mat-icon>clear</mat-icon>
    </button>
  </div>

  <div class="container" fxFlex="auto" [ngSwitch]="action.action">
    <fl-pathway-config *ngSwitchCase="'config'"></fl-pathway-config>
    <fl-chart-pathway-node-detail *ngSwitchCase="'nodeDetail'" [node]="$any(action.data)"></fl-chart-pathway-node-detail>
  </div>
</div>

<fl-portal>
  <fl-portal-content>

    <div fxLayout="column" fxLayoutGap="1em">

      <div>
        <fl-chart-value name="x" [value]="x" [formatter]="xLabelFormatter"></fl-chart-value>
        <fl-chart-value name="y" [value]="y" [formatter]="yLabelFormatter"></fl-chart-value>
        <fl-chart-value [name]="'flChart.value' | translate" [value]="z" [formatter]="zLabelFormatter"></fl-chart-value>
      </div>

      <fl-tag-list [tags]="data.tags"></fl-tag-list>
    </div>
  </fl-portal-content>
</fl-portal>

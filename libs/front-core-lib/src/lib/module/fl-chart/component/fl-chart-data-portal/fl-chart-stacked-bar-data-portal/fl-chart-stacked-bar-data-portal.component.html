<fl-portal>
  <fl-portal-content>

    <fl-chart-value name="x" [value]="x" [formatter]="xLabelFormatter"></fl-chart-value>
    <div class="container">
      <div *ngFor="let dataWithSerie of data" fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="0.5em"
           class="serie g-text-tiny"
           [matTooltip]="dataWithSerie.data.getY() | flChartValueFormatter:yLabelFormatter:'long'">

        <fl-chart-serie-inline [color]="dataWithSerie.serieKey | flChartScale:seriesColorScale"
                               [serieName]="dataWithSerie.serieName" class="serie-inline g-text-light"
                               [limitSerieNameWidth]="true">
        </fl-chart-serie-inline>

        <div class="value">{{dataWithSerie.data.getY() | flChartValueFormatter:yLabelFormatter}}</div>

      </div>
    </div>
  </fl-portal-content>
</fl-portal>

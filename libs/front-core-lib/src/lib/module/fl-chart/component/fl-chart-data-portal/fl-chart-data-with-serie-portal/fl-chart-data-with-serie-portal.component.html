<fl-portal>
  <fl-portal-content>
    <div fxLayout="column" fxLayoutGap="1em">
      <div>
        <div>x : {{data.data.getXLabel()}}</div>
        <div>y : {{data.data.getYLabel()}}</div>

        <fl-chart-serie-inline class="serie" [color]="color" [serieName]="data.serieName">
        </fl-chart-serie-inline>
      </div>

      <fl-tag-list class="g-text-small" [tags]="data.data.tags" [tagColorer]="tagColorer"></fl-tag-list>
    </div>
  </fl-portal-content>
</fl-portal>

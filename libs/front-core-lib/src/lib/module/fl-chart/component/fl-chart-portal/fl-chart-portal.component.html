<fl-portal class="portal" flResize="both">

  <fl-portal-header [enableDrag]="true">

    <fl-portal-header-buttons>
      <fl-resize-fullscreen-button parentTransformClass="cdk-overlay-pane"></fl-resize-fullscreen-button>
    </fl-portal-header-buttons>
  </fl-portal-header>

  <fl-portal-content>

    <fl-chart class="chart" [chart]="config.chart"
              [contextMenuItems]="config.contextMenuItems"></fl-chart>
  </fl-portal-content>
</fl-portal>

<div>
  <!-- Actions bar -->
  <div fxLayout="row" fxLayoutGap="1em">
    <button mat-icon-button type="button" (click)="downloadSVG()"
            [matTooltip]="'flChart.export_chart' | translate">
      <mat-icon>file_download</mat-icon>
    </button>

    <button mat-icon-button type="button" (click)="resetZoom()"
            [matTooltip]="'flChart.reset_zoom' | translate">
      <mat-icon>search</mat-icon>
    </button>
  </div>

  <div #chart></div>

  <fl-chart-legend [dataContainer]="data" [colorScale]="seriesColorScale"></fl-chart-legend>
</div>

<div class="card" fxLayout="column" fxFlex="grow">
  <div fxFlex="auto">
    <ng-content select="fl-section-header">
    </ng-content>
  </div>

  <div class="content" fxFlex="grow">
    <div *ngIf="isLoading; else notLoading" fxLayoutAlign="center center">
      <fl-loader size="medium"></fl-loader>
    </div>

    <ng-template #notLoading>
      <ng-container *ngIf="showBody; else showEmptyText">
        <ng-container *ngTemplateOutlet="lazyContent; context: viewContext"></ng-container>
      </ng-container>

      <!--  Render the body  -->
      <ng-template #showEmptyText>
        <div class="g-text-centered g-text-light">
          <p>{{emptyText | translate}}</p>
          <mat-icon>block</mat-icon>
        </div>
      </ng-template>
    </ng-template>

  </div>

</div>

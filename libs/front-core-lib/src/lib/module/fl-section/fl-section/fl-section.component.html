<div fxLayout="column" fxFlex="grow">
  <div fxFlex="auto">
    <ng-content select="fl-section-header">
    </ng-content>
  </div>

  <div class="content" fxFlex="grow">
    <div *ngIf="_isLoading; else notLoading" fxLayoutAlign="center center">
      <fl-loader size="medium"></fl-loader>
    </div>

    <ng-template #notLoading>
      <fl-error-text *ngIf="objectIsNullOrEmpty">
        <p>{{emptyText | translate}}</p>
      </fl-error-text>
    </ng-template>

    <!--  Render the body  -->
    <ng-template [cdkPortalOutlet]="portal"></ng-template>
  </div>

</div>

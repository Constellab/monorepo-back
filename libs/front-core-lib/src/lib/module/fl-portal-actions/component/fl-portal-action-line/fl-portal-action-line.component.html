<div fxLayout="row" fxLayoutAlign="space-between center"
     [matTooltip]="text" matTooltipShowDelay="1000" matTooltipPosition="above"
     [routerLink]="link$ | async" [ngClass]="{'link': link$ | async}">

  <div class="text">
    {{text}}
  </div>

  <ng-container *ngIf="statusEvent$ | async as statusEvent">
    <ng-container [ngSwitch]="statusEvent.status">
      <ng-container *ngSwitchCase="'waiting'">
        <mat-icon class="icon">hourglass_empty</mat-icon>
      </ng-container>

      <ng-container *ngSwitchCase="'loading'">
        <!--   loader the same size as the icons   -->
        <fl-loader [size]="24" class="icon"></fl-loader>
      </ng-container>

      <ng-container *ngSwitchCase="'progress'">
        <!--   loader the same size as the icons   -->
        <fl-progress-loader [percent]="$any(statusEvent).progressValue"
                            size="small" class="icon"></fl-progress-loader>
      </ng-container>

      <ng-container *ngSwitchCase="'success'">
        <mat-icon class="g-success-text icon">check_circle</mat-icon>
      </ng-container>

      <ng-container *ngSwitchCase="'error'">
        <mat-icon class="g-error-text icon">error</mat-icon>
      </ng-container>
    </ng-container>
  </ng-container>

</div>

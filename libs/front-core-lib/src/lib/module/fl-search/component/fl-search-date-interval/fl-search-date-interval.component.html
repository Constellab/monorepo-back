<ng-container [formGroup]="formGp">
  <div fxLayout="row wrap" fxLayoutGap="1em" fxLayoutAlign="space-between center"
       class="g-full">

    <!--    Created at from    -->
    <mat-form-field class="g-search-field" appearance="outline">
      <mat-label>{{'flSearch.begin_date' | translate}}</mat-label>
      <input matInput formControlName="from" autocomplete="disabled"
             [matDatepicker]="createdAtFrom" placeholder="{{'flSearch.begin_date' | translate}}">
      <mat-datepicker-toggle matSuffix [for]="createdAtFrom"></mat-datepicker-toggle>
      <mat-datepicker #createdAtFrom></mat-datepicker>
    </mat-form-field>

    <!--    Created at to    -->
    <mat-form-field class="g-search-field" appearance="outline">
      <mat-label>{{'flSearch.end_date' | translate}}</mat-label>
      <input matInput formControlName="to" autocomplete="off"
             [min]="formGp.value.from"
             [matDatepicker]="createdAtTo" placeholder="{{'flSearch.end_date' | translate}}">
      <mat-datepicker-toggle matSuffix [for]="createdAtTo"></mat-datepicker-toggle>
      <mat-datepicker #createdAtTo></mat-datepicker>
    </mat-form-field>
  </div>
</ng-container>

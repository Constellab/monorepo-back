<mat-drawer-container class="g-full-height drawer-container">

  <!-- Advanced section in the right in a drawer -->
  <mat-drawer mode="side" position="end" class="drawer" flDrawerOver="lt-lg">
    <ng-content select="fl-search-advanced-form"></ng-content>
  </mat-drawer>

  <mat-drawer-content class="content" fxLayout="column">

    <div fxLayout="row">
      <div fxFlex="auto">
        <ng-content select="fl-search-header"></ng-content>
      </div>
      <button mat-icon-button type="button" (click)="toggleDrawer()">
        <mat-icon>menu</mat-icon>
      </button>
    </div>


    <!--   Number of results   -->
    <p class="result-count g-text-light">
      <ng-container *ngIf="datasource.page?.totalElements > 0">
        {{'flSearch.count_result' | translate:{count: datasource.page?.totalElements} }}
      </ng-container>
    </p>

    <div fxFlex="grow" class="g-scrollable-element"
         fxLayout="column" (flInfiniteScroll)="loadMoreResults()"
         [flInfiniteDisabled]="datasource.isLoading || datasource.page?.last">
      <div>

        <div>
          <ng-content select="fl-search-result"></ng-content>
        </div>

        <fl-infinite-load-more-result [datasource]="datasource"></fl-infinite-load-more-result>
      </div>

      <fl-loader size="medium" *ngIf="datasource.firstPageIsLoading" class="g-centered"></fl-loader>
    </div>


  </mat-drawer-content>


</mat-drawer-container>

<form [formGroup]="formGp" (ngSubmit)="submit()">

  <fl-form-inputs-manager [config]="formInputConfig"
                          [translateByDefault]="true"
                          [skipFalseBoolean]="skipFalseBoolean"></fl-form-inputs-manager>

  <div fxLayout="column" class="form">
    <ng-content></ng-content>
  </div>


  <button mat-flat-button color="primary" type="submit" [disabled]="formGp.invalid"
          class="g-centered-forced">
    {{'search' | translate}}
  </button>

</form>

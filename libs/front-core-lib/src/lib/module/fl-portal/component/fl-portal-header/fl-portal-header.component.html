<div fxLayout="row" fxLayoutAlign="space-between"
     [ngClass]="{'draggable': enableDrag}"
     cdkDrag cdkDragRootElement=".cdk-overlay-pane" cdkDragHandle
     cdkDragBoundary="body" [cdkDragDisabled]="!enableDrag">
  <!-- Use to center the title -->
  <div class="fake-icon">
  </div>
  <div class="g-centered-forced">
    <ng-content></ng-content>
  </div>
  <div>

    <ng-content select="fl-portal-header-buttons"></ng-content>
    <button mat-icon-button type="button" flPortalClose
            tabindex="-1">
      <mat-icon>close</mat-icon>
    </button>
  </div>
</div>

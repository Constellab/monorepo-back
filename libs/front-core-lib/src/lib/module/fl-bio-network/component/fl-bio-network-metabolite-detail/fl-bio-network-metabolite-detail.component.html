<div class="text">
  <fl-key-value>
    <fl-key>{{'flBioNetwork.id' | translate}}</fl-key>
    {{metabolite.id}}
  </fl-key-value>

  <fl-key-value>
    <fl-key>{{'flBioNetwork.name' | translate}}</fl-key>
    {{metabolite.name}}
  </fl-key-value>

  <fl-key-value *ngIf="metabolite.chebi_id">
    <fl-key>{{'flBioNetwork.chebi_id' | translate}}</fl-key>
    <a [href]="metabolite.chebi_id | flBioNetworkLink:'chebi'"
       class="g-text-link chebi-id" target="_blank">
      <fl-text-icon gap="0" iconPosition="end">
        <mat-icon class="g-icon-tiny">open_in_new</mat-icon>
        {{metabolite.chebi_id}}
      </fl-text-icon>
    </a>
  </fl-key-value>
</div>

<div class="g-text-small g-text-light" *ngIf="info$ | async as info">
  <div *ngIf="info.metabolites != null">
    {{'flBioNetwork.metabolites_count' | translate: {count: info.metabolites} }}
  </div>

  <div *ngIf="info.cofactors != null">
    {{'flBioNetwork.cofactors_count' | translate: {count: info.cofactors} }}
  </div>

  <div *ngIf="info.reactions != null">
    {{'flBioNetwork.reactions_count' | translate: {count: info.reactions} }}
  </div>

  <div *ngIf="info.links != null">
    {{'flBioNetwork.links_count' | translate: {count: info.links} }}
  </div>
</div>

<mat-sidenav-container class="g-full-height" [hasBackdrop]="false">

  <!-- Main content with chart -->
  <mat-sidenav-content>
    <div class="container" fxLayout="row">


      <div class="g-full-height" fxFlex="auto" fxLayout="column">
        <div #chart fxFlex="auto" class="svg-container" (click)="closeDrawer()"></div>

        <fl-bio-network-action-bar></fl-bio-network-action-bar>

      </div>

      <!--   Drawer opener   -->
      <div class="drawer-opener" (mouseenter)="openDrawer()" (click)="openDrawer()"
           fxLayout="column" fxLayoutAlign="center start">
        <div class="drawer-opener-icon" fxLayout="column" fxLayoutAlign="center center">
          <mat-icon>arrow_back_ios</mat-icon>
        </div>
      </div>

    </div>

  </mat-sidenav-content>

  <mat-sidenav mode="over" position="end" [fixedInViewport]="true">
    <fl-bio-network-drawer></fl-bio-network-drawer>
  </mat-sidenav>
</mat-sidenav-container>

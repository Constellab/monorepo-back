
<mat-drawer-container class="g-full-height" [hasBackdrop]="false">

  <!-- Main content with chart -->
  <mat-drawer-content>
    <div class="container" fxLayout="row">


      <div class="g-full-height" fxFlex="auto" fxLayout="column">
        <div #networkContainer fxFlex="auto" class="svg-container" (click)="closeDrawer()"></div>
      </div>

      <!--   Drawer opener   -->
      <fl-drawer-opener [drawer]="sidenav"></fl-drawer-opener>

    </div>

  </mat-drawer-content>

  <!-- Drawer with auto focus to false because this scroll the element when use in report -->
  <mat-drawer mode="over" position="end" #sidenav  [autoFocus]="false">
    <fl-bio-network-drawer></fl-bio-network-drawer>
  </mat-drawer>
</mat-drawer-container>

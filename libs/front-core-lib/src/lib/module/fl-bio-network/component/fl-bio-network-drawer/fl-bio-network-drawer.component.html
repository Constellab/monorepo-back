<div class="container"
     flMouseHover (flMouseLeave)="closeDrawer()" [flMouseLeaveDelay]="300"
     [flExcludeElement]="cdkContainerClass" [flDisabled]="pinnedDrawer" fxLayout="row">
  <mat-tab-group [(selectedIndex)]="tabIndex" animationDuration="0" class="tab-group g-mat-tab-dense">
    <mat-tab [label]="'flBioNetwork.config' | translate">
      <fl-bio-network-config class="tab-body"></fl-bio-network-config>
    </mat-tab>

    <mat-tab [label]="'flBioNetwork.node' | translate">
      <fl-bio-network-node-detail class="tab-body"></fl-bio-network-node-detail>
    </mat-tab>

    <mat-tab [label]="'flBioNetwork.pathway' | translate">
      <fl-bio-network-action-bar class="tab-body"></fl-bio-network-action-bar>
    </mat-tab>
  </mat-tab-group>

  <div fxLayout="row" fxLayoutAlign="end center" class="buttons g-button-icon-small">
    <fl-pin-unpin-button [(pin)]="pinnedDrawer"></fl-pin-unpin-button>

    <button mat-icon-button type="button" tabindex="-1" (click)="closeDrawer()"
            [matTooltip]="'close' | translate" class="g-button-icon-small">
      <mat-icon>clear</mat-icon>
    </button>
  </div>
</div>

<div class="container" fxLayout="column">
  <div class="g-text-small">{{'flBioNetwork.compartments' | translate}}</div>
  <div fxLayout="column wrap" class="grow">
    <div *ngFor="let compartment of compartments$ | async"
         fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="1em"
         (click)="toggleCompartment(compartment.id)"
         [style.opacity]="getCompartmentOpacity(compartment.id)"
         class="element g-text-not-selectable">
      <div class="round" [style.backgroundColor]="compartment.color"></div>
      <div class="g-text-capitalize-first g-text-small g-text-light">{{compartment.name}}</div>
    </div>
  </div>
</div>

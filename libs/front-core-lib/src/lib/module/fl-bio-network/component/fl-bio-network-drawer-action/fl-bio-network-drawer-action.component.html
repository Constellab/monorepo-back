               flMouseHover (flMouseLeave)="closeDrawer()" [flMouseLeaveDelay]="300">

    <fl-bio-network-config class="tab-body"></fl-bio-network-config>

  <mat-tab [label]="'flBioNetwork.node' | translate">

  </mat-tab>
</mat-tab-group>

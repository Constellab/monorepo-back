<div class="text">
  <fl-key-value>
    <fl-key>{{'flBioNetwork.id' | translate}}</fl-key>
    {{reaction.id}}
  </fl-key-value>

  <fl-key-value>
    <fl-key>{{'flBioNetwork.name' | translate}}</fl-key>
    {{reaction.name}}
  </fl-key-value>

  <fl-key-value *ngIf="reaction.rhea_id">
    <fl-key>{{'flBioNetwork.rhea_id' | translate}}</fl-key>
    <a [href]="reaction.rhea_id | flBioNetworkLink:'rhea'"
       class="g-text-link link" target="_blank">
      <fl-text-icon gap="0" iconPosition="end">
        <mat-icon class="g-icon-tiny">open_in_new</mat-icon>
        {{reaction.rhea_id}}
      </fl-text-icon>
    </a>
  </fl-key-value>

  <div *ngIf="reaction.enzymes">
    {{'flBioNetwork.enzymes' | translate}} :

    <ul>
      <li *ngFor="let enzyme of reaction.enzymes">
        <span>{{enzyme.name}} </span>
        <ng-container *ngIf="enzyme.ec_number">
          <a [href]="enzyme.ec_number | flBioNetworkLink:'brenda'"
              class="g-text-link link g-text-light g-text-small" target="_blank">
          <fl-text-icon gap="0" iconPosition="end">
            <mat-icon class="g-icon-tiny">open_in_new</mat-icon>
            ({{enzyme.ec_number}})
          </fl-text-icon>
        </a>
        </ng-container>
      </li>
    </ul>
  </div>

  <fl-bio-network-reaction-flux [reaction]="reaction"></fl-bio-network-reaction-flux>
</div>

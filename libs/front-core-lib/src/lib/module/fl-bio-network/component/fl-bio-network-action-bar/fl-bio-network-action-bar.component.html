<!--    Action bar on the bottom  -->
<div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="1em" class="action-bar"
     *ngIf="isReady">

  <!--   Slider to hide link     -->
  <div>
    <p class="g-text-small g-text-light">{{'flBioNetwork.link_value_help' | translate}} : {{sliderValue}}</p>
    <mat-slider class="slider" color="primary"
                [max]="linksMaxAbsValue"
                [min]="0"
                [step]="1"
                [thumbLabel]="true"
                tickInterval="auto"
                [(ngModel)]="sliderValue"
                (input)="hideLinkLowerThan($event)">
    </mat-slider>

  </div>

  <fl-bio-network-compartments></fl-bio-network-compartments>

  <div fxLayout="column">
    <mat-checkbox [(ngModel)]="linkColorLogarithm" (change)="setLinksColors()" color="primary">
      {{'flBioNetwork.link_color_log' | translate}}
    </mat-checkbox>

    <mat-checkbox [(ngModel)]="showCofactor" (change)="toggleShowCofactor()" color="primary">
      {{'flBioNetwork.toggle_show_cofactor' | translate}}
    </mat-checkbox>
  </div>

  <fl-bio-network-selection-info class="g-full-height"></fl-bio-network-selection-info>

  <fl-bio-network-node-search></fl-bio-network-node-search>

  <button mat-icon-button (click)="exportAllNetwork()" type="button" color="primary"
          [matTooltip]="'flBioNetwork.export_position_to_json' | translate">
    <mat-icon>file_download</mat-icon>
  </button>

  <!--  <fl-bio-network-zoom></fl-bio-network-zoom>-->
</div>

<div *ngIf="progress$ | async as progress">
  <ng-container *ngIf="progress.status !== 'ended'; else ended">

    <p>{{'flBioNetwork.calculating_positions' | translate}}</p>
    <mat-progress-bar mode="determinate" class="progress-bar"
                      [value]="progress.progress"></mat-progress-bar>
  </ng-container>

  <ng-template #ended>
    <fl-key-value>
      <fl-key>{{'flBioNetwork.last_calculation_duration' | translate}}</fl-key>
      {{progress.duration | flDuration}}
    </fl-key-value>
  </ng-template>
</div>

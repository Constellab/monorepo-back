<!--  Select the pathway  -->
<h2>{{'flBioNetwork.select_clusters' | translate}}</h2>

<div fxLayout="row" fxLayoutAlign="start center">
  <button mat-icon-button class="highlight-icon g-button-icon-tiny"
          (click)="toggleAllClusterColors()"
          [color]="clustersAllColored ? 'primary' : null"
          [matTooltip]="'flBioNetwork.highlight_all_pathway' | translate">
    <mat-icon>colorize</mat-icon>
  </button>
  <!--  Select all toggle  -->
  <mat-checkbox [checked]="clustersAllSelected"
                (change)="selectAllClustersChange($event.checked)">
    {{'flBioNetwork.select_all_pathway' | translate}}
  </mat-checkbox>
</div>

<div *ngFor="let cluster of clusters$ | async" fxLayout="row" fxLayoutAlign="start center">
  <button mat-icon-button class="highlight-icon g-button-icon-tiny"
          (click)="toggleClusterColor(cluster)" [disabled]="!cluster.selected"
          [matTooltip]="'flBioNetwork.highlight_pathway' | translate">
    <mat-icon [style.color]="cluster.highlighted ? cluster.color: ''">
      colorize
    </mat-icon>
  </button>

  <mat-checkbox (click)="$event.stopPropagation()"
                (change)="selectionChanged(cluster)"
                [(ngModel)]="cluster.selected">
    <div class="g-text-small g-text-capitalize-first">
      {{cluster.name}}
    </div>
  </mat-checkbox>

</div>

<ng-container *ngIf="node$ | async as node">

  <fl-bio-network-reaction-detail [reaction]="node.data">
  </fl-bio-network-reaction-detail>


  <fl-bio-network-reaction-content [reaction$]="node$"></fl-bio-network-reaction-content>


  <fl-key-value class="g-section">
    <fl-key>{{'flBioNetwork.pathway' | translate}}</fl-key>
    {{node.cluster.clusterId}}
  </fl-key-value>

  <div *ngIf="node.existsInMultipleCluster" class="section">
    <p>{{'flBioNetwork.reaction_exists_in_multiple_pathways' | translate}} :</p>

    <ul>
      <li *ngFor="let reaction of duplicateReactions$ | async"
          class="g-text-link" (click)="selectNode(reaction)"
          [ngClass]="{'selected-pathway':reaction.cluster.clusterId === node.cluster.clusterId}">
        {{reaction.cluster.clusterId}}
      </li>
    </ul>
  </div>
</ng-container>

<ng-container *ngIf="node$ | async as node">

  <fl-bio-network-reaction-detail [reaction]="node.data">
  </fl-bio-network-reaction-detail>

  <div class="section">
    <p>{{'flBioNetwork.reaction_products' | translate}} :</p>

    <ul>
      <li *ngFor="let product of reactionProducts$ | async">
        <span class="g-text-link" (click)="selectNode(product)">
          {{product.name}}
        </span>

        <a class="chebi-id g-text-small g-text-light g-text-link"
           *ngIf="product.getChebiId() as id" target="_blank"
           [href]="product.getChebiLink()">
          <fl-text-icon gap="0" iconPosition="end">
            <mat-icon class="g-icon-tiny">open_in_new</mat-icon>
            ({{id}})
          </fl-text-icon>
        </a>
      </li>
    </ul>
  </div>

  <div class="section">
    <p>{{'flBioNetwork.reaction_substrate' | translate}} :</p>

    <ul>
      <li *ngFor="let substrate of reactionSubstrate$ | async">
        <span class="g-text-link" (click)="selectNode(substrate)">
          {{substrate.name}}
        </span>

        <a class="chebi-id g-text-small g-text-light g-text-link"
           *ngIf="substrate.getChebiId() as id" target="_blank"
           [href]="substrate.getChebiLink()">
          <fl-text-icon gap="0" iconPosition="end">
            <mat-icon class="g-icon-tiny">open_in_new</mat-icon>
            ({{id}})
          </fl-text-icon>
        </a>
      </li>
    </ul>
  </div>
</ng-container>

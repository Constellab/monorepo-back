<div>

  <div fxLayout="column" fxLayoutGap="0.3em">

    <!--  Select the network  -->
    <mat-form-field *ngIf="networks">
      <mat-label>{{'flBioNetwork.select_network' | translate}}</mat-label>
      <mat-select placeholder="{{'flBioNetwork.select_network' | translate}}"
                  [(ngModel)]="networkName" (selectionChange)="onNetworkChange($event)"
                  class="g-mat-select-capitalize">
        <mat-option *ngFor="let network of networks" [value]="network.name">
          <div class="g-text-capitalize-first">{{network.name}}</div>
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!--  Select the database  -->
    <mat-form-field>
      <mat-label>{{'flBioNetwork.select_db' | translate}}</mat-label>
      <mat-select placeholder="{{'flBioNetwork.select_db' | translate}}"
                  [(ngModel)]="database" (selectionChange)="onDatabaseChange($event)"
                  class="g-mat-select-capitalize">
        <mat-option *ngFor="let db of pathwayDatabases" [value]="db">
          <div class="g-text-capitalize-first">{{db}}</div>
        </mat-option>
      </mat-select>
    </mat-form-field>


    <!--  Select the pathway  -->
    <p>{{'flBioNetwork.select_sub_pathway' | translate}}</p>

    <div fxLayout="row" fxLayoutAlign="start center">
      <button mat-icon-button class="highlight-icon g-button-icon-tiny"
              (click)="toggleAllPathwayHighlight()"
              [matTooltip]="'flBioNetwork.highlight_all_pathway' | translate">
        <mat-icon>colorize</mat-icon>
      </button>
      <!--  Select all toggle  -->
      <mat-checkbox [checked]="pathwaysAllSelected"
                    (change)="selectAllPathwayChange($event.checked)">
        <strong>{{'flBioNetwork.select_all_pathway' | translate}}</strong>
      </mat-checkbox>
    </div>

    <div *ngFor="let pathway of pathways$ | async" fxLayout="row" fxLayoutAlign="start center">
      <button mat-icon-button class="highlight-icon g-button-icon-tiny"
              (click)="togglePathwayHighlight(pathway, $event)" [disabled]="!pathway.selected"
              [matTooltip]="'flBioNetwork.highlight_pathway' | translate">
        <mat-icon [style.color]="pathway.highlighted ? pathway.color: ''">
          colorize
        </mat-icon>
      </button>

      <mat-checkbox (click)="$event.stopPropagation()"
                    (change)="selectionChanged(pathway)"
                    [(ngModel)]="pathway.selected"
                    class="g-mat-checkbox-wrap-text">
        <div class="g-text-small g-text-capitalize-first">
          {{pathway.name}} ({{pathway.id}})
        </div>
      </mat-checkbox>
    </div>
  </div>

</div>

<mat-form-field class="g-full g-form-field-no-hint">
  <mat-label>{{'flBioNetwork.search_node' | translate}}</mat-label>
  <input type="text" matInput [formControl]="searchControl" [matAutocomplete]="auto">
  <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayFn" [autoActiveFirstOption]="true"
                    (optionSelected)="selectObject()">
    <cdk-virtual-scroll-viewport itemSize="48" minBufferPx="200" maxBufferPx="400"
                                 class="virtual-scroller">
      <mat-option *cdkVirtualFor="let object of filteredObjects$ | async" [value]="object"
                  class="g-mat-option-multi-line">
        <div>{{object.name}}</div>
        <div class="g-text-light g-text-small">{{object.id}}</div>
      </mat-option>
    </cdk-virtual-scroll-viewport>
  </mat-autocomplete>
</mat-form-field>

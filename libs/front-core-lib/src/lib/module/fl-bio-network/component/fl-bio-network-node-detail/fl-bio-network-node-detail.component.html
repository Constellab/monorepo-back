<div *ngIf="node$ | async as node; else noNode">


  <ng-container [ngSwitch]="node.type">
    <fl-bio-network-node-reaction-detail *ngSwitchCase="'reaction'"></fl-bio-network-node-reaction-detail>
    <fl-bio-network-node-metabolite-detail *ngSwitchCase="'metabolite'"></fl-bio-network-node-metabolite-detail>
    <fl-bio-network-node-cofactor-detail *ngSwitchCase="'cofactor'"></fl-bio-network-node-cofactor-detail>
  </ng-container>

  <mat-expansion-panel class="detail-panel">
    <mat-expansion-panel-header>
      <mat-panel-title>
        {{'flBioNetwork.details' | translate}}
      </mat-panel-title>
    </mat-expansion-panel-header>

    <fl-pretty-json class="g-section json" [object]="node.data" [previewMaxTextLength]="30"></fl-pretty-json>
  </mat-expansion-panel>

  <fl-bio-network-node-layout></fl-bio-network-node-layout>

  <fl-bio-network-node-links class="g-section" [node]="node"></fl-bio-network-node-links>
</div>

<ng-template #noNode>
  <fl-error-text [errorMessage]="'flBioNetwork.select_node_help_text' | translate"></fl-error-text>
</ng-template>

<div class="container" flDragHover="container-file-hover"
     (flDrop)="onFileDrop($event)">
  <div class="g-placeholder">
    <p [ngClass]="{'g-warn-text': error}">{{placeholder}}</p>
  </div>
  <div [flJsonEditor]="value" [flJsonEditorConfig]="config"
       [flJsonEditorSchema]="jsonSchema"
       (flJsonChange)="onEditorChange($event)"
       class="editor-container"></div>
</div>

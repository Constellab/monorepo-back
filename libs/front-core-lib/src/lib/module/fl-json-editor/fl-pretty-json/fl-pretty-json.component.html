<div class="g-list-padding">
  {{startChar}}

  <!-- Primitive object -->
  <mat-tree *ngIf="object != null" [dataSource]="nestedDataSource" [treeControl]="nestedTreeControl">
    <mat-tree-node *matTreeNodeDef="let node" matTreeNodeToggle class="tree-node">
      <span class="key-color key">{{node.key}}</span>&nbsp;:

      <span class="value">
      <span class="g-text-light" *ngIf="node.value == null">null</span>


      <span [ngClass]="node.type">
        <ng-container *ngIf="node.type === 'string'">"</ng-container>
        <span class="string-value">{{node.value}}</span>
        <ng-container *ngIf="node.type === 'string'">"</ng-container>
      </span>
    </span>
    </mat-tree-node>


    <!-- Nested object-->
    <mat-nested-tree-node *matTreeNodeDef="let node; when: hasNestedChild">
      <div matTreeNodeToggle class="clickable" fxLayout="row" fxLayoutAlign="start center">
        <div>
          <fl-text-icon [gap]="'0px'">
            <mat-icon class="icon">
              <ng-container *ngIf="nestedTreeControl.isExpanded(node) ; else noExp">arrow_drop_down</ng-container>
              <ng-template #noExp>arrow_right</ng-template>
            </mat-icon>
            <span class="key-color">{{node.key}}</span> :
          </fl-text-icon>
        </div>

        <div [ngClass]="{'g-text-light': !nestedTreeControl.isExpanded(node)}">
          &nbsp;{{node.information}}
        </div>

        <div *ngIf="!nestedTreeControl.isExpanded(node)">
          &nbsp;<span class="g-text-light">{{node.preview}}</span>
        </div>
      </div>

      <div class="children"
           [class.invisible]="!nestedTreeControl.isExpanded(node)">
        <ng-container matTreeNodeOutlet></ng-container>
      </div>
    </mat-nested-tree-node>
  </mat-tree>

  {{endChar}}</div>

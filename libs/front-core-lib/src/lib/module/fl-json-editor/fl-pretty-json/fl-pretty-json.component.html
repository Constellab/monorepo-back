<div class="g-list-padding container" [ngClass]="denseClass" *ngIf="!error; else showError" tabindex="0"
     (keydown)="onKeyDown($event)">
  {{startChar}}
  <mat-tree *ngIf="dataSource != null" [dataSource]="dataSource" [treeControl]="treeControl" [trackBy]="trackBy">

    <mat-tree-node *matTreeNodeDef="let node" class="tree-node" matTreeNodePadding
                   [matTreeNodePaddingIndent]="paddingIndent">
      <div [ngClass]="{'selected-node' : selectedNode === node }" (click)="selectNode(node)"
           class="leaf-container node-selectable">
        <span>{{node.key}}</span>&nbsp;:

        <span class="value">
          <span class="g-text-light" *ngIf="node.value == null">null</span>


          <span [ngClass]="node.type">
            <ng-container *ngIf="node.type === 'string'">"</ng-container>
            <span>{{node.value}}</span>
            <ng-container *ngIf="node.type === 'string'">"</ng-container>
          </span>
        </span>
      </div>
    </mat-tree-node>


    <!-- This is the tree node template for expandable nodes -->
    <mat-tree-node *matTreeNodeDef="let node;when: hasChild" matTreeNodePadding
                   [matTreeNodePaddingIndent]="paddingIndent"
                   class="tree-node-preview">
      <div matTreeNodeToggle class="clickable tree-container node-selectable" fxLayout="row" fxLayoutAlign="start center"
           [ngClass]="{'selected-node' : selectedNode === node }" (click)="selectNode(node)">
          <fl-text-icon [gap]="'0px'">
            <!--      Arrow icon      -->
            <mat-icon class="icon">{{treeControl.isExpanded(node) ? 'arrow_drop_down' : 'arrow_right'}}</mat-icon>

            <!--     Key       -->
            <span>{{node.key}}</span>

            <!--     Preview       -->
            <span *ngIf="!treeControl.isExpanded(node) && node.preview">
              &nbsp;: <span class="g-text-light">{{node.preview}}</span>
            </span>
          </fl-text-icon>

      </div>
    </mat-tree-node>
  </mat-tree>
  {{endChar}}
</div>

<ng-template #showError>
  <div class="g-text-centered g-text-light">
    <p>{{'flJsonEditor.object_not_supported' | translate}}</p>
    <div>
      <mat-icon>block</mat-icon>
    </div>
  </div>
</ng-template>

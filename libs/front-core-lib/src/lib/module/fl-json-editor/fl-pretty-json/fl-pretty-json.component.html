<div class="g-list-padding" [ngClass]="denseClass" *ngIf="!error; else showError">
  {{startChar}}
  <mat-tree *ngIf="dataSource != null" [dataSource]="dataSource" [treeControl]="treeControl">

    <mat-tree-node *matTreeNodeDef="let node" matTreeNodeToggle class="tree-node" matTreeNodePadding
                   [matTreeNodePaddingIndent]="paddingIndent">
      <span class="key-color key">{{node.key}}</span>&nbsp;:

      <span class="value">
          <span class="g-text-light" *ngIf="node.value == null">null</span>


          <span [ngClass]="node.type">
            <ng-container *ngIf="node.type === 'string'">"</ng-container>
            <span>{{node.value}}</span>
            <ng-container *ngIf="node.type === 'string'">"</ng-container>
          </span>
        </span>
    </mat-tree-node>


    <!-- This is the tree node template for expandable nodes -->
    <mat-tree-node *matTreeNodeDef="let node;when: hasChild" matTreeNodePadding
                   [matTreeNodePaddingIndent]="paddingIndent"
                   class="tree-node-preview">
      <div matTreeNodeToggle class="clickable" fxLayout="row" fxLayoutAlign="start center">
        <div>
          <fl-text-icon [gap]="'0px'">
            <mat-icon class="icon">
              <ng-container *ngIf="treeControl.isExpanded(node) ; else noExp">arrow_drop_down</ng-container>
              <ng-template #noExp>arrow_right</ng-template>
            </mat-icon>
            <span class="key-color">{{node.key}}</span>
          </fl-text-icon>
        </div>


        <div *ngIf="!treeControl.isExpanded(node) && node.preview">
          &nbsp;: <span class="g-text-light">{{node.preview}}</span>
        </div>
      </div>
    </mat-tree-node>
  </mat-tree>
  {{endChar}}
</div>

<ng-template #showError>
  <div class="g-text-centered g-text-light">
    <p>{{'flJsonEditor.object_not_supported' | translate}}</p>
    <div>
      <mat-icon>block</mat-icon>
    </div>
  </div>
</ng-template>

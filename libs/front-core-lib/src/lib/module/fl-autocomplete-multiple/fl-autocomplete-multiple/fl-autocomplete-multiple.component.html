<mat-form-field class="g-full">
  <mat-label>{{placeholder}}</mat-label>
  <mat-chip-list #chipList>
    <mat-chip
      *ngFor="let item of value; let i = index"
      [removable]="true"
      (removed)="removeItem(i)">
      {{item}}
      <mat-icon *ngIf="item" matChipRemove>cancel</mat-icon>
    </mat-chip>
    <input
      matInput
      (flElasticSearch)="search($event)"
      [placeholder]="placeholder"
      [matAutocomplete]="auto"
      [matChipInputFor]="chipList"
      [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
      (matChipInputTokenEnd)="addUnknownValue($event)" [disabled]="disabled">
  </mat-chip-list>
  <mat-autocomplete #auto="matAutocomplete"
                    (optionSelected)="optionSelected($event)" [autoActiveFirstOption]="true">

    <mat-option *ngFor="let option of filteredOptions$ | async" [value]="option">
      {{option}}
    </mat-option>

  </mat-autocomplete>
</mat-form-field>

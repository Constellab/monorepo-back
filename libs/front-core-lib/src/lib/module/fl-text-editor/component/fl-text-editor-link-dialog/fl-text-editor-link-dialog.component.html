<fl-dialog-header>
  {{title | translate}}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="link-form" >

    <!--  url  -->
    <mat-form-field class="g-form-input">
      <mat-label>{{'flTextEditor.url' | translate}}</mat-label>
      <input matInput [formControl]="linkControl" required
             placeholder="{{'flTextEditor.url' | translate}}">
      <mat-error *ngIf="linkControl.hasError('required')">
        {{'flTextEditor.url' | flErrorRequired}}
      </mat-error>
      <mat-error *ngIf="linkControl.hasError('notYoutube')">
        {{linkControl.getError('notYoutube') | translate}}
      </mat-error>
    </mat-form-field>

  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button color="primary" type="submit" form="link-form"
          class="g-centered-forced">
    {{'flTextEditor.ok' | translate}}
  </button>
</div>

<span class="container g-text-light g-text-small">
  <span *ngIf="title || caption"><strong>{{title}}</strong> | {{caption}}</span>
  <button mat-icon-button type="button" *ngIf="editable"
          class="g-button-icon-tiny edit-button" (click)="openEditDialog()">
    <mat-icon>edit</mat-icon>
  </button>
</span>


<ng-template #templatePortalContent>
  <fl-portal class="portal">

    <fl-portal-content>
      <form (ngSubmit)="closeDialog()">
        <div fxLayout="column">
          <mat-form-field>
            <mat-label>{{'flTextEditor.title' | translate}}</mat-label>
            <input matInput [(ngModel)]="title" [placeholder]="'flTextEditor.title' | translate"
                   name="title" flInputMaxLength="50">
          </mat-form-field>

          <mat-form-field>
            <mat-label>{{'flTextEditor.caption' | translate}}</mat-label>
            <textarea matInput [(ngModel)]="caption" [placeholder]="'flTextEditor.caption' | translate"
                      name="caption" rows="4">
            </textarea>
          </mat-form-field>
          <div class="g-text-centered">
            <button mat-stroked-button type="submit" class="g-button-small">
              {{'flTextEditor.ok' | translate}}
            </button>
          </div>
        </div>
      </form>
    </fl-portal-content>

  </fl-portal>
</ng-template>

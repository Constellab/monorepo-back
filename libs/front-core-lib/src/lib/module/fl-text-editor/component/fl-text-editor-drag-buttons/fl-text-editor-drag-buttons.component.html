<ng-template #dragIndicator>
  <button mat-icon-button class="drag-indicator" (mousedown)="onDragIndicatorMouseDown()"
          [matTooltip]="'flTextEditor.move_block'| translate">
    <mat-icon>drag_indicator</mat-icon>
  </button>
</ng-template>

<ng-template #dragBar>
  <div class="drag-bar" [style.width]="barWidth"></div>
</ng-template>

<form [formGroup]="formGp" (ngSubmit)="login()" class="form">


  <fl-login-form [formGp]="formGp"></fl-login-form>

  <button mat-flat-button color="accent" type="submit"
          [disabled]="isLoading" class="connection-button g-button-big">
    {{'flAuth.sign_in' | translate}}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>


  <div class="footer" fxLayout="row wrap" fxLayoutAlign="space-between" *ngIf="!hideFooter">
    <span class="g-text-light g-text-small g-text-link" (click)="openPasswordForgotten()">
      {{'flAuth.forgot_password' | translate}}
    </span>
    <span class="g-primary-text g-text-small g-text-link" (click)="openSignupDialog()">
      {{'flAuth.signup_link' | translate}}
    </span>
  </div>
</form>

<div class="g-page" fxLayout="column">

  <a routerLink="/" mat-icon-button>
    <mat-icon>home</mat-icon>
  </a>

  <div fxFlex="grow" fxLayoutAlign="center center">
    <fl-card class="card">
      <fl-card-header>
        <h1 class="g-page-title">{{'flAuth.reset_password' | translate}}</h1>

      </fl-card-header>

      <fl-card-body>


        <form (ngSubmit)="submit()" [formGroup]="formGp">

          <!--  Password -->
          <mat-form-field appearance="outline" class="g-form-input">
            <mat-label>{{'flAuth.password' | translate}}</mat-label>
            <input matInput type="password" formControlName="password" required
                   placeholder="{{'flAuth.password' | translate}}" autocomplete="new-password">
            <mat-error *ngIf="formGp.get('password').hasError('required')">
              {{'flAuth.password' | flErrorRequired}}
            </mat-error>
            <mat-error *ngIf="formGp.get('password').hasError('incorrectPasswordFormat')">
              {{'flAuth.password_weak_error' | translate}}
            </mat-error>
          </mat-form-field>

          <!--  Repeat Password -->
          <mat-form-field appearance="outline" class="g-form-input">
            <mat-label>{{'flAuth.repeat_password' | translate}}</mat-label>
            <input matInput type="password" formControlName="repeatPassword" required
                   placeholder="{{'flAuth.repeat_password' | translate}}" autocomplete="off">
            <mat-error *ngIf="formGp.get('repeatPassword').hasError('required')">
              {{'flAuth.repeat_password' | flErrorRequired}}
            </mat-error>
            <mat-error *ngIf="formGp.get('repeatPassword').hasError('incorrectRepeatPassword')">
              {{'flAuth.repeat_password_error' | translate}}
            </mat-error>
          </mat-form-field>

          <button mat-flat-button color="primary" type="submit"
                  class="g-centered-forced">
            {{'flAuth.reset_password' | translate}}
            <fl-button-loader *ngIf="isLoading"></fl-button-loader>
          </button>
        </form>

      </fl-card-body>

    </fl-card>
  </div>
</div>

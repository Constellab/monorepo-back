<fl-dialog-header>
  {{'flAuth.signup' | translate}}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="signup-form" [formGroup]="formGp">
    <fl-signup-form [formGp]="formGp"></fl-signup-form>
  </form>
</mat-dialog-content>

<div matDialogActions>
  <button mat-flat-button color="primary" type="submit" form="signup-form"
          class="centered">
    {{'flAuth.signup' | translate}}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>

<form (ngSubmit)="submit()">

  <h2 class="g-text-centered">
    {{'flAuth.two_fa' | translate}}
  </h2>

  <p class="g-text-light sub-title">
    {{'flAuth.two_fa_help' | translate}}
  </p>

  <!--  Email  -->
  <mat-form-field class="g-form-input">
    <mat-label>{{'flAuth.two_fa_code' | translate}}</mat-label>
    <input matInput type="text" [formControl]="formControl" required
           [placeholder]="'flAuth.two_fa_code' | translate"
           inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code">
    <mat-error *ngIf="formControl.hasError('required')">
      {{'error_required' | translate: {field: 'flAuth.two_fa_code' | translate} }}
    </mat-error>
    <mat-error *ngIf="formControl.hasError('pattern')">
      {{'flAuth.two_fa_invalid_code' | translate}}
    </mat-error>
  </mat-form-field>

  <button mat-flat-button color="accent" type="submit"
          [disabled]="isLoading" class="connection-button g-button-big">
    {{'flAuth.sign_in' | translate}}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>

  <div class="footer">
    <a [routerLink]="'.'">
    <span class="g-text-light g-text-small g-text-link">
      {{'flAuth.two_fa_cancel' | translate}}
    </span>
    </a>
  </div>
</form>

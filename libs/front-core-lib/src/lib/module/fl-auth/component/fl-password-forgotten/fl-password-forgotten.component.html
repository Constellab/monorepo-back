<fl-dialog-header>
  {{'flAuth.password_forgotten' | translate}}
</fl-dialog-header>

<mat-dialog-content>
  <form (ngSubmit)="submit()" id="project-form">

    <p class="g-text-light help-text">{{'flAuth.password_forgotten_help' | translate}}</p>

    <!--  Email  -->
    <mat-form-field appearance="outline" class="g-form-input">
      <mat-label>{{'email' | translate}}</mat-label>
      <input matInput type="email" [formControl]="formControl" required
             placeholder="{{'email' | translate}}">
      <mat-error *ngIf="formControl.hasError('required')">
        {{'email' | flErrorRequired}}
      </mat-error>
      <mat-error *ngIf="formControl.hasError('email')">
        {{'.email_invalid' | translate}}
      </mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<div mat-dialog-actions>
  <button mat-flat-button color="primary" type="submit" form="project-form"
          class="g-centered-forced">
    {{'flAuth.password_forgotten' | translate}}
    <fl-button-loader *ngIf="isLoading"></fl-button-loader>
  </button>
</div>

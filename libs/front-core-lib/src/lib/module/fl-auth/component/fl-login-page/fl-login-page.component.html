<div class="page" fxLayout="row" fxLayoutAlign="center center"
     fxLayoutAlign.xs="center start">
  <fl-card class="card" fxFlex="32em" fxFlex.xs="100%">
    <fl-card-body>
      <img src="assets/logo/logo_with_name.png" alt="Gencovery logo" class="logo"/>

    </fl-card-body>
  </fl-card>

</div>

<div class="container" #container tabindex="-1">
  <div class="view-content g-text-not-selectable" *ngIf="!edit; else editMode" (dblclick)="enableEditMode()">
    {{cell.value}}
  </div>

  <ng-template #editMode>
    <input class="input" #input [(ngModel)]="cell.value" size="1">
  </ng-template>
</div>

<div class="container" #container tabindex="-1">
  <div class="view-content g-text-not-selectable" *ngIf="!edit; else editMode">
    {{cell.value}}
  </div>

  <ng-template #editMode>
    <input class="input" #input [(ngModel)]="cellValue" size="1" (blur)="validateEditMode()"
           (keyup.escape)="cancelEditMode()" (keyup.enter)="validateEditMode()">
  </ng-template>
</div>

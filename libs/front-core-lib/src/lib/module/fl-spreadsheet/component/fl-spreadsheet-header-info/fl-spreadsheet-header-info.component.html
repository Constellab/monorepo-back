<fl-portal>

  <fl-portal-content>

    <fl-key-value *ngIf="hasTitle()">
      <fl-key>{{'flSpreadsheet.header_name' | translate}}</fl-key>
      <span class="name">{{headerInfo.name}}</span>
    </fl-key-value>

    <fl-key-value *ngIf="headerInfo.type">
      <fl-key>{{'flSpreadsheet.header_type' | translate}}</fl-key>
      <span>{{'flSpreadsheet.header_type_' + headerInfo.type | translate}}</span>
    </fl-key-value>

    <fl-spreadsheet-header-tags [tags]="headerInfo.tags" [tagColorer]="headerInfo.tagColorer"
                                class="tags"></fl-spreadsheet-header-tags>
  </fl-portal-content>
</fl-portal>

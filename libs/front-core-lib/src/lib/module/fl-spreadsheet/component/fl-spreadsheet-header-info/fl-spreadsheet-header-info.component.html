<fl-portal>

  <fl-portal-content>

    <fl-key-value *ngIf="hasTitle()">
      <fl-key>{{'flSpreadsheet.header_name' | translate}}</fl-key>
      <span class="name">{{headerInfo.name}}</span>
    </fl-key-value>

    <fl-spreadsheet-header-tags [tags]="headerInfo.tags" class="tags"></fl-spreadsheet-header-tags>
  </fl-portal-content>
</fl-portal>

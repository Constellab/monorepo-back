<div flMouseHover (flMouseLeave)="closeDrawer()" [flMouseLeaveDelay]="300"
     [flDisabled]="pinDrawer" [flExcludeElement]="cdkContainerClass"
     class="container">

  <fl-section [object]="true">

    <fl-section-header>
      <fl-section-actions class="g-button-icon-small">
        <fl-pin-unpin-button [(pin)]="pinDrawer"></fl-pin-unpin-button>

        <button mat-icon-button type="button" tabindex="-1" (click)="closeDrawer()"
                [matTooltip]="'close' | translate">
          <mat-icon>clear</mat-icon>
        </button>
      </fl-section-actions>
    </fl-section-header>


    <ng-container *flSectionBody>
      <div class="drawer-content g-mat-checkbox-include-bottom">

        <!--   Information about the current sheet     -->
        <div *ngIf="currentSheet$ | async as sheet">
          <fl-key-value>
            <fl-key>{{'flSpreadsheet.total_columns_count' | translate}}</fl-key>
            {{sheet.totalColumnsCount}}
          </fl-key-value>

          <fl-key-value>
            <fl-key>{{'flSpreadsheet.total_rows_count' | translate}}</fl-key>
            {{sheet.totalRowsCount}}
          </fl-key-value>
        </div>

        <fl-async-section [object]="columnTagsColorer$" emptyText="flSpreadsheet.column_filters_no_tags"
                          class="g-section">
          <fl-section-header>
            <h2>{{'flSpreadsheet.column_filters' | translate}}</h2>
          </fl-section-header>

          <ng-container *flSectionBody="let columnTagsColorer">
            <fl-tags-select-colors [tagColorer]="columnTagsColorer"></fl-tags-select-colors>
          </ng-container>
        </fl-async-section>

        <fl-async-section [object]="rowTagsColorer$" emptyText="flSpreadsheet.row_filters_no_tags"
                          class="g-section">
          <fl-section-header>
            <h2>{{'flSpreadsheet.row_filters' | translate}}</h2>
          </fl-section-header>

          <ng-container *flSectionBody="let rowTagColorer">
            <fl-tags-select-colors [tagColorer]="rowTagColorer"></fl-tags-select-colors>
          </ng-container>
        </fl-async-section>

      </div>
    </ng-container>
  </fl-section>

</div>

<div class="table-container" fxLayout="row" #tableContainer>
  <div class="table" fxFlex="auto">
    <!--    <thead>-->
    <div fxLayout="row" class="g-full">
      <fl-spreadsheet-header-cell *ngFor="let column of headerColumns; let index = index"
                                  [index]="index - 1" type="column"
                                  class="column-header-cell"></fl-spreadsheet-header-cell>
    </div>
    <!--    </thead>-->
    <div fxLayout="column" class="g-full">
      <div *ngFor="let row of rows$ | async; trackBy: trackByRowsId" fxLayout="row" class="g-full">
        <!--  Row header cells  -->
        <fl-spreadsheet-header-cell [index]="row.rowId" type="row" class="header-cell"></fl-spreadsheet-header-cell>
        <fl-spreadsheet-cell *ngFor="let cell of row.cells; let columnIndex = index" [cell]="cell"
                             [row]="row.rowId" [column]="columnIndex" class="cell"></fl-spreadsheet-cell>

      </div>
    </div>

  </div>


  <!-- Manage the scroll -->
  <div class="scroll-container" #scroller>
    <div class="scroller" #heightSimulator></div>
  </div>


</div>

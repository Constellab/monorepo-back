<div class="table-container" fxLayout="row" #tableContainer>
  <div class="horizontal-scroll">
    <table class="table">
      <thead>
      <tr>
        <fl-spreadsheet-header-cell *ngFor="let column of headerColumns; let index = index"
                                    [index]="index - 1" type="column"
                                    class="header-cell"
                                    flResize="width"></fl-spreadsheet-header-cell>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let row of rows$ | async; trackBy: trackByRowsId">
        <!--  Row header cells  -->
        <fl-spreadsheet-header-cell [index]="row.rowId" type="row"></fl-spreadsheet-header-cell>
        <fl-spreadsheet-cell *ngFor="let cell of row.cells; let columnIndex = index" [cell]="cell"
                             [row]="row.rowId" [column]="columnIndex"></fl-spreadsheet-cell>

      </tr>
      </tbody>

    </table>
  </div>

  <!-- Manage the scroll -->
  <div class="scroll-container" #scroller>
    <div class="scroller" #heightSimulator></div>
  </div>


</div>

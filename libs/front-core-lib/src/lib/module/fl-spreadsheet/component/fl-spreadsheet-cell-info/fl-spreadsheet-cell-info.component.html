<fl-portal>

  <fl-portal-content>

    <fl-key-value>
      <fl-key>{{'flSpreadsheet.cell_value' | translate}}</fl-key>
      <span class="name">{{cell.value$ | async}}</span>
    </fl-key-value>

    <!-- Column  -->
    <ng-container *ngIf="columnInfo">
      <mat-divider class="divider"></mat-divider>
      <div class="g-text-small header">
        <fl-key-value>
          <fl-key>{{'flSpreadsheet.column' | translate}}</fl-key>
          <span class="name">{{columnInfo.name}}</span>
        </fl-key-value>
        <fl-spreadsheet-header-tags [tags]="columnInfo.tags"
                                    [tagColorer]="columnInfo.tagColorer"></fl-spreadsheet-header-tags>
      </div>
    </ng-container>

    <!-- Row  -->
    <ng-container *ngIf="rowInfo">
      <mat-divider class="divider"></mat-divider>
      <div class="g-text-small header">
        <fl-key-value>
          <fl-key>{{'flSpreadsheet.row' | translate}}</fl-key>
          <span class="name">{{rowInfo.name}}</span>
        </fl-key-value>
        <fl-spreadsheet-header-tags [tags]="rowInfo.tags"
                                    [tagColorer]="rowInfo.tagColorer"></fl-spreadsheet-header-tags>
      </div>
    </ng-container>
  </fl-portal-content>
</fl-portal>

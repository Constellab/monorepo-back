<div class="card" fxLayout="column">
  <div fxFlex="auto">
    <ng-content select="fl-card-header">
    </ng-content>
  </div>

  <div fxLayout="row" class="content g-scrollable-element"
       fxFlex="grow" cdkScrollable>

    <!--  Inject card image if it exist  -->
    <ng-content select="fl-card-image"></ng-content>


    <div fxFlex="grow" class="g-full-height">
      <ng-content select="fl-card-body"></ng-content>
    </div>
  </div>

  <ng-content select="fl-card-footer"></ng-content>

</div>

<ng-container *ngIf="datasource.page">
  <div *ngIf="!datasource.page.last; else lastPage" fxLayout="row" fxLayoutAlign="center">
    <button [disabled]="datasource.isLoading"
            mat-stroked-button color="primary" type="button" (click)="loadMoreResults()">
      {{'show_more_result' | translate}}
      <fl-button-loader *ngIf="datasource.nextPageIsLoading"></fl-button-loader>
    </button>
  </div>

  <ng-template #lastPage>
    <div *ngIf="emptyText" class="g-text-light g-text-centered end-result">
      <p>{{emptyText | translate}}</p>
    </div>

  </ng-template>


</ng-container>

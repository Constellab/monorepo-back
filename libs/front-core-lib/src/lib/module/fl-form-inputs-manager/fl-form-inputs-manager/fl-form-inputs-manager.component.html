<mat-chip-list>
  <!-- Remove all chip -->
  <mat-chip *ngIf="resetChip && filledInputs?.length > 0" [color]="chipColor"
            [removable]="true" (removed)="reset()">
    {{'all' | translate}}
    <mat-icon matChipRemove>cancel</mat-icon>
  </mat-chip>
  <mat-chip *ngFor="let input of filledInputs" [color]="chipColor"
            [removable]="true" (removed)="clearInput(input)">
    {{input.name}}
    <mat-icon matChipRemove>cancel</mat-icon>
  </mat-chip>
</mat-chip-list>

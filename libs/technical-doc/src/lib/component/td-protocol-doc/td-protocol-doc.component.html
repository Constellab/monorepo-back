<td-main-doc [entity]="protocol" class="ql-editor"></td-main-doc>

<mat-divider class="divider" *ngIf="protocol.inputSpecs"></mat-divider>

<div class="div-spec ql-editor" *ngIf="protocol.inputSpecs">
  <div class="div-head">
    <mat-icon>login</mat-icon>
    <h3>{{'td.input' | translate}}</h3>
  </div>
  <td-io-doc [ioSpecs]="protocol.inputSpecs"></td-io-doc>
</div>

<mat-divider class="divider" *ngIf="protocol.outputSpecs"></mat-divider>

<div class="div-spec ql-editor" *ngIf="protocol.outputSpecs">
  <div class="div-head">
    <mat-icon>logout</mat-icon>
    <h3>{{'td.output' | translate}}</h3>
  </div>
  <td-io-doc [ioSpecs]="protocol.outputSpecs"></td-io-doc>
</div>

<mat-divider class="divider" *ngIf="protocol.configSpecs"></mat-divider>

<div class="div-spec ql-editor" *ngIf="protocol.configSpecs">
  <div class="div-head">
    <mat-icon>settings</mat-icon>
    <h3>{{'td.configuration' | translate}}</h3>
  </div>

  <td-config [configSpecs]="protocol.configSpecs"></td-config>
</div>

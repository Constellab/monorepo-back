<div class="io-div" *ngFor="let io of ioSpecs|  flObjectKeys">
  <div class="io-div-head">
    <div class="io-human-name">{{ioSpecs[io].human_name}} : </div>
    <span *ngFor="let r of ioSpecs[io].resource_types; let first= first">
      <span *ngIf="!first">,</span>
        <td-io-resource [resource]="r"></td-io-resource>
    </span>
  </div>
  <div *ngIf="ioSpecs[io].short_description" class="g-text-small-em g-text-light">
    {{ioSpecs[io].short_description}}
  </div>
</div>

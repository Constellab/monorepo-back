<fl-key-value *ngIf="doc.status" class="key-val">
  <fl-key>{{'td.status' | translate}}</fl-key>
  {{doc.status}}
</fl-key-value>
<fl-key-value *ngIf="doc.parentTypingName" class="key-val">
  <fl-key>{{'td.parent' | translate}}</fl-key>
  <a class="g-text-link"
     [routerLink]="docParentBrickName + '/' + (doc.parentVersion ?doc.parentVersion : 'latest')  +
            '/doc/technical-folder/' + doc.objectType.toLowerCase() + '/' + docParentUniqueName"
     [relativeTo]="activatedRoute.parent.parent.parent">
    {{doc.parentHumanName}}
  </a>
  v.{{doc.parentVersion}}
</fl-key-value>
<p>{{doc.shortDescription}}</p>
<div class="technical-doc-content" [innerHTML]="docContent"></div>

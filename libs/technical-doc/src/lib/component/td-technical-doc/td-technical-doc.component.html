<div class="doc-title-div" fxLayout="row" fxLayoutAlign="space-between center">
  <h1 class="doc-title">{{technicalDoc.humanName}}</h1>
  <div class="chip-list">
    <fl-chip class="deprecated-chip g-warn-background" *ngIf="technicalDoc.deprecatedSince">
      {{'td.deprecated' | translate}}
    </fl-chip>
    <fl-chip class="g-primary-background" *ngIf="technicalDoc.objectSubType">
      {{technicalDoc.objectSubType}}
    </fl-chip>
  </div>

</div>


<div class="tech-doc ql-bubble">
  <td-resource-doc [resource]="$any(technicalDoc)"
                   *ngIf="technicalDoc.objectType === 'RESOURCE'">
  </td-resource-doc>
  <td-process-doc [process]="$any(technicalDoc)"
                  *ngIf="technicalDoc.objectType === 'TASK' ||
                  technicalDoc.objectType === 'PROTOCOL'">
  </td-process-doc>
</div>

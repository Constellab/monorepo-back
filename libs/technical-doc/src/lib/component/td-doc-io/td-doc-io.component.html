<div class="io-div-head">
  <div class="io-human-name">{{ioSpec.human_name}}</div>
  <div class="io-chip-div">
    <fl-chip class="g-primary-background chip" *ngIf="ioSpec.is_optional && !ioSpec.is_skippable" matTooltip="{{'td.optional_tooltip' | translate}}">
      {{'td.optional' | translate}}
    </fl-chip>
    <fl-chip class="g-primary-background chip" *ngIf="ioSpec.is_skippable" matTooltip="{{'td.skippable_tooltip' | translate}}">
      {{'td.skippable' | translate}}
    </fl-chip>
    <fl-chip class="g-primary-background chip" *ngIf="ioSpec.is_constant" matTooltip="{{'td.constant_tooltip' | translate}}">
      {{'td.constant' | translate}}
    </fl-chip>
  </div>
</div>
<span *ngFor="let r of ioSpec.resource_types; let first= first" class="io-specification">
      <span *ngIf="!first">,</span>
        <td-io-resource [resource]="r"></td-io-resource>
</span>
<div *ngIf="ioSpec.short_description" class="g-text-small-em g-text-light">
  {{ioSpec.short_description}}
</div>

<td-main-doc [entity]="process" class="ql-editor"></td-main-doc>

<fl-key-value *ngIf="process.additionalInfo && process.additionalInfo.supported_extensions && process.additionalInfo.supported_extensions.length > 0"
              class="key-val ql-editor div-spec">
  <fl-key>{{'td.supported_extensions' |translate}}</fl-key>
  {{process.additionalInfo.supported_extensions.join(', ')}}
</fl-key-value>

<ng-container *ngIf="process.inputSpecs | flIsNotEmpty">
  <mat-divider class="divider"></mat-divider>

  <div class="div-spec ql-editor">
    <div class="div-head">
      <mat-icon>login</mat-icon>
      <h3>{{'td.input' | translate}}</h3>
    </div>
    <td-io-doc [ioSpecs]="process.inputSpecs"></td-io-doc>
  </div>
</ng-container>

<ng-container *ngIf="process.outputSpecs | flIsNotEmpty">
  <mat-divider class="divider"></mat-divider>

  <div class="div-spec ql-editor">
    <div class="div-head">
      <mat-icon>logout</mat-icon>
      <h3>{{'td.output' | translate}}</h3>
    </div>
    <td-io-doc [ioSpecs]="process.outputSpecs"></td-io-doc>
  </div>
</ng-container>

<ng-container *ngIf="process.configSpecs | flIsNotEmpty">
  <mat-divider class="divider" ></mat-divider>

  <div class="div-spec ql-editor">
    <div class="div-head">
      <mat-icon>settings</mat-icon>
      <h3>{{'td.configuration' | translate}}</h3>
    </div>

    <td-config [configSpecs]="process.configSpecs"></td-config>
  </div>
</ng-container>

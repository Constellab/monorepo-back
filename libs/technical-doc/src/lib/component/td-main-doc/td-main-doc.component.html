
<div class="g-text-editor-hint g-text-editor-hint-warning deprecated-message-div" *ngIf="entity.deprecatedSince">
  <div><strong>{{'td.deprecated_since' | translate}} : {{entity.deprecatedSince}}</strong></div>
  <div>{{entity.deprecatedMessage}}</div>
</div>

<fl-key-value *ngIf="entity.status" class="key-val">
  <fl-key>{{'td.status' | translate}}</fl-key>
  {{entity.status}}
</fl-key-value>
<fl-key-value *ngIf="entity.parentTypingName" class="key-val">
  <fl-key>{{'td.parent' | translate}}</fl-key>
  <td-tech-doc-link [uniqueElement]="uniqueEntityParent"></td-tech-doc-link>
  v.{{entity.parentVersion}}
</fl-key-value>
<p>{{entity.shortDescription}}</p>

<div class="technical-doc-content" [innerHTML]="entity.doc | tdMarkdown"></div>

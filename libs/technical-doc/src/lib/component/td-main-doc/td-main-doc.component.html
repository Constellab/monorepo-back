<div class="deprecated-message-div ql-editor" *ngIf="_entity.deprecatedSince">
  <div class="g-text-editor-hint g-text-editor-hint-warning">
    <div><strong>{{'td.deprecated_since' | translate}} : {{_entity.deprecatedSince}}</strong></div>
    <div>{{_entity.deprecatedMessage}}</div>
  </div>
</div>

<!-- Type unavailable -->
<div *ngIf="_entity.status === 'UNAVAILABLE'">
  <fl-key-value  class="key-val">
    <fl-key>{{'td.status' | translate}}</fl-key>
    {{_entity.status}}
  </fl-key-value>

  <td-type-unavailable [typingName]="_entity.typingName"></td-type-unavailable>
</div>

<fl-key-value *ngIf="_entity.parentTypingName" class="key-val parent-link-div">
  <fl-key>{{'td.parent' | translate}}</fl-key>
  <div class="parent-link-div">
    <div class="resource-color-div" [style.background-color]="color" *ngIf="entityParentType==='RESOURCE'"></div>
    <td-tech-doc-link [uniqueElement]="uniqueEntityParent"></td-tech-doc-link>
    v.{{_entity.parentVersion}}
  </div>
</fl-key-value>
<p>{{_entity.shortDescription}}</p>

<div class="technical-doc-content ql-editor markdown" [innerHTML]="(_entity.doc | tdMarkdown)"></div>

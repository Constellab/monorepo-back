<div>

  <div fxLayout="column" fxLayoutAlign="space-between center">

    <!-- Title   -->
    <div class="name g- g-text-small">
      {{title$ | async | flTranslatableText}}
    </div>


    <!--  actions -->
    <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="0.5em">
      <button mat-icon-button type="button"
              (click)="openNodeDetail()" [matTooltip]="'pr.open_node_detail' | translate">
        <mat-icon>info</mat-icon>
      </button>

      <button mat-icon-button type="button" *ngIf="(isConfigured$ | async) === false"
              (click)="openNodeDetail()" [matTooltip]="'pr.viewer_not_configured' | translate">
        <mat-icon>warnings</mat-icon>
      </button>

      <button *ngIf="isSuccess$ | async" mat-stroked-button type="button" (click)="callView()"
              [matTooltip]="'pr.show_view' | translate" class="g-button-small">
        <mat-icon>visibility</mat-icon>
      </button>


    </div>
  </div>

</div>

<h2 class="config-dialog-title">{{'config' | translate}}</h2>

<table mat-table [dataSource]="configDataSource" class="mat-elevation-z8">

  <!--- Note that these columns can be defined in any order.
        The actual rendered columns are set as a property on the row definition" -->

  <!-- Position Column -->
  <ng-container matColumnDef="human_name">
    <th mat-header-cell *matHeaderCellDef> {{'pr.human_name' | translate}} </th>
    <td mat-cell *matCellDef="let element" class="cell"> {{element.human_name}} </td>
  </ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="short_description">
    <th mat-header-cell *matHeaderCellDef> {{'pr.short_description' | translate}} </th>
    <td mat-cell *matCellDef="let element" class="cell"> {{element.short_description}} </td>
  </ng-container>

  <!-- Weight Column -->
  <ng-container matColumnDef="default_value">
    <th mat-header-cell *matHeaderCellDef> {{'pr.default_value' | translate}} </th>
    <td mat-cell *matCellDef="let element" class="cell"> {{element.default_value}} </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<div fxLayout="row wrap" fxLayoutAlign="start center" fxLayoutGap="1em" class="g-text-light">
  <ng-container *ngFor="let layer of layers$ | async; let last = last">
    <div class="g-text-link" (click)="selectLayer(layer.id)">
      {{layer.title}}
    </div>

    <span class="separator" *ngIf="!last">></span>
  </ng-container>

</div>
